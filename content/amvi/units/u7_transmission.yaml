cards:
  # ---------- Clutch ----------
  - id: f01
    topic: u7.clutch
    difficulty: 1
    learn: "A clutch connects and disconnects the engine from the gearbox."
    why: "We must disconnect the engine to start, stop and change gears smoothly."
    q: "Main function of a clutch?"
    a: "Engage and disengage engine power to the gearbox."
    simple: "It joins and separates engine and gearbox."
  - id: f02
    topic: u7.clutch
    difficulty: 2
    learn: "Friction clutch principle: two friction surfaces pressed together by springs turn together; separated, they turn freely."
    why: "Friction passes the torque."
    q: "Principle of a friction clutch?"
    a: "Friction between surfaces pressed together transmits torque."
    simple: "Pressed plates grip and turn together."
  - id: f03
    topic: u7.clutch
    difficulty: 2
    learn: "Torque transmitted by a clutch T = μ W R n (μ friction coefficient, W spring force, R mean radius, n number of friction faces)."
    why: "More pressure, more radius or more faces give more torque."
    q: "Factors affecting clutch torque capacity?"
    a: "μ, spring force, mean radius, number of friction surfaces."
    simple: "Grip × push × size × faces."
  - id: f04
    topic: u7.clutch
    difficulty: 2
    learn: "Requirements of a clutch: smooth engagement, quick disengagement, enough torque capacity, good heat dissipation, low inertia of driven parts, light pedal."
    why: "Each makes gear changes easy and long-lasting."
    q: "Why should the clutch plate have low inertia?"
    a: "So it stops quickly for easy gear changes."
    simple: "Light plate stops fast."
  - id: f05
    topic: u7.clutch
    difficulty: 2
    learn: "Single plate dry clutch parts: flywheel, clutch (friction) plate, pressure plate, clutch springs, cover, release levers, release (thrust) bearing, clutch shaft."
    why: "The friction plate is clamped between flywheel and pressure plate."
    q: "The clutch plate is clamped between which two parts?"
    a: "Flywheel and pressure plate."
    simple: "The plate is a sandwich filling."
  - id: f06
    topic: u7.clutch
    difficulty: 2
    learn: "Clutch plate is splined to the gearbox input (clutch) shaft, so it can slide but must turn with it."
    why: "It slides to engage and disengage."
    q: "How is the clutch plate fixed to the clutch shaft?"
    a: "By splines."
    simple: "Grooves let it slide but not spin alone."
  - id: f07
    topic: u7.clutch
    difficulty: 2
    learn: "Clutch plate has friction linings on both sides, torsional (damper) springs in the hub and cushion springs (wavy segments) between the linings."
    why: "Damper springs absorb shocks; cushion springs give smooth take-up."
    q: "Purpose of torsional springs in the clutch plate hub?"
    a: "Absorb shocks and torsional vibration."
    simple: "Little springs cushion jerks."
  - id: f08
    topic: u7.clutch
    difficulty: 2
    learn: "When the pedal is pressed, the release bearing pushes the levers (or diaphragm fingers), pulling the pressure plate back so the clutch plate is free."
    why: "Spring force is removed from the plate."
    q: "What happens when the clutch pedal is pressed?"
    a: "Pressure plate moves back; clutch disengages."
    simple: "Pedal down = plates apart."
  - id: f09
    topic: u7.clutch
    difficulty: 2
    learn: "Coil spring clutch uses several coil springs around the pressure plate."
    why: "Older design; springs weaken at high speed due to centrifugal force."
    q: "Clutch using several coil springs around the pressure plate?"
    a: "Coil spring (single plate) clutch."
    simple: "Many springs push the plate."
  - id: f10
    topic: u7.clutch
    difficulty: 2
    learn: "Diaphragm clutch uses one dish-shaped steel diaphragm spring instead of coil springs. Its fingers act as release levers."
    why: "Lighter, fewer parts, even pressure, lower pedal effort."
    q: "What replaces coil springs in a diaphragm clutch?"
    a: "A single diaphragm (Belleville) spring."
    simple: "One dish-shaped spring does it all."
  - id: f11
    topic: u7.clutch
    difficulty: 2
    learn: "Diaphragm clutch advantages: compact, balanced, less pedal effort, pressure does not drop much as lining wears, not affected by centrifugal force."
    why: "It is used in almost all modern cars."
    q: "Clutch used in most modern cars?"
    a: "Diaphragm spring clutch."
    simple: "Simple and light to press."
  - id: f12
    topic: u7.clutch
    difficulty: 2
    learn: "Multi-plate clutch has several driving and driven plates stacked together."
    why: "More friction faces give more torque in a small diameter."
    example: "Motorcycles, scooters with gears, heavy vehicles and automatic gearboxes."
    q: "Why is a multi-plate clutch used in motorcycles?"
    a: "High torque in small diameter."
    simple: "Many small plates instead of one big one."
  - id: f13
    topic: u7.clutch
    difficulty: 2
    learn: "Wet clutch runs in oil; dry clutch runs without oil. Motorcycle multi-plate clutches are usually wet."
    why: "Oil cools and smooths engagement, but lowers friction (more plates needed)."
    q: "Do most motorcycle clutches run wet or dry?"
    a: "Wet (in oil)."
    simple: "Wet clutch sits in oil."
  - id: f14
    topic: u7.clutch
    difficulty: 2
    learn: "Cone clutch: friction surfaces are cone-shaped. The wedge action gives high torque for little spring force."
    why: "Pressure on a cone multiplies normal force."
    q: "Clutch with conical friction surfaces?"
    a: "Cone clutch."
    simple: "A cone pushed into a cup."
  - id: f15
    topic: u7.clutch
    difficulty: 2
    learn: "Cone clutch drawbacks: tends to stick (grab) and is hard to disengage; used now mostly in synchromesh units."
    why: "Small cone angle makes it jam."
    q: "Where is the cone clutch principle used today?"
    a: "In synchromesh gearboxes (synchro cones)."
    simple: "Cone clutches live inside synchros."
  - id: f16
    topic: u7.clutch
    difficulty: 2
    learn: "Centrifugal clutch engages automatically as engine speed rises: weights fly out and press the shoes on a drum."
    why: "No clutch pedal needed."
    example: "Gearless scooters, mopeds, chain saws."
    q: "Which clutch engages automatically with engine speed?"
    a: "Centrifugal clutch."
    simple: "Spin faster and it grips by itself."
  - id: f17
    topic: u7.clutch
    difficulty: 2
    learn: "Semi-centrifugal clutch uses both springs and centrifugal weights. Springs carry normal torque; weights add pressure at high speed."
    why: "Lighter springs give a lighter pedal at low speed."
    q: "Clutch using both springs and centrifugal force?"
    a: "Semi-centrifugal clutch."
    simple: "Springs plus flying weights."
  - id: f18
    topic: u7.clutch
    difficulty: 2
    learn: "Vacuum clutch uses engine manifold vacuum to operate the clutch through a vacuum cylinder, often triggered by a switch on the gear lever."
    why: "No clutch pedal effort for the driver."
    q: "What power operates a vacuum clutch?"
    a: "Engine manifold vacuum."
    simple: "Vacuum pulls the clutch apart."
  - id: f19
    topic: u7.clutch
    difficulty: 2
    learn: "Hydraulic clutch uses a master cylinder at the pedal and a slave cylinder at the clutch to operate the release fork."
    why: "Smooth, self-adjusting and easy to route."
    q: "Two cylinders in a hydraulic clutch?"
    a: "Master cylinder and slave cylinder."
    simple: "Oil carries pedal push to the clutch."
  - id: f20
    topic: u7.clutch
    difficulty: 2
    learn: "Electromagnetic clutch: an electromagnet pulls the plates together when current flows."
    why: "Can be switched electrically."
    example: "Car AC compressor clutch."
    q: "Where is an electromagnetic clutch used in a car?"
    a: "AC compressor."
    simple: "Electric magnet grabs the plate."
  - id: f21
    topic: u7.clutch
    difficulty: 2
    learn: "Fluid flywheel (fluid coupling): a driving impeller (pump) and a driven turbine (runner) face each other in oil. Oil thrown by the pump drives the turbine."
    why: "Power passes through oil with no mechanical contact."
    q: "Two main members of a fluid flywheel?"
    a: "Impeller (pump) and turbine (runner)."
    simple: "One fan throws oil to spin another."
  - id: f22
    topic: u7.clutch
    difficulty: 2
    learn: "Fluid coupling cannot multiply torque. Output torque = input torque; there is always some slip (about 2%)."
    why: "There is no reaction member (stator)."
    q: "Can a fluid coupling increase torque?"
    a: "No."
    simple: "Same torque out, a little slip."
  - id: f23
    topic: u7.clutch
    difficulty: 2
    learn: "Fluid flywheel advantages: smooth start, no wear, absorbs shocks, engine does not stall when vehicle stops."
    why: "Slip at idle lets the engine keep running."
    q: "Advantage of a fluid flywheel?"
    a: "Smooth take-up, no wear, shock absorption."
    simple: "Smooth and never wears out."
  - id: f24
    topic: u7.clutch
    difficulty: 2
    learn: "Clutch linings: organic (non-asbestos), ceramic, sintered metal (cerametallic), Kevlar."
    why: "Need high friction, heat and wear resistance."
    q: "Name one clutch lining material."
    a: "Organic, ceramic, sintered metal, Kevlar."
    simple: "Grippy, heat-proof material."
  - id: f25
    topic: u7.clutch
    difficulty: 2
    learn: "Clutch pedal free play: small pedal movement before the release bearing touches the levers (about 20–25 mm)."
    why: "Without it, the clutch slips and the bearing wears."
    q: "Effect of no clutch pedal free play?"
    a: "Clutch slip and release bearing wear."
    simple: "A little slack keeps the clutch fully engaged."
  - id: f26
    topic: u7.clutch
    difficulty: 2
    learn: "Clutch slip: engine speed rises but vehicle does not speed up. Causes: worn or oily linings, weak springs, no free play."
    why: "Not enough grip."
    q: "Engine revs rise without vehicle speeding up — what is the fault?"
    a: "Clutch slip."
    simple: "Engine roars, car does not go."
  - id: f27
    topic: u7.clutch
    difficulty: 2
    learn: "Clutch drag: clutch does not fully disengage, so gears grind. Causes: too much free play, warped plate, air in hydraulic clutch."
    why: "Plate keeps spinning."
    q: "Gears grind when changing even with clutch pressed — what fault?"
    a: "Clutch drag (not disengaging)."
    simple: "Clutch never fully lets go."
  - id: f28
    topic: u7.clutch
    difficulty: 2
    learn: "Clutch judder (grabbing): jerky take-up. Causes: oily or glazed linings, worn mountings, warped plates."
    why: "Grip comes on unevenly."
    q: "Jerky clutch take-up is called?"
    a: "Clutch judder (grabbing)."
    simple: "Shaky start = judder."
  - id: sum
    topic: u7.clutch
    type: summary
    points:
      - "Friction clutch: T = μWRn."
      - "Single plate (coil springs), diaphragm (cars), multi-plate wet (bikes)."
      - "Cone, centrifugal (scooters), semi-centrifugal, vacuum, hydraulic, electromagnetic (AC)."
      - "Fluid flywheel: impeller + turbine, no torque multiplication."
      - "Faults: slip, drag, judder; keep pedal free play."

  # ---------- Gearbox ----------
  - id: f01
    topic: u7.gearbox
    difficulty: 1
    learn: "A gearbox (transmission) changes the torque and speed from the engine to suit the road, and gives reverse and neutral."
    why: "Engine torque is limited; starting and climbing need more."
    q: "Why is a gearbox needed?"
    a: "Vary torque and speed, give reverse and neutral."
    simple: "Low gear for pulling, high gear for speed."
  - id: f02
    topic: u7.gearbox
    difficulty: 2
    learn: "Resistances to vehicle motion: rolling resistance, air resistance, gradient resistance."
    why: "Total resistance changes, so the needed torque changes."
    q: "Three resistances acting on a moving vehicle?"
    a: "Rolling, air and gradient resistance."
    simple: "Road, wind and hill."
  - id: f03
    topic: u7.gearbox
    difficulty: 2
    learn: "Air resistance increases with the square of speed."
    why: "Faster air hits harder and more often."
    q: "Air resistance varies with speed how?"
    a: "As the square of speed."
    simple: "Twice as fast = four times wind drag."
  - id: f04
    topic: u7.gearbox
    difficulty: 2
    learn: "Low gear: high torque, low speed. High gear: low torque, high speed. Top gear is often direct (1:1); overdrive is less than 1:1."
    why: "Gear ratio trades speed for torque."
    q: "Gear ratio of an overdrive?"
    a: "Less than 1:1 (output faster than input)."
    simple: "Overdrive spins the output faster than the engine."
  - id: f05
    topic: u7.gearbox
    difficulty: 2
    learn: "Gearbox types: sliding mesh, constant mesh, synchromesh, epicyclic, automatic, CVT."
    why: "Each improved ease of shifting."
    q: "Name three types of manual gearbox."
    a: "Sliding mesh, constant mesh, synchromesh."
    simple: "Old to new: sliding, constant, synchro."
  - id: f06
    topic: u7.gearbox
    difficulty: 2
    learn: "Sliding mesh gearbox: gears on the main shaft slide along splines to mesh with gears on the countershaft (lay shaft)."
    why: "Simplest design."
    q: "In which gearbox do the gears themselves slide to mesh?"
    a: "Sliding mesh gearbox."
    simple: "Gears move to bite each other."
  - id: f07
    topic: u7.gearbox
    difficulty: 2
    learn: "Sliding mesh gearboxes use spur gears and need double de-clutching to change gears quietly."
    why: "Gear speeds must match before meshing."
    q: "Shifting technique needed in a sliding mesh gearbox?"
    a: "Double de-clutching."
    simple: "Clutch twice to match speeds."
  - id: f08
    topic: u7.gearbox
    difficulty: 2
    learn: "Gearbox shafts: primary (input/clutch) shaft, lay shaft (countershaft), main (output) shaft, reverse idler shaft."
    why: "Lay shaft is driven by the input and drives main shaft gears."
    q: "Shaft parallel to the main shaft carrying cluster gears?"
    a: "Lay shaft (countershaft)."
    simple: "Input → lay shaft → output."
  - id: f09
    topic: u7.gearbox
    difficulty: 2
    learn: "Reverse gear uses an idler gear between lay shaft and main shaft to reverse direction."
    why: "An extra gear flips rotation."
    q: "What gives reverse in a manual gearbox?"
    a: "Reverse idler gear."
    simple: "One extra gear makes it go backward."
  - id: f10
    topic: u7.gearbox
    difficulty: 2
    learn: "Constant mesh gearbox: all gears are always in mesh. Main shaft gears spin freely; dog clutches lock the selected gear to the shaft."
    why: "Teeth are not damaged during shifting, and helical gears can be used."
    q: "In a constant mesh gearbox, what locks the gear to the shaft?"
    a: "Dog clutch."
    simple: "Gears always mesh; a dog clutch picks one."
  - id: f11
    topic: u7.gearbox
    difficulty: 2
    learn: "Constant mesh gearboxes are quieter and allow helical gears, but still need double de-clutching."
    why: "Dog clutches have no speed-matching."
    q: "Advantage of constant mesh over sliding mesh?"
    a: "Quieter, helical gears, less tooth damage."
    simple: "Quieter, but still not easy shifting."
  - id: f12
    topic: u7.gearbox
    difficulty: 2
    learn: "Synchromesh gearbox: like constant mesh, but has synchronisers (cone clutches) that match gear speeds before the dog teeth engage."
    why: "No double de-clutching; quiet, easy shifts."
    q: "Device that equalises gear speeds before engagement?"
    a: "Synchroniser (synchro cone)."
    simple: "A small cone clutch matches speeds first."
  - id: f13
    topic: u7.gearbox
    difficulty: 2
    learn: "Synchroniser types: constant load (pin type) and inertia lock (baulk ring type). Baulk ring is common."
    why: "Baulk ring prevents engagement until speeds are equal."
    q: "Most common synchroniser type?"
    a: "Inertia lock (baulk ring)."
    simple: "Baulk ring blocks until speeds match."
  - id: f14
    topic: u7.gearbox
    difficulty: 2
    learn: "Synchromesh is used in all modern manual cars. Reverse gear is often not synchronised."
    why: "Reverse is engaged only when stopped."
    q: "Which gear often has no synchromesh?"
    a: "Reverse."
    simple: "Stop fully before selecting reverse."
  - id: f15
    topic: u7.gearbox
    difficulty: 2
    learn: "Progressive gearbox: gears must be changed in order (1-2-3-4), one after another, as in motorcycles."
    why: "A rotating drum selects gears in sequence."
    example: "Motorcycles: one down, rest up (1-N-2-3-4-5)."
    q: "Gearbox where gears are changed one after another in sequence?"
    a: "Progressive (sequential) gearbox."
    simple: "Step by step, no skipping."
  - id: f16
    topic: u7.gearbox
    difficulty: 2
    learn: "Selective gearbox: any gear can be selected directly from neutral (H-pattern in cars)."
    why: "Gear lever moves in a gate."
    q: "Car gearboxes with H-pattern are which type?"
    a: "Selective."
    simple: "Pick any gear directly."
  - id: f17
    topic: u7.gearbox
    difficulty: 2
    learn: "Epicyclic gearbox: uses planetary gear sets (sun, planets, carrier, annulus). Holding one member with a brake band or clutch gives different ratios."
    why: "Gears always in mesh; shifting without breaking power."
    example: "Wilson pre-selector gearbox; automatic transmissions."
    q: "How are ratios obtained in an epicyclic gearbox?"
    a: "By holding one member (sun, carrier or annulus) with brakes/clutches."
    simple: "Lock one part, the others give a new ratio."
  - id: f18
    topic: u7.gearbox
    difficulty: 2
    learn: "In a planetary set: hold annulus, drive sun → reduction (low gear). Lock any two members → direct drive. Hold carrier → reverse."
    why: "These rules give all basic ratios."
    q: "Holding the planet carrier in an epicyclic set gives?"
    a: "Reverse."
    simple: "Carrier held = reverse; two locked = direct."
  - id: f19
    topic: u7.gearbox
    difficulty: 2
    learn: "Torque converter: like a fluid coupling with a third member, the stator (reactor), which multiplies torque (up to about 2–2.5 times) at low speed."
    why: "The stator redirects oil back to the impeller to add push."
    q: "Which member of a torque converter multiplies torque?"
    a: "Stator (reactor)."
    simple: "A fluid coupling plus a stator."
  - id: f20
    topic: u7.gearbox
    difficulty: 2
    learn: "Torque converter members: impeller (pump, connected to engine), turbine (connected to gearbox), stator (on a one-way clutch)."
    why: "The one-way clutch lets the stator freewheel at coupling speed."
    q: "On what is the stator mounted?"
    a: "A one-way (freewheel) clutch."
    simple: "The stator only locks one way."
  - id: f21
    topic: u7.gearbox
    difficulty: 2
    learn: "Coupling point: speed at which the turbine almost matches the impeller and the stator starts to freewheel. Converter then acts as a fluid coupling."
    why: "Torque multiplication ends there."
    q: "Point where torque converter starts acting as a fluid coupling?"
    a: "Coupling point."
    simple: "When torque boost ends."
  - id: f22
    topic: u7.gearbox
    difficulty: 2
    learn: "Lock-up clutch in modern torque converters mechanically joins impeller and turbine at cruising speed."
    why: "Removes slip and saves fuel."
    q: "Why is a lock-up clutch fitted in a torque converter?"
    a: "Remove slip, improve fuel economy."
    simple: "Lock it solid when cruising."
  - id: f23
    topic: u7.gearbox
    difficulty: 2
    learn: "Fluid coupling vs torque converter: coupling has 2 members and no torque multiplication; converter has 3 members (with stator) and multiplies torque."
    why: "Common comparison question."
    q: "How many elements in a basic torque converter?"
    a: "Three (impeller, turbine, stator)."
    simple: "Two for coupling, three for converter."
  - id: f24
    topic: u7.gearbox
    difficulty: 2
    learn: "Automatic transmission (AT): torque converter + epicyclic gear sets + hydraulic/electronic controls that shift gears without driver action."
    why: "Driver only selects P, R, N, D."
    q: "Main parts of a conventional automatic transmission?"
    a: "Torque converter, planetary gear sets, hydraulic/electronic control."
    simple: "Converter plus planet gears, shifted by computer."
  - id: f25
    topic: u7.gearbox
    difficulty: 2
    learn: "Automatic selector positions: P (park — locks output), R (reverse), N (neutral), D (drive), L/2 (low)."
    why: "P uses a parking pawl to lock the gearbox."
    q: "What locks the output shaft in Park?"
    a: "Parking pawl."
    simple: "P locks the wheels through the gearbox."
  - id: f26
    topic: u7.gearbox
    difficulty: 2
    learn: "Engine can be started only in P or N in automatics (neutral safety switch)."
    why: "Prevents the car moving on starting."
    q: "In which positions can an automatic car be started?"
    a: "P or N."
    simple: "Start only in Park or Neutral."
  - id: f27
    topic: u7.gearbox
    difficulty: 2
    learn: "AMT (automated manual transmission): a normal manual gearbox where an ECU and actuators work the clutch and gear shifts."
    why: "Cheap automatic used in many Indian small cars."
    q: "Gearbox that is a manual box with automatic clutch and shift actuators?"
    a: "AMT (automated manual transmission)."
    simple: "A manual box shifted by a robot."
  - id: f28
    topic: u7.gearbox
    difficulty: 2
    learn: "DCT (dual clutch transmission): two clutches, one for odd and one for even gears, giving very fast shifts."
    why: "Next gear is pre-selected on the other shaft."
    q: "In DCT, why are there two clutches?"
    a: "One for odd gears, one for even gears, for fast shifts."
    simple: "Next gear is always ready."
  - id: f29
    topic: u7.gearbox
    difficulty: 2
    learn: "CVT (continuously variable transmission): gives endless ratios between limits using two variable-width pulleys and a belt or chain."
    why: "Engine can stay at its best speed."
    example: "Gearless scooters use a CVT with a rubber V-belt."
    q: "What transmission do gearless scooters use?"
    a: "CVT (variable pulley and V-belt)."
    simple: "Pulleys change size smoothly; no steps."
  - id: f30
    topic: u7.gearbox
    difficulty: 2
    learn: "In a scooter CVT, centrifugal rollers push the drive pulley halves together as speed rises, making the belt ride higher and the ratio taller."
    why: "Automatic change with speed."
    q: "What changes the drive pulley size in a scooter CVT?"
    a: "Centrifugal rollers (variator weights)."
    simple: "Spinning rollers push the pulley closed."
  - id: f31
    topic: u7.gearbox
    difficulty: 2
    learn: "Two-wheeler transmissions: primary drive (engine to clutch, by gears or chain), gearbox (constant mesh, sequential), final drive (chain, belt or shaft)."
    why: "Each stage reduces speed."
    q: "Most common final drive in motorcycles?"
    a: "Chain drive."
    simple: "Engine → gears → chain → wheel."
  - id: f32
    topic: u7.gearbox
    difficulty: 2
    learn: "Chain drive: cheap, efficient (about 98%), but needs lubrication and tension adjustment. Belt drive: quiet and clean. Shaft drive: little maintenance, heavier."
    why: "Each has trade-offs."
    q: "Final drive needing regular tension adjustment?"
    a: "Chain drive."
    simple: "Chains need oil and tightening."
  - id: f33
    topic: u7.gearbox
    difficulty: 2
    learn: "Gear selector mechanism: gear lever moves selector rods (rails), which move selector forks that slide synchro sleeves or gears."
    why: "This transfers the driver's hand motion into the box."
    q: "Part that slides the synchro sleeve?"
    a: "Selector fork."
    simple: "Lever → rod → fork → sleeve."
  - id: f34
    topic: u7.gearbox
    difficulty: 2
    learn: "Interlock mechanism prevents two gears from being engaged at the same time."
    why: "Two gears at once would lock the gearbox."
    q: "What stops two gears engaging together?"
    a: "Interlock mechanism."
    simple: "One gear at a time only."
  - id: f35
    topic: u7.gearbox
    difficulty: 2
    learn: "Detent (locating) mechanism: spring-loaded balls in notches hold the selector rod in each gear position."
    why: "Prevents jumping out of gear."
    q: "What holds the selected gear in position?"
    a: "Detent balls and springs."
    simple: "Spring balls click into place."
  - id: f36
    topic: u7.gearbox
    difficulty: 2
    learn: "Jumping out of gear causes: worn detents, worn dog teeth or synchro, weak springs, misaligned engine mounts."
    why: "Gear is not held firmly."
    q: "Name one cause of a gear slipping out."
    a: "Worn detent spring/ball or worn dog teeth."
    simple: "Worn locks let gears pop out."
  - id: f37
    topic: u7.gearbox
    difficulty: 2
    learn: "Transfer case (4WD vehicles) splits power between front and rear axles and often gives a low range."
    why: "Extra grip and low ratio for off-road."
    q: "Unit that sends drive to both axles in 4WD?"
    a: "Transfer case."
    simple: "Shares power front and back."
  - id: s01
    topic: u7.gearbox
    type: steps
    difficulty: 3
    title: "Worked example: overall gear ratio"
    steps:
      - text: "Question: First gear ratio is 3.5:1 and final drive is 4:1. Find overall ratio."
      - text: "Overall ratio = gearbox ratio × final drive ratio."
      - text: "= 3.5 × 4 = 14 : 1."
      - text: "Engine turns 14 times for one wheel turn; torque at wheel ≈ 14 × engine torque (ignoring losses)."
    summary:
      - "Overall = gearbox × final drive."
      - "Torque multiplies by the same ratio."
    q: "Gear 3.5:1 and final drive 4:1 give overall ratio?"
    a: "14 : 1"
  - id: sum
    topic: u7.gearbox
    type: summary
    points:
      - "Sliding mesh (double de-clutch) → constant mesh (dog clutch) → synchromesh (cone)."
      - "Progressive (bikes) vs selective (cars)."
      - "Epicyclic: sun, planets, carrier, annulus; hold carrier = reverse."
      - "Torque converter = impeller + turbine + stator (torque ×2)."
