  # ---------- Driveline ----------
  - id: f01
    topic: u7.driveline
    difficulty: 1
    learn: "Propeller shaft carries power from the gearbox to the rear axle (differential) in front-engine rear-drive vehicles."
    why: "Gearbox and axle are far apart."
    q: "Shaft connecting gearbox to differential?"
    a: "Propeller shaft."
    simple: "The long shaft under the vehicle."
  - id: f02
    topic: u7.driveline
    difficulty: 2
    learn: "Propeller shaft is a hollow steel tube, balanced to avoid vibration. Long shafts are made in two parts with a centre bearing."
    why: "Hollow gives strength with less weight; long shafts whirl."
    q: "Why are long propeller shafts split with a centre bearing?"
    a: "To avoid whirling/vibration."
    simple: "Two short shafts shake less than one long one."
  - id: f03
    topic: u7.driveline
    difficulty: 2
    learn: "Slip joint (sliding spline joint) lets the propeller shaft change length as the rear axle moves up and down."
    why: "Axle movement changes the distance to the gearbox."
    q: "What allows change in propeller shaft length?"
    a: "Slip joint (splined)."
    simple: "A sliding spline lets the shaft stretch."
  - id: f04
    topic: u7.driveline
    difficulty: 2
    learn: "Universal joint (Hooke's joint) allows the shaft to drive at an angle that keeps changing."
    why: "Gearbox and axle are not in line, and the axle moves."
    q: "What joint allows a shaft to transmit power at an angle?"
    a: "Universal joint (Hooke's joint)."
    simple: "A cross-shaped joint lets the shaft bend."
  - id: f05
    topic: u7.driveline
    difficulty: 2
    learn: "Hooke's joint parts: two yokes and a cross (spider) with needle roller bearings."
    why: "The cross lets the yokes swing in two planes."
    q: "Central part of a Hooke's joint?"
    a: "Cross (spider)."
    simple: "Two forks joined by a cross."
  - id: f06
    topic: u7.driveline
    difficulty: 2
    learn: "A single Hooke's joint at an angle does not give constant speed: the output speeds up and slows down twice per turn."
    why: "Geometry of the cross causes speed fluctuation."
    q: "Does a single Hooke's joint give uniform output speed?"
    a: "No — output speed fluctuates."
    simple: "It wobbles in speed at an angle."
  - id: f07
    topic: u7.driveline
    difficulty: 2
    learn: "Using two Hooke's joints with yokes in the same plane and equal angles cancels the speed variation."
    why: "The second joint undoes the first joint's error."
    q: "How is speed fluctuation of Hooke's joint cancelled?"
    a: "Two joints in phase with equal angles."
    simple: "Two joints balance each other."
  - id: f08
    topic: u7.driveline
    difficulty: 2
    learn: "Other universal joints: flexible (rubber) joint, cross-type, ring-type."
    why: "Flexible joints suit small angles and absorb vibration."
    q: "Joint with rubber discs for small angles?"
    a: "Flexible (rubber) joint."
    simple: "A rubber coupling that bends a little."
  - id: f09
    topic: u7.driveline
    difficulty: 2
    learn: "Constant velocity (CV) joint gives the same output speed as input at any angle."
    why: "Front wheels steer and move, so large angles occur."
    q: "Which joint is used at front-wheel-drive axles?"
    a: "Constant velocity (CV) joint."
    simple: "A joint that keeps speed steady at big angles."
  - id: f10
    topic: u7.driveline
    difficulty: 2
    learn: "CV joint types: Rzeppa (ball type, outer wheel end), tripod (inner, plunging), Bendix-Weiss, Tracta, double Cardan."
    why: "Rzeppa allows large steering angles."
    q: "Ball-type CV joint used at the wheel end?"
    a: "Rzeppa joint."
    simple: "Rzeppa has balls in grooves."
  - id: f11
    topic: u7.driveline
    difficulty: 2
    learn: "CV joints are covered by rubber boots filled with grease. A torn boot lets dirt in and the joint fails (clicking on turns)."
    why: "Dirt and lost grease ruin the joint."
    q: "Clicking noise on sharp turns in a FWD car suggests?"
    a: "Worn outer CV joint."
    simple: "Click on turns = CV joint."
  - id: f12
    topic: u7.driveline
    difficulty: 2
    learn: "Hotchkiss drive: the leaf springs carry the driving thrust and torque reaction from the axle to the frame. Uses an open propeller shaft with two UJs and a slip joint."
    why: "Simple; common in trucks and buses."
    q: "In Hotchkiss drive, what takes the driving thrust?"
    a: "The leaf springs."
    simple: "Springs push the vehicle along."
  - id: f13
    topic: u7.driveline
    difficulty: 2
    learn: "Torque tube drive: the propeller shaft runs inside a rigid tube fixed to the axle. The tube takes torque reaction and drive thrust. Needs only one UJ and no slip joint."
    why: "The tube pivots at the gearbox end."
    q: "Drive with one UJ and the shaft inside a tube?"
    a: "Torque tube drive."
    simple: "Shaft in a tube that pushes the vehicle."
  - id: f14
    topic: u7.driveline
    difficulty: 2
    learn: "Torque tube drive allows coil springs, since springs need not carry thrust."
    why: "The tube does that job."
    q: "Which drive allows coil springs to be used: Hotchkiss or torque tube?"
    a: "Torque tube drive."
    simple: "Tube takes the push, so springs can be coils."
  - id: f15
    topic: u7.driveline
    difficulty: 2
    learn: "Torque reaction: when the propeller shaft drives the crown wheel, the axle casing tends to turn the opposite way."
    why: "Newton's third law."
    q: "Tendency of axle casing to rotate opposite to wheels is called?"
    a: "Torque reaction."
    simple: "The axle tries to twist back."
  - id: f16
    topic: u7.driveline
    difficulty: 2
    learn: "Driving thrust: force from the driving wheels that pushes the vehicle forward, passed to the frame by springs or radius rods."
    why: "Wheels push on axle, axle pushes frame."
    q: "Force that moves the vehicle forward from the axle is?"
    a: "Driving thrust."
    simple: "The push from the wheels."
  - id: f17
    topic: u7.driveline
    difficulty: 2
    learn: "Front wheel drive (FWD): engine, gearbox and differential in one unit (transaxle) driving front wheels through CV-jointed drive shafts."
    why: "No propeller shaft; more cabin space."
    q: "Combined gearbox and differential in FWD cars is called?"
    a: "Transaxle."
    simple: "Gearbox and diff together at the front."
  - id: f18
    topic: u7.driveline
    difficulty: 2
    learn: "FWD advantages: more space, flat floor, good traction (engine weight on driving wheels), cheaper. Disadvantages: torque steer, heavier steering, more wear on front tyres."
    why: "Front wheels steer and drive."
    q: "Give one advantage of FWD."
    a: "More space / good traction / lower cost."
    simple: "Roomy and grippy."
  - id: f19
    topic: u7.driveline
    difficulty: 2
    learn: "Final drive: crown wheel and pinion give a fixed speed reduction (about 3.5:1 to 6:1) and turn the drive by 90°."
    why: "Engine speed is too high for wheels."
    q: "Two jobs of the final drive?"
    a: "Fixed speed reduction and turn drive through 90°."
    simple: "Slow it down and turn the corner."
  - id: f20
    topic: u7.driveline
    difficulty: 2
    learn: "Differential lets the outer wheel turn faster than the inner wheel on a turn, while driving both."
    why: "The outer wheel covers a longer path."
    q: "Why is a differential needed?"
    a: "Let driving wheels turn at different speeds on turns."
    simple: "Outer wheel can spin faster on a bend."
  - id: f21
    topic: u7.driveline
    difficulty: 2
    learn: "Differential parts: pinion, crown wheel, differential cage (case), two sun (side) gears, two or four planet (star) pinions on a spider."
    why: "Planet pinions both drive and let side gears differ in speed."
    q: "Gears connected to the axle half-shafts?"
    a: "Sun (side) gears."
    simple: "Crown wheel turns cage; planets turn side gears."
  - id: f22
    topic: u7.driveline
    difficulty: 2
    learn: "On straight roads, planet pinions do not rotate on their own pins; the whole cage turns as one unit."
    why: "Both wheels need the same speed."
    q: "Do planet pinions spin on their pins on a straight road?"
    a: "No."
    simple: "On straight road, everything turns together."
  - id: f23
    topic: u7.driveline
    difficulty: 2
    learn: "Sum of the two wheel speeds = 2 × crown wheel (cage) speed. If one wheel stops, the other turns at twice cage speed."
    why: "Differential gear rule."
    q: "One wheel is jacked up and spinning; the other is stopped. Speed of the spinning wheel?"
    a: "Twice the cage speed."
    simple: "One stops, the other goes double."
  - id: f24
    topic: u7.driveline
    difficulty: 2
    learn: "Drawback of a normal differential: if one wheel is on mud or ice, it spins and the other gets almost no torque."
    why: "Torque is shared equally, limited by the slipping wheel."
    q: "Main drawback of an open differential?"
    a: "Loses traction if one wheel slips."
    simple: "One wheel in mud spins; car does not move."
  - id: f25
    topic: u7.driveline
    difficulty: 2
    learn: "Limited slip differential (LSD) and differential lock reduce or stop wheel spin so the gripping wheel gets torque."
    why: "Useful for off-road and heavy vehicles."
    q: "Device that prevents one wheel spinning freely?"
    a: "Limited slip differential (or diff lock)."
    simple: "It forces both wheels to help."
  - id: f26
    topic: u7.driveline
    difficulty: 2
    learn: "Rear axle types by support: semi-floating, three-quarter floating, fully floating."
    why: "They differ in which loads the half-shaft carries."
    q: "Three types of rear axle by half-shaft support?"
    a: "Semi-floating, three-quarter floating, fully floating."
    simple: "How much load the shaft carries."
  - id: f27
    topic: u7.driveline
    difficulty: 2
    learn: "Semi-floating axle: the half-shaft carries driving torque, bending and vehicle weight; bearing is between shaft and casing. Used in cars."
    why: "Simple and light."
    q: "Rear axle type used in cars where shaft carries weight too?"
    a: "Semi-floating axle."
    simple: "Shaft does all the work."
  - id: f28
    topic: u7.driveline
    difficulty: 2
    learn: "Fully floating axle: the half-shaft carries only driving torque; wheel hub runs on two bearings on the axle casing. Used in trucks and buses."
    why: "Shaft can be removed without removing the wheel; vehicle can stand on it."
    q: "Axle where half-shaft carries only torque?"
    a: "Fully floating axle."
    simple: "Casing takes weight; shaft only turns."
  - id: f29
    topic: u7.driveline
    difficulty: 2
    learn: "Three-quarter floating: one bearing between hub and casing; shaft carries torque and side loads but not weight."
    why: "In-between design."
    q: "Axle with a single bearing between hub and casing?"
    a: "Three-quarter floating."
    simple: "Middle option."
  - id: f30
    topic: u7.driveline
    difficulty: 2
    learn: "Axle casing types: banjo type (one-piece with central bulge) and split (carrier) type."
    why: "Banjo is common and easy to service."
    q: "Axle casing with central bulge for the differential?"
    a: "Banjo type."
    simple: "Shaped like a banjo."
  - id: f31
    topic: u7.driveline
    difficulty: 2
    learn: "Tandem axle: two rear axles close together on heavy trucks to share load. Lift axles can be raised when empty."
    why: "Spreads weight on roads."
    q: "Two rear axles close together on a truck are called?"
    a: "Tandem axle."
    simple: "Two axles share the heavy load."
  - id: sum
    topic: u7.driveline
    type: summary
    points:
      - "Propeller shaft: hollow, slip joint, Hooke's joints (2 in phase)."
      - "CV joints (Rzeppa, tripod) for FWD; transaxle."
      - "Hotchkiss (springs take thrust) vs torque tube (tube takes thrust, 1 UJ)."
      - "Differential: outer wheel faster; LSD stops wheel spin."
      - "Semi-floating (cars), ¾, fully floating (trucks)."

  # ---------- Wheels & tyres ----------
  - id: f01
    topic: u7.wheels
    difficulty: 1
    learn: "Wheel types: spoked (wire) wheel, pressed steel disc wheel, light alloy cast wheel, composite wheel."
    why: "Each balances cost, weight and strength."
    q: "Name the four types of wheels."
    a: "Spoked, disc, alloy cast, composite."
    simple: "Wire, steel disc, alloy, composite."
  - id: f02
    topic: u7.wheels
    difficulty: 2
