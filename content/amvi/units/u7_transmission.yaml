  # ---------- Charging ----------
  - id: f01
    topic: u7.charging
    difficulty: 1
    learn: "The charging system recharges the battery and supplies electricity to all loads when the engine runs."
    why: "The battery alone would soon go flat."
    q: "Why is a charging system needed?"
    a: "Recharge battery and power loads while running."
    simple: "It refills the battery."
  - id: f02
    topic: u7.charging
    difficulty: 2
    learn: "Charging system parts: generator (dynamo or alternator), regulator, battery, ammeter or warning lamp, wiring."
    why: "Generator makes power; regulator controls it."
    q: "Name the parts of the charging system."
    a: "Generator, regulator, battery, warning lamp/ammeter."
    simple: "Generator, controller, battery."
  - id: f03
    topic: u7.charging
    difficulty: 2
    learn: "Dynamo (DC generator): armature rotates inside a stationary magnetic field; a commutator and brushes collect DC output."
    why: "The commutator converts AC in the armature to DC."
    q: "In a dynamo, which part rotates?"
    a: "Armature."
    simple: "Coils spin inside magnets."
  - id: f04
    topic: u7.charging
    difficulty: 2
    learn: "Dynamo parts: yoke (frame), field poles and coils, armature, commutator, carbon brushes, end covers, pulley."
    why: "Commutator and brushes wear and need service."
    q: "Part of a dynamo that converts AC to DC?"
    a: "Commutator."
    simple: "Commutator straightens the current."
  - id: f05
    topic: u7.charging
    difficulty: 2
    learn: "Dynamos give little or no charge at idle and cannot run at high speed. They are heavy for their output."
    why: "Commutator sparks and armature fly apart at high rpm."
    q: "Main drawback of a dynamo?"
    a: "No charging at idle; low output; cannot run fast."
    simple: "Weak at idle, can't spin fast."
  - id: f06
    topic: u7.charging
    difficulty: 2
    learn: "Alternator (AC generator): a rotor (field magnet) rotates inside a stationary stator (output windings). Diodes rectify AC to DC."
    why: "Output is taken from fixed windings, so no heavy commutator."
    q: "In an alternator, which part rotates?"
    a: "Rotor (field)."
    simple: "Magnet spins inside fixed coils."
  - id: f07
    topic: u7.charging
    difficulty: 2
    learn: "Alternator parts: rotor (claw-pole field), stator (3-phase star or delta windings), slip rings and brushes (carry small field current), rectifier (diode pack), regulator, fan, pulley."
    why: "Slip rings carry only small field current, so brushes last long."
    q: "What carries current to the alternator rotor?"
    a: "Slip rings and brushes."
    simple: "Small current through slip rings."
  - id: f08
    topic: u7.charging
    difficulty: 2
    learn: "Alternator uses 6 diodes (3-phase bridge rectifier) to change AC to DC. Diodes also stop battery current flowing back."
    why: "No cut-out relay needed."
    q: "How many diodes in a basic alternator rectifier?"
    a: "Six."
    simple: "Six diodes change AC to DC."
  - id: f09
    topic: u7.charging
    difficulty: 2
    learn: "Alternator advantages over dynamo: charges at idle, lighter, higher output, higher speed, less maintenance, no cut-out needed."
    why: "That is why all modern vehicles use alternators."
    q: "Give two advantages of alternator over dynamo."
    a: "Charges at idle, lighter, higher output, less maintenance."
    simple: "Alternator: stronger, lighter, works at idle."
  - id: f10
    topic: u7.charging
    difficulty: 2
    learn: "Never disconnect the battery while the alternator is running, and never reverse battery polarity."
    why: "Voltage spikes and reverse current destroy the diodes."
    q: "Why must battery not be disconnected with engine running?"
    a: "Voltage surge can damage diodes/electronics."
    simple: "It can burn the alternator's diodes."
  - id: f11
    topic: u7.charging
    difficulty: 2
    learn: "Regulator controls generator output voltage (about 13.8–14.4 V in a 12 V system) by controlling field current."
    why: "Too high overcharges and boils the battery; too low undercharges."
    q: "Charging voltage in a 12 V system?"
    a: "About 13.8–14.4 V."
    simple: "Regulator keeps voltage about 14 V."
  - id: f12
    topic: u7.charging
    difficulty: 2
    learn: "Dynamo regulator has three units: cut-out (stops battery discharging into dynamo), voltage regulator, current regulator."
    why: "Dynamo needs all three."
    q: "Purpose of the cut-out in a dynamo regulator?"
    a: "Prevent battery discharging through the dynamo."
    simple: "A one-way switch for the dynamo."
  - id: f13
    topic: u7.charging
    difficulty: 2
    learn: "Alternator needs only a voltage regulator. No cut-out (diodes block reverse flow) and no current regulator (stator limits current itself)."
    why: "Self-limiting by stator reactance."
    q: "Why does an alternator not need a current regulator?"
    a: "It limits its own current (stator reactance)."
    simple: "The alternator caps its own current."
  - id: f14
    topic: u7.charging
    difficulty: 2
    learn: "Types of regulators: electromechanical (vibrating contact), electronic (transistor), integrated circuit (IC) built into the alternator, ECU-controlled."
    why: "Electronic types have no moving parts."
    q: "Type of regulator in modern alternators?"
    a: "Electronic IC regulator (built-in)."
    simple: "A small chip inside the alternator."
  - id: f15
    topic: u7.charging
    difficulty: 2
    learn: "Charging warning lamp glows with ignition on and engine off, and goes out when the alternator charges. If it stays on while running, charging has failed."
    why: "It shows the difference between battery and alternator voltage."
    q: "Charging light stays on while driving — what does it mean?"
    a: "Alternator not charging."
    simple: "Red battery light on = no charging."
  - id: f16
    topic: u7.charging
    difficulty: 2
    learn: "Lead-acid battery: 12 V has 6 cells of about 2.1 V each. Electrolyte is dilute sulphuric acid."
    why: "Cells in series add voltage."
    q: "How many cells in a 12 V lead-acid battery?"
    a: "Six."
    simple: "Six 2-volt cells make 12 V."
  - id: f17
    topic: u7.charging
    difficulty: 2
    learn: "Specific gravity of battery acid: about 1.26–1.28 when fully charged, about 1.12 when discharged. Checked with a hydrometer."
    why: "Acid is used up during discharge."
    q: "Instrument to check battery acid specific gravity?"
    a: "Hydrometer."
    simple: "Heavier acid = fuller battery."
  - id: f18
    topic: u7.charging
    difficulty: 2
    learn: "Battery capacity is given in ampere-hours (Ah), e.g. 35 Ah."
    why: "Shows how much charge it can store."
    q: "Unit of battery capacity?"
    a: "Ampere-hour (Ah)."
    simple: "How many amps for how many hours."
  - id: f19
    topic: u7.charging
    difficulty: 2
    learn: "Battery plates: positive = lead peroxide (PbO₂), negative = spongy lead (Pb). Both change to lead sulphate on discharge."
    why: "Chemical change stores and releases energy."
    q: "Material of positive plates in a lead-acid battery?"
    a: "Lead peroxide (PbO₂)."
    simple: "Brown lead peroxide (+), grey sponge lead (−)."
  - id: f20
    topic: u7.charging
    difficulty: 2
    learn: "Sulphation: hard lead sulphate forms on plates if a battery stays discharged, reducing capacity."
    why: "Hard crystals do not convert back."
    q: "Hardening of lead sulphate on idle battery plates is called?"
    a: "Sulphation."
    simple: "A flat battery left long gets ruined."
  - id: f21
    topic: u7.charging
    difficulty: 2
    learn: "Topping up a conventional battery is done with distilled water only, not acid."
    why: "Only water evaporates during charging."
    q: "What is used to top up a battery?"
    a: "Distilled water."
    simple: "Add pure water, not acid."
  - id: f22
    topic: u7.charging
    difficulty: 2
    learn: "Maintenance-free (MF) batteries use calcium-lead grids, lose very little water and are sealed."
    why: "Calcium reduces gassing."
    q: "Grid alloy in maintenance-free batteries?"
    a: "Lead-calcium."
    simple: "Sealed and needs no water."
  - id: f23
    topic: u7.charging
    difficulty: 2
    learn: "Negative earth system: battery negative is connected to the vehicle body. Almost all vehicles use negative earth."
    why: "Less corrosion and standard for electronics."
    q: "Which battery terminal is earthed in most vehicles?"
    a: "Negative."
    simple: "Minus goes to the body."
  - id: f24
    topic: u7.charging
    difficulty: 2
    learn: "When removing a battery, disconnect the negative (earth) terminal first; connect it last."
    why: "Avoids short circuit if the spanner touches the body."
    q: "Which battery terminal is removed first?"
    a: "Negative (earth)."
    simple: "Minus off first, minus on last."
  - id: sum
    topic: u7.charging
    type: summary
    points:
      - "Dynamo: armature rotates, commutator; no charge at idle."
      - "Alternator: rotor rotates, stator fixed, 6 diodes rectify."
      - "Dynamo regulator: cut-out + voltage + current; alternator: voltage only."
      - "Charging voltage ~14 V; warning lamp on = not charging."
      - "Battery 6 cells, SG 1.28 full; distilled water; negative earth."

  # ---------- Starting ----------
  - id: f01
    topic: u7.starting
    difficulty: 1
    learn: "Starter motor cranks the engine until it can run on its own."
    why: "An engine cannot start itself; it needs to be turned to begin the cycle."
    q: "Function of a starter motor?"
    a: "Crank the engine to start it."
    simple: "It spins the engine to start."
  - id: f02
    topic: u7.starting
    difficulty: 2
    learn: "Starting system parts: battery, ignition/starter switch, solenoid (relay), starter motor, drive pinion, flywheel ring gear, heavy cables."
    why: "High current flows only through short, thick cables."
    q: "Name the parts of a starting system."
    a: "Battery, switch, solenoid, starter motor, pinion, ring gear."
    simple: "Key → solenoid → motor → flywheel."
  - id: f03
    topic: u7.starting
    difficulty: 2
    learn: "Starter motor is a DC series-wound motor."
    why: "Series motors give very high torque at zero speed."
    q: "Type of motor used as a starter?"
    a: "DC series-wound motor."
    simple: "Series motor = big starting torque."
  - id: f04
    topic: u7.starting
    difficulty: 2
    learn: "Starter motor draws a very high current (about 150–400 A for cars, more for trucks)."
    why: "Engine compression resists cranking."
    q: "Why are starter cables thick?"
    a: "To carry very high current."
    simple: "Huge current needs fat wires."
  - id: f05
    topic: u7.starting
    difficulty: 2
    learn: "Starter motor parts: yoke, field coils, armature, commutator, brushes, end frames, drive mechanism with pinion."
    why: "Similar to a dynamo but built for torque."
    q: "Where does the brush rub in a starter motor?"
    a: "On the commutator."
    simple: "Brushes feed current to the spinning armature."
  - id: f06
    topic: u7.starting
    difficulty: 2
    learn: "Gear ratio between starter pinion and flywheel ring gear is about 10:1 to 20:1."
    why: "Gives high cranking torque from a small motor."
    q: "Typical starter pinion to ring gear ratio?"
    a: "About 15:1 (10–20:1)."
    simple: "Small gear turns big gear for torque."
  - id: f07
    topic: u7.starting
    difficulty: 2
    learn: "Starter drive engages the pinion with the ring gear for cranking and disengages it once the engine starts."
    why: "A running engine would spin the starter too fast and wreck it."
    q: "Why must the starter pinion disengage after starting?"
    a: "To avoid over-speeding the starter motor."
    simple: "The engine would spin the starter to pieces."
  - id: f08
    topic: u7.starting
    difficulty: 2
    learn: "Starter drive types: Bendix (inertia) drive (inboard and outboard), overrunning (roller) clutch drive, axial (sliding armature), pre-engaged drive."
    why: "Each engages and protects in a different way."
    q: "Name four types of starter drives."
    a: "Bendix, overrunning clutch, axial (sliding armature), pre-engaged."
    simple: "Different ways to push the gear in."
  - id: f09
    topic: u7.starting
    difficulty: 2
    learn: "Bendix drive: pinion sits on a screwed sleeve on the armature shaft. When the motor spins, the pinion's inertia makes it run along the thread into mesh."
    why: "Pinion is heavy on one side; it lags and screws forward."
    q: "What makes the pinion move into mesh in a Bendix drive?"
    a: "Inertia of the pinion on a helical sleeve."
    simple: "The pinion screws itself forward."
  - id: f10
    topic: u7.starting
    difficulty: 2
    learn: "When the engine starts, the ring gear spins the pinion faster, screwing it back out of mesh. A drive spring cushions the shock."
    why: "The thread works in reverse."
    q: "How does a Bendix pinion disengage?"
    a: "Engine spins it faster and it screws back."
    simple: "The engine throws the pinion back."
  - id: f11
    topic: u7.starting
    difficulty: 2
    learn: "Inboard Bendix: pinion moves towards the motor to engage. Outboard Bendix: pinion moves away from the motor."
    why: "Depends on how the starter is mounted relative to the flywheel."
    q: "In outboard Bendix drive, which way does the pinion move to engage?"
    a: "Away from the motor."
    simple: "Inboard moves in; outboard moves out."
  - id: f12
    topic: u7.starting
    difficulty: 2
    learn: "Overrunning (roller) clutch drive: a one-way roller clutch lets the pinion freewheel if the engine drives it, protecting the armature."
    why: "Rollers lock one way and slip the other."
    q: "What protects the armature in an overrunning clutch drive?"
    a: "One-way roller clutch freewheels."
    simple: "A one-way clutch lets the pinion spin free."
  - id: f13
    topic: u7.starting
    difficulty: 2
    learn: "Pre-engaged starter: a solenoid first pushes the pinion into mesh using a shift lever, then closes the main contacts to spin the motor. Uses an overrunning clutch."
    why: "Pinion meshes before turning, so less gear wear."
    q: "In a pre-engaged starter, what pushes the pinion into mesh?"
    a: "Solenoid via shift (engagement) lever."
    simple: "Mesh first, spin second."
  - id: f14
    topic: u7.starting
    difficulty: 2
    learn: "Pre-engaged starter is the most common in modern vehicles."
    why: "Smooth, positive engagement and long life."
    q: "Most common starter drive in modern cars?"
    a: "Pre-engaged type."
    simple: "Modern cars use pre-engaged starters."
  - id: f15
    topic: u7.starting
    difficulty: 2
    learn: "Axial (sliding armature) starter: the whole armature slides forward by magnetic force to mesh the pinion. Used in large diesel engines."
    why: "Gives full engagement before full power."
    q: "Starter where the armature moves along its axis to engage?"
    a: "Axial (sliding armature) starter."
    simple: "The whole motor shaft slides forward."
  - id: f16
    topic: u7.starting
    difficulty: 2
    learn: "Starter solenoid has a pull-in winding (moves plunger) and a hold-in winding (keeps it in)."
    why: "Pull-in needs more current; hold-in saves current once engaged."
    q: "Two windings in a starter solenoid?"
    a: "Pull-in and hold-in windings."
    simple: "One pulls, one holds."
  - id: f17
    topic: u7.starting
    difficulty: 2
    learn: "Gear reduction starter has a small high-speed motor with internal reduction gears."
    why: "Lighter and draws less current for the same torque."
    q: "Advantage of a gear reduction starter?"
    a: "Smaller, lighter, less current."
    simple: "Small fast motor with gears inside."
  - id: f18
    topic: u7.starting
    difficulty: 2
    learn: "Do not crank for more than about 10–15 seconds at a time."
    why: "Starter overheats and battery drains."
    q: "Maximum cranking time at once?"
    a: "About 10–15 seconds."
    simple: "Short tries only."
  - id: f19
    topic: u7.starting
    difficulty: 2
    learn: "Starter only clicks: low battery, loose terminals, faulty solenoid contacts. Starter spins but engine does not turn: drive/pinion failure."
    why: "Symptoms point to the faulty part."
    q: "Starter spins but engine does not crank — likely fault?"
    a: "Starter drive (pinion/Bendix) failure."
    simple: "Spinning without cranking = drive problem."
  - id: sum
    topic: u7.starting
    type: summary
    points:
      - "Starter: DC series motor, high torque, 150–400 A."
      - "Pinion : ring gear ≈ 15:1."
      - "Bendix inertia drive (inboard/outboard)."
      - "Overrunning clutch; pre-engaged (solenoid + lever) most common."
      - "Axial (sliding armature) for big diesels; crank ≤15 s."

  # ---------- Ignition ----------
  - id: f01
    topic: u7.ignition
    difficulty: 1
    learn: "Ignition system produces a high-voltage spark at the spark plug at the right moment to ignite the mixture in a petrol engine."
    why: "Petrol needs a spark to burn."
    q: "Function of the ignition system?"
    a: "Produce a timed high-voltage spark at the plug."
    simple: "It lights the fire at the right time."
  - id: f02
    topic: u7.ignition
    difficulty: 2
    learn: "Ignition types: battery (coil) ignition, magneto ignition, electronic ignition (transistorised, capacitor discharge), computer controlled, distributor-less (DLI)."
    why: "From old mechanical to modern electronic."
    q: "Name three types of ignition systems."
    a: "Coil (battery), magneto, electronic, DLI."
    simple: "Coil, magneto, electronic."
  - id: f03
    topic: u7.ignition
    difficulty: 2
    learn: "Spark plug needs about 10,000–30,000 volts (modern systems up to 40,000 V)."
    why: "Compressed mixture resists sparking."
    q: "Voltage needed at the spark plug?"
    a: "About 10,000 to 30,000 V."
    simple: "Very high voltage to jump the gap."
  - id: f04
    topic: u7.ignition
    difficulty: 2
    learn: "Coil ignition circuit: primary circuit (battery, switch, ballast resistor, primary winding, contact breaker, condenser) and secondary circuit (secondary winding, distributor, HT leads, plugs)."
    why: "Low voltage primary creates high voltage secondary."
    q: "Is the contact breaker in the primary or secondary circuit?"
    a: "Primary circuit."
    simple: "Low voltage side and high voltage side."
  - id: f05
    topic: u7.ignition
    difficulty: 2
    learn: "Ignition coil is a step-up transformer: primary has few turns of thick wire (about 200–300); secondary has many turns of thin wire (about 20,000)."
    why: "Turns ratio steps voltage up."
    q: "Which coil winding has more turns?"
    a: "Secondary."
    simple: "Many turns make high voltage."
  - id: f06
    topic: u7.ignition
    difficulty: 2
    learn: "High voltage is induced when the primary current is suddenly broken and the magnetic field collapses."
    why: "Fast change in magnetic field induces high voltage (mutual induction)."
    q: "When is high voltage produced in the coil?"
    a: "When primary current is broken (field collapses)."
    simple: "Cut the current suddenly and a big spark comes."
  - id: f07
    topic: u7.ignition
    difficulty: 2
    learn: "Contact breaker (CB) points open and close the primary circuit, worked by a cam on the distributor shaft."
    why: "Opening the points triggers the spark."
    q: "What opens the contact breaker points?"
    a: "Cam on the distributor shaft."
    simple: "A cam flicks the points open."
  - id: f08
    topic: u7.ignition
    difficulty: 2
    learn: "CB point gap is about 0.35–0.45 mm. Points are made of tungsten."
    why: "Tungsten resists arcing and wear."
    q: "Material of contact breaker points?"
    a: "Tungsten."
    simple: "Tough tungsten tips."
  - id: f09
    topic: u7.ignition
    difficulty: 2
    learn: "Cam angle (dwell angle): number of degrees of distributor cam rotation during which the points stay closed."
    why: "Longer dwell lets the coil build up full current."
    q: "Define dwell angle."
    a: "Cam angle during which CB points remain closed."
    simple: "How long the points stay shut."
  - id: f10
    topic: u7.ignition
    difficulty: 2
    learn: "Larger point gap → smaller dwell angle. Smaller gap → larger dwell."
    why: "A wider gap means the points open earlier and close later."
    q: "If point gap increases, what happens to dwell angle?"
    a: "It decreases."
    simple: "Wider gap, less closed time."
  - id: f11
    topic: u7.ignition
    difficulty: 2
    learn: "Condenser (capacitor) is connected across the CB points. It stops arcing at the points and makes the primary current collapse faster."
    why: "Faster collapse gives higher secondary voltage."
    q: "Two functions of the condenser in coil ignition?"
    a: "Prevent arcing at points and speed up field collapse."
    simple: "It saves the points and boosts the spark."
  - id: f12
    topic: u7.ignition
    difficulty: 2
    learn: "Faulty condenser: burnt, pitted points and weak spark."
    why: "Arcing eats the point surfaces."
    q: "Burnt and pitted CB points suggest which fault?"
    a: "Faulty condenser."
    simple: "Bad condenser burns the points."
  - id: f13
    topic: u7.ignition
    difficulty: 2
    learn: "Distributor sends high voltage to each spark plug in firing order, and houses the CB points, cam, condenser and advance mechanisms."
    why: "One coil serves all cylinders."
    q: "Part that sends spark to each plug in order?"
    a: "Distributor (rotor and cap)."
    simple: "It shares sparks among cylinders."
  - id: f14
    topic: u7.ignition
    difficulty: 2
    learn: "Distributor rotor turns inside the cap and passes HT current to the cap's side terminals, one for each cylinder."
    why: "Rotor points to each plug lead in turn."
    q: "Rotating arm inside the distributor cap is called?"
    a: "Rotor."
    simple: "A spinning pointer sends the spark."
  - id: f15
    topic: u7.ignition
    difficulty: 2
    learn: "Distributor runs at camshaft speed (half crankshaft speed) in four-stroke engines."
    why: "Each plug fires once every two crank turns."
    q: "Speed of the distributor shaft?"
    a: "Half crankshaft speed (= camshaft speed)."
    simple: "Same speed as the camshaft."
  - id: f16
    topic: u7.ignition
    difficulty: 2
    learn: "Spark advance: the spark must come earlier at higher speed, because the burn takes nearly the same time but the piston moves faster."
    why: "Peak pressure should come just after TDC."
    q: "Why must the spark be advanced at high speed?"
    a: "To give time for burning before piston passes TDC."
    simple: "Faster engine → spark earlier."
  - id: f17
    topic: u7.ignition
    difficulty: 2
    learn: "Centrifugal advance: weights in the distributor fly out with speed and turn the cam forward, advancing the spark."
    why: "It follows engine speed."
    q: "Advance mechanism that depends on engine speed?"
    a: "Centrifugal advance."
    simple: "Spinning weights move the spark earlier."
  - id: f18
    topic: u7.ignition
    difficulty: 2
    learn: "Vacuum advance: a diaphragm connected to manifold vacuum turns the CB base plate, advancing the spark at part load (high vacuum)."
    why: "Lean part-load mixture burns slowly and needs more advance."
    q: "Advance mechanism that depends on engine load?"
    a: "Vacuum advance."
    simple: "Light load → more advance by vacuum."
  - id: f19
    topic: u7.ignition
    difficulty: 2
    learn: "Too much advance causes knocking and overheating. Too little (retarded) causes power loss, overheating and high fuel use."
    why: "Burn timing is wrong either way."
    q: "Effect of over-advanced ignition?"
    a: "Knocking (pinking)."
    simple: "Too early = knock; too late = weak."
  - id: f20
    topic: u7.ignition
    difficulty: 2
    learn: "Ignition timing is checked with a stroboscopic timing light aimed at marks on the crank pulley."
    why: "The flash freezes the moving mark."
    q: "Instrument used to check ignition timing?"
    a: "Timing light (stroboscope)."
    simple: "A flashing light shows the timing mark."
  - id: f21
    topic: u7.ignition
    difficulty: 2
    learn: "Ballast resistor in the primary circuit reduces coil current at normal running and is bypassed during cranking for a stronger spark."
    why: "Battery voltage drops while cranking."
    q: "Why is the ballast resistor bypassed during starting?"
    a: "To give full voltage to the coil for a strong spark."
    simple: "More voltage for starting."
  - id: f22
    topic: u7.ignition
    difficulty: 1
    learn: "Spark plug parts: terminal, insulator (ceramic), metal shell with threads, centre electrode, side (ground) electrode, gasket."
    why: "Insulator stops HT current leaking to the shell."
    q: "Material of spark plug insulator?"
    a: "Ceramic (alumina)."
    simple: "Ceramic body, metal threads, two electrodes."
  - id: f23
    topic: u7.ignition
    difficulty: 2
    learn: "Spark plug gap is usually about 0.6–1.1 mm."
    why: "Too small: weak spark; too large: misfire."
    q: "Typical spark plug gap?"
    a: "About 0.6 to 1.1 mm."
    simple: "Less than a millimetre or so."
  - id: f24
    topic: u7.ignition
    difficulty: 2
    learn: "Hot plug: long insulator nose, runs hot, used in low-speed, cool engines. Cold plug: short nose, loses heat fast, used in high-speed, high-compression engines."
    why: "Plug must stay hot enough to burn off carbon but not cause pre-ignition."
    q: "Which plug suits a high-speed, high-compression engine?"
    a: "Cold plug."
    simple: "Hot engine, cold plug. Cool engine, hot plug."
  - id: f25
    topic: u7.ignition
    difficulty: 2
    learn: "Spark plug reading: light tan/grey = normal; black sooty = rich mixture; oily = oil burning; white blistered = overheating/lean."
    why: "Plug colour shows engine condition."
    q: "Black sooty spark plug shows?"
    a: "Rich mixture."
    simple: "Black = too much fuel."
  - id: f26
    topic: u7.ignition
    difficulty: 2
    learn: "Spark plug types: standard, projected nose, resistor type (reduces radio interference), platinum/iridium tip (long life), multi-electrode."
    why: "Iridium plugs last much longer."
    q: "Purpose of a resistor spark plug?"
    a: "Reduce radio/electronic interference."
    simple: "Stops crackling in the radio."
  - id: f27
    topic: u7.ignition
    difficulty: 2
    learn: "Magneto ignition makes its own current using magnets; no battery is needed."
    why: "Used where no battery exists: small bikes, outboard engines, aircraft."
    q: "Does magneto ignition need a battery?"
    a: "No."
    simple: "It makes its own electricity."
  - id: f28
    topic: u7.ignition
    difficulty: 2
    learn: "Magneto gives a weak spark at low speed (starting) and a strong spark at high speed. Coil ignition is the opposite: strong at low speed."
    why: "Magneto output depends on speed."
    q: "Which ignition gives a better spark at starting: coil or magneto?"
    a: "Coil (battery) ignition."
    simple: "Magneto is weak at start, strong at speed."
  - id: f29
    topic: u7.ignition
    difficulty: 2
    learn: "Low tension magneto: produces low voltage; a separate coil steps it up near the plug. High tension magneto: has both windings inside and gives high voltage directly."
    why: "Differ in where voltage is stepped up."
    q: "Magneto that gives high voltage directly?"
    a: "High tension magneto."
    simple: "HT magneto does it all inside."
  - id: f30
    topic: u7.ignition
    difficulty: 2
    learn: "Rotating armature magneto: windings rotate between fixed magnets. Rotating magnet magneto: magnets rotate, windings fixed (more common)."
    why: "Fixed windings are more reliable."
    q: "More common magneto type?"
    a: "Rotating magnet type."
    simple: "Spin the magnet, keep the coils still."
  - id: f31
    topic: u7.ignition
    difficulty: 2
    learn: "Flywheel magneto: magnets are cast in the flywheel. Used in scooters, mopeds and small engines."
    why: "Compact and simple."
    q: "Magneto with magnets in the flywheel?"
    a: "Flywheel magneto."
    simple: "The flywheel is the magnet."
  - id: f32
    topic: u7.ignition
    difficulty: 2
    learn: "Electronic ignition replaces CB points with a transistor switch triggered by a sensor (magnetic pick-up, Hall effect or optical)."
    why: "No point wear, accurate timing, stronger spark."
    q: "What replaces CB points in electronic ignition?"
    a: "Transistor switching (with a pick-up sensor)."
    simple: "Electronics switch the coil instead of points."
  - id: f33
    topic: u7.ignition
    difficulty: 2
    learn: "Transistorised coil ignition (TCI): points carry only a tiny trigger current; a transistor switches the coil current. Fully electronic versions use a pulse generator."
    why: "Points last longer or are not needed at all."
    q: "In transistor-assisted ignition, what does the transistor switch?"
    a: "The heavy primary coil current."
    simple: "Transistor does the heavy switching."
  - id: f34
    topic: u7.ignition
    difficulty: 2
    learn: "Capacitor discharge ignition (CDI): a capacitor is charged to about 400 V and discharged into the coil primary by a thyristor (SCR)."
    why: "Very fast rise of voltage, strong spark at high speed."
    example: "Used in motorcycles and scooters."
    q: "Ignition used in most two-wheelers?"
    a: "CDI (capacitor discharge ignition)."
    simple: "A charged capacitor fires the coil."
  - id: f35
    topic: u7.ignition
    difficulty: 2
    learn: "Pulse generators: magnetic (inductive) pick-up — reluctor and coil; Hall-effect sensor — voltage changes when a vane passes; optical — light beam interrupted."
    why: "They tell the module when to fire."
    q: "Sensor that produces voltage when a magnetic vane passes a semiconductor?"
    a: "Hall-effect sensor."
    simple: "Sensors tell the computer when to spark."
  - id: f36
    topic: u7.ignition
    difficulty: 2
    learn: "Computer controlled (programmed/mapped) ignition: ECU sets spark timing from sensors (crank position, speed, load/MAP, coolant temperature, knock sensor) using a stored map."
    why: "Gives exact timing for every condition; no mechanical advance."
    q: "What replaces centrifugal and vacuum advance in computer ignition?"
    a: "ECU timing map using sensor inputs."
    simple: "A computer chooses the best spark time."
  - id: f37
    topic: u7.ignition
    difficulty: 2
    learn: "Knock sensor (piezoelectric) on the block detects knocking; the ECU retards timing to stop it."
    why: "Allows running close to the knock limit safely."
    q: "Sensor that detects engine knock?"
    a: "Knock sensor (piezoelectric)."
    simple: "It hears knocking and the ECU delays the spark."
  - id: f38
    topic: u7.ignition
    difficulty: 2
    learn: "Distributor-less ignition (DLI / DIS): no distributor. Separate coils are triggered by the ECU using a crankshaft position sensor."
    why: "No rotor or cap to wear; stronger, accurate spark."
    q: "Ignition system without a distributor?"
    a: "Distributor-less ignition (DLI/DIS)."
    simple: "Each coil fired directly by computer."
  - id: f39
    topic: u7.ignition
    difficulty: 2
    learn: "Wasted spark DLI: one coil fires two cylinders at once — one on compression (useful) and one on exhaust (wasted)."
    why: "Pairs of cylinders reach TDC together."
    q: "In a wasted spark system, how many plugs does one coil fire?"
    a: "Two."
    simple: "One spark used, one wasted."
  - id: f40
    topic: u7.ignition
    difficulty: 2
    learn: "Coil-on-plug (COP / direct ignition): a separate coil sits directly on each spark plug. No HT leads."
    why: "Least energy loss and interference."
    q: "System with an individual coil on each spark plug?"
    a: "Coil-on-plug (direct ignition)."
    simple: "Every plug has its own coil."
  - id: f41
    topic: u7.ignition
    difficulty: 2
    learn: "Crankshaft position sensor (CKP) tells the ECU crank angle and speed; camshaft position sensor (CMP) tells which cylinder is on compression."
    why: "Needed for spark and injection timing."
    q: "Sensor giving crank angle and engine speed?"
    a: "Crankshaft position sensor."
    simple: "It tells the computer where the crank is."
  - id: f42
    topic: u7.ignition
    difficulty: 2
    learn: "HT leads (ignition cables) are resistance or suppression cables (carbon core) to reduce radio interference."
    why: "Sparks create electrical noise."
    q: "Why are HT leads made of carbon-core resistance wire?"
    a: "To suppress radio interference."
    simple: "Cuts electrical noise."
  - id: sum
    topic: u7.ignition
    type: summary
    points:
      - "Coil = step-up transformer; spark when primary is broken."
      - "CB points (tungsten), dwell angle, condenser stops arcing."
      - "Centrifugal advance (speed), vacuum advance (load)."
      - "Magneto: LT/HT, rotating magnet/armature; weak at start."
      - "Electronic, CDI (bikes), computer, DLI (wasted spark, COP)."

