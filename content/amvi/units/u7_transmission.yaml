    why: "Saves cost, but front tyres are safety critical."
    q: "Process of adding new tread to a worn tyre?"
    a: "Retreading."
    simple: "New tread on old body."
  - id: f31
    topic: u7.wheels
    difficulty: 2
    learn: "Standing waves form in an under-inflated tyre at high speed, causing heat build-up and possible blowout."
    why: "The tyre cannot recover its shape fast enough."
    q: "Wave-like deformation of tyre at high speed is called?"
    a: "Standing wave."
    simple: "The tyre ripples and overheats."
  - id: f32
    topic: u7.wheels
    difficulty: 2
    learn: "TPMS (tyre pressure monitoring system) warns the driver of low tyre pressure. Mandatory in new cars in India (M1 category) from 2022."
    why: "Low pressure is a big safety risk."
    q: "What does TPMS do?"
    a: "Warns of low tyre pressure."
    simple: "A dashboard warning for flat tyres."
