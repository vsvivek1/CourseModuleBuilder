    why: "Spoke holes in the rim stop it holding air."
    q: "Why do spoked wheels usually need tubes?"
    a: "Spoke holes in the rim leak air."
    simple: "Holes in the rim, so a tube is needed."
  - id: f03
    topic: u7.wheels
    difficulty: 2
    learn: "Pressed steel disc wheel: rim and disc pressed from steel and welded. Cheap, strong; used on most budget cars and trucks."
    why: "Easy mass production."
    q: "Most common wheel on trucks and budget cars?"
    a: "Pressed steel disc wheel."
    simple: "Cheap strong steel wheel."
  - id: f04
    topic: u7.wheels
    difficulty: 2
    learn: "Alloy cast wheel (aluminium or magnesium alloy): light, good looking, better heat removal from brakes, reduces unsprung weight."
    why: "Lighter wheels improve ride and handling."
    q: "Advantage of alloy wheels?"
    a: "Light, better cooling of brakes, looks."
    simple: "Light and cool."
  - id: f05
    topic: u7.wheels
    difficulty: 2
    learn: "Composite wheel: made of materials like carbon fibre or a steel rim with alloy centre."
    why: "Very light and stiff."
    q: "What is a composite wheel?"
    a: "Wheel made of combined materials like carbon fibre or steel/alloy."
    simple: "Wheel built from mixed materials."
  - id: f06
    topic: u7.wheels
    difficulty: 2
    learn: "Rim types: drop centre (well base) rim for cars, flat base/divided rims for heavy vehicles."
    why: "The well lets the tyre bead drop in for fitting."
    q: "Rim with a central well for fitting the tyre?"
    a: "Drop centre (well base) rim."
    simple: "A dip in the middle to fit the tyre."
  - id: f07
    topic: u7.wheels
    difficulty: 1
    learn: "Tyre jobs: carry the vehicle weight, grip the road for driving, braking and steering, and absorb small road shocks."
    why: "The tyre is the only contact with the road."
    q: "Give two functions of a tyre."
    a: "Carry load, grip, absorb shocks."
    simple: "Hold, grip and cushion."
  - id: f08
    topic: u7.wheels
    difficulty: 2
    learn: "Tyre parts: tread, shoulder, sidewall, carcass (plies), bead (with steel wire), breaker/belt, inner liner."
    why: "Each layer has its own job."
    q: "Part of the tyre that grips the rim?"
    a: "Bead (with steel bead wire)."
    simple: "The bead locks onto the rim."
  - id: f09
    topic: u7.wheels
    difficulty: 2
    learn: "Tread is the part touching the road; its pattern clears water and gives grip. Sidewall carries markings and flexes."
    why: "Grooves push water out to avoid aquaplaning."
    q: "Part of a tyre in contact with the road?"
    a: "Tread."
    simple: "The patterned rubber on the road."
  - id: f10
    topic: u7.wheels
    difficulty: 2
    learn: "Cross-ply (bias ply) tyre: cords run diagonally (about 30–40°) bead to bead, crossing each other in layers."
    why: "Stiff sidewalls; used in older vehicles and some heavy vehicles."
    q: "Tyre in which plies cross diagonally?"
    a: "Cross-ply (bias) tyre."
    simple: "Criss-cross layers."
  - id: f11
    topic: u7.wheels
    difficulty: 2
    learn: "Radial ply tyre: carcass cords run at 90° across from bead to bead, with steel or textile belts under the tread."
    why: "Flexible sidewalls and stiff tread."
    q: "In a radial tyre, at what angle do the carcass cords run?"
    a: "90° (radially, bead to bead)."
    simple: "Cords run straight across."
  - id: f12
    topic: u7.wheels
    difficulty: 2
    learn: "Radial tyres: better grip, longer life, less rolling resistance (better fuel economy), cooler running. Cross-ply: cheaper, stronger sidewalls, harsher ride."
    why: "The tread stays flat on the road in radials."
    q: "Which tyre gives better fuel economy: radial or cross-ply?"
    a: "Radial."
    simple: "Radials last longer and save fuel."
  - id: f13
    topic: u7.wheels
    difficulty: 2
    learn: "Belted bias tyre: cross-ply carcass with belts under the tread. Between cross-ply and radial."
    why: "A compromise design."
    q: "Tyre with bias plies plus belts under the tread?"
    a: "Belted bias tyre."
    simple: "Cross-ply with belts."
  - id: f14
    topic: u7.wheels
    difficulty: 2
    learn: "Never mix radial and cross-ply tyres on the same axle."
    why: "Different handling causes instability."
    q: "Can radial and cross-ply tyres be fitted on the same axle?"
    a: "No."
    simple: "Same type on each axle."
  - id: f15
    topic: u7.wheels
    difficulty: 2
    learn: "Tubeless tyre: no inner tube; an airtight inner liner and tight bead seal hold air on a sealed rim with a valve fixed to the rim."
    why: "Air leaks slowly when punctured."
    q: "What holds air in a tubeless tyre?"
    a: "Inner liner and bead seal against the rim."
    simple: "Tyre and rim seal air themselves."
  - id: f16
    topic: u7.wheels
    difficulty: 2
    learn: "Tubeless advantages: slow air loss on puncture, cooler running, lighter, easy repair. Drawback: needs an airtight rim."
    why: "No tube to burst suddenly."
    q: "Main safety advantage of tubeless tyres?"
    a: "Slow loss of air on puncture (no sudden burst)."
    simple: "Punctures leak slowly."
  - id: f17
    topic: u7.wheels
    difficulty: 2
    learn: "Tread patterns: rib (grooves around the tyre — steering wheels, good on highways), lug (cross bars — driving wheels, traction), rib-lug (mixed), block (off-road/snow), directional, asymmetric."
    why: "Pattern suits the job."
    q: "Tread pattern for front steering wheels on highways?"
    a: "Rib pattern."
    simple: "Ribs for steering, lugs for pulling."
  - id: f18
    topic: u7.wheels
    difficulty: 2
    learn: "Minimum tread depth: 1.6 mm (tread wear indicators show this)."
    why: "Below it, wet grip falls sharply."
    q: "Legal minimum tyre tread depth?"
    a: "1.6 mm"
    simple: "Below 1.6 mm, change the tyre."
  - id: f19
    topic: u7.wheels
    difficulty: 2
    learn: "Aquaplaning: tyre rides on a film of water and loses contact with the road."
    why: "Tread cannot clear water fast enough at speed."
    q: "Tyre riding on a water film is called?"
    a: "Aquaplaning (hydroplaning)."
    simple: "Tyre surfing on water."
  - id: f20
    topic: u7.wheels
    difficulty: 2
    learn: "Under-inflation: both shoulders wear, tyre heats up, more fuel used, heavy steering, risk of burst."
    why: "Tyre flexes too much."
    q: "Both edges of tread worn more than the centre means?"
    a: "Under-inflation."
    simple: "Low air wears the edges."
  - id: f21
    topic: u7.wheels
    difficulty: 2
    learn: "Over-inflation: centre of tread wears, less grip, hard ride, more damage from impacts."
    why: "Only the middle touches the road."
    q: "Centre of tread worn more means?"
    a: "Over-inflation."
    simple: "Too much air wears the middle."
  - id: f22
    topic: u7.wheels
    difficulty: 2
    learn: "Check tyre pressure when cold, as given on the door label or manual."
    why: "Hot tyres show higher pressure."
    q: "When should tyre pressure be checked?"
    a: "When tyres are cold."
    simple: "Check before driving."
  - id: f23
    topic: u7.wheels
    difficulty: 2
    learn: "Nitrogen inflation: leaks more slowly and has no moisture, so pressure stays steadier."
    why: "Nitrogen molecules pass through rubber more slowly."
    q: "Advantage of nitrogen in tyres?"
    a: "Steadier pressure, less moisture."
    simple: "Pressure stays right longer."
  - id: f24
    topic: u7.wheels
    difficulty: 2
    learn: "Factors affecting tyre life and performance: inflation pressure, load, speed, wheel alignment, wheel balance, road surface, driving habits, temperature, brakes."
    why: "Each adds heat or uneven wear."
    q: "Name three factors that affect tyre performance."
    a: "Pressure, load, speed, alignment, balance, road, driving."
    simple: "Air, load, speed and alignment."
  - id: f25
    topic: u7.wheels
    difficulty: 2
    learn: "Wheel balancing: weights added to the rim so the wheel spins without vibration. Static and dynamic balance."
    why: "Unbalance causes shake and uneven wear."
    q: "Purpose of wheel balancing?"
    a: "Prevent vibration and uneven tyre wear."
    simple: "Small weights stop the wheel shaking."
  - id: f26
    topic: u7.wheels
    difficulty: 2
    learn: "Tyre rotation: moving tyres between positions at set intervals so they wear evenly."
    why: "Front and rear tyres wear differently."
    q: "Why are tyres rotated?"
    a: "For even wear."
    simple: "Swap places to wear evenly."
  - id: f27
    topic: u7.wheels
    difficulty: 2
    learn: "Tyre size 195/65 R15 91H: 195 mm width, 65% aspect ratio, R = radial, 15-inch rim, 91 = load index, H = speed rating (210 km/h)."
    why: "Read size code from the sidewall."
    q: "In 195/65 R15, what is 65?"
