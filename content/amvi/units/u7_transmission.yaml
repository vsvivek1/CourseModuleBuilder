    simple: "Width / height% / Radial / rim inches."
  - id: f28
    topic: u7.wheels
    difficulty: 2
    learn: "Aspect ratio = section height ÷ section width × 100. Low-profile tyres have low aspect ratio."
    why: "Lower sidewall gives sharper handling, harder ride."
    q: "Formula for aspect ratio?"
    a: "Section height ÷ section width × 100."
    simple: "How tall the sidewall is compared to width."
  - id: f29
    topic: u7.wheels
    difficulty: 2
    learn: "DOT/date code on the sidewall: last four digits show week and year of manufacture (e.g. 2324 = 23rd week of 2024)."
