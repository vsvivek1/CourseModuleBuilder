    simple: "Fuel keeps coming in and overflows."
  - id: f25
    topic: u5.carb
    difficulty: 2
    learn: "Carburettor icing: fuel evaporation cools the venturi so much that moisture freezes on it."
    why: "Evaporation takes heat."
    q: "Ice forming in a carburettor venturi is called?"
    a: "Carburettor icing."
    simple: "Evaporating petrol makes it freezing cold."
  - id: sum
    topic: u5.carb
