cards:
  # ---------- Block ----------
  - id: f01
    topic: u5.block
    difficulty: 1
    learn: "The cylinder block is the main body of the engine. It holds the cylinders, coolant passages and crankcase."
    why: "Every other engine part is fixed to it."
    q: "What is the main body of an engine called?"
    a: "Cylinder block."
    simple: "The engine's backbone."
  - id: f02
    topic: u5.block
    difficulty: 2
    learn: "Single-cylinder engines (motorcycles) often have a separate cylinder barrel. Multi-cylinder engines usually have all cylinders cast in one block (monobloc)."
    why: "One-piece casting is rigid and cheaper for many cylinders."
    q: "A block with all cylinders cast together is called?"
    a: "Monobloc (en bloc) construction."
    simple: "Many cylinders in one casting."
  - id: f03
    topic: u5.block
    difficulty: 2
    learn: "Cylinder blocks are made of grey cast iron or aluminium alloy."
    why: "Cast iron wears well and damps noise; aluminium is light and cools well."
    q: "Two materials for cylinder blocks?"
    a: "Grey cast iron and aluminium alloy."
    simple: "Heavy iron or light aluminium."
  - id: f04
    topic: u5.block
    difficulty: 2
    learn: "Aluminium blocks need cast-iron or steel cylinder liners (or special coatings), because aluminium wears quickly against piston rings."
    why: "Aluminium is soft."
    q: "Why do aluminium blocks use liners?"
    a: "Aluminium wears fast; liners give a hard wearing surface."
    simple: "A hard sleeve inside a soft block."
  - id: f05
    topic: u5.block
    difficulty: 2
    learn: "A cylinder liner (sleeve) is a replaceable tube fitted into the cylinder bore."
    why: "When worn, only the liner is changed, not the whole block."
    q: "What is a cylinder liner?"
    a: "A replaceable sleeve inside the cylinder bore."
    simple: "A replaceable inner tube for the cylinder."
  - id: f06
    topic: u5.block
    difficulty: 2
    learn: "Dry liner: does not touch the coolant; pressed into the block. Wet liner: touches the coolant directly; sealed with rubber rings at the bottom."
    why: "Wet liners cool better and are easier to replace."
    q: "Which liner is in direct contact with coolant?"
    a: "Wet liner."
    simple: "Wet liner = water touches it. Dry liner = water does not."
  - id: f07
    topic: u5.block
    difficulty: 2
    learn: "Dry liners are thin (about 1.5–3 mm). Wet liners are thicker because they must withstand coolant pressure and gas pressure alone."
    why: "A wet liner has no block wall to support it."
    q: "Which liner is thicker: dry or wet?"
    a: "Wet liner."
    simple: "Wet liners stand alone, so they are thicker."
  - id: f08
    topic: u5.block
    difficulty: 2
    learn: "Liners are made of special alloy cast iron (centrifugally cast), sometimes chrome plated."
    why: "Centrifugal casting gives dense, hard metal."
    q: "Usual liner material?"
    a: "Alloy cast iron (centrifugally cast)."
    simple: "Hard cast iron spun into shape."
  - id: f09
    topic: u5.block
    difficulty: 2
    learn: "Cylinder head closes the top of the cylinders and forms the combustion chamber. It holds valves, spark plugs or injectors."
    why: "Gas pressure acts on it every power stroke."
    q: "Part that closes the top of the cylinders?"
    a: "Cylinder head."
    simple: "The lid of the engine."
  - id: f10
    topic: u5.block
    difficulty: 2
    learn: "Cylinder heads are made of cast iron or aluminium alloy. Aluminium heads allow higher compression without knocking."
    why: "Aluminium removes heat faster from the combustion chamber."
    q: "Why can aluminium heads allow higher compression ratio?"
    a: "Better heat conduction reduces knocking."
    simple: "Cooler head, less knock."
  - id: f11
    topic: u5.block
    difficulty: 2
    learn: "Cylinder head gasket seals the joint between block and head, keeping gas, coolant and oil apart."
    why: "Metal surfaces cannot seal perfectly alone."
    q: "What does the head gasket seal?"
    a: "Joint between head and block (gas, coolant, oil)."
    simple: "A seal sheet between head and block."
  - id: f12
    topic: u5.block
    difficulty: 2
    learn: "Head gasket materials: copper-asbestos (older), steel-asbestos, multi-layer steel (MLS) in modern engines, composite."
    why: "It must survive high heat and pressure."
    q: "Gasket used in modern engines?"
    a: "Multi-layer steel (MLS)."
    simple: "Layers of thin steel sheet."
  - id: f13
    topic: u5.block
    difficulty: 2
    learn: "Signs of a blown head gasket: white smoke, coolant loss, oil mixed with water (milky oil), overheating, bubbles in radiator."
    why: "Gas and coolant leak between passages."
    q: "Milky oil may show which failure?"
    a: "Blown head gasket (coolant in oil)."
    simple: "Water in oil = head gasket problem."
  - id: f14
    topic: u5.block
    difficulty: 2
    learn: "Head bolts are tightened in a set order (from the centre outwards, spiral) and to a set torque with a torque wrench."
    why: "Uneven tightening warps the head and causes leaks."
    q: "In what order are head bolts tightened?"
    a: "From centre outwards in a spiral, to specified torque."
    simple: "Middle first, then outwards, evenly."
  - id: f15
    topic: u5.block
    difficulty: 2
    learn: "Crankcase is the lower part of the block that houses the crankshaft. The oil sump (oil pan) is bolted under it."
    why: "The sump stores engine oil."
    q: "Part bolted under the crankcase to hold oil?"
    a: "Oil sump (oil pan)."
    simple: "The oil tray at the bottom."
  - id: f16
    topic: u5.block
    difficulty: 2
    learn: "Core plugs (frost/welch plugs) close holes left in the block from casting. They can pop out if coolant freezes."
    why: "Holes are needed to remove casting sand."
    q: "Purpose of core plugs?"
    a: "Seal casting holes (and give some frost protection)."
    simple: "Caps on the casting holes."
  - id: f17
    topic: u5.block
    difficulty: 2
    learn: "Combustion chamber shapes (SI): hemispherical, wedge, bath-tub, pent-roof. Hemispherical gives best breathing and less heat loss."
    why: "Shape decides flame travel and valve size."
    q: "Combustion chamber with large valves and best breathing?"
    a: "Hemispherical."
    simple: "Dome-shaped chamber breathes best."
  - id: f18
    topic: u5.block
    difficulty: 2
    learn: "Cylinder wear is greatest at the top of the ring travel, just below the ridge, and gives a taper and ovality."
    why: "Heat, pressure and poor oil at the top cause most wear."
    q: "Where is cylinder wear maximum?"
    a: "Top of ring travel (top of the bore)."
    simple: "The top of the bore wears most."
  - id: f19
    topic: u5.block
    difficulty: 2
    learn: "Reboring: worn cylinders are bored oversize and fitted with oversize pistons. Honing finishes the bore with a cross-hatch pattern."
    why: "Cross-hatch holds oil for the rings."
    q: "Final finishing of a cylinder bore is done by?"
    a: "Honing."
    simple: "Honing leaves fine scratches that hold oil."
  - id: f20
    topic: u5.block
    difficulty: 2
    learn: "Cylinder bore wear is measured with a cylinder bore gauge (dial bore gauge)."
    why: "Shows taper and ovality."
    q: "Instrument to measure cylinder wear?"
    a: "Cylinder bore gauge (dial bore gauge)."
    simple: "A dial gauge that goes inside the cylinder."
  - id: sum
    topic: u5.block
    type: summary
    points:
      - "Block: cast iron or aluminium; monobloc for multi-cylinder."
      - "Dry liner (no coolant contact, thin) vs wet liner (coolant contact, thick)."
      - "Head forms combustion chamber; gasket seals head to block."
      - "MLS gasket; tighten head bolts centre-out with torque wrench."
      - "Wear max at top of bore; rebore and hone."

  # ---------- Piston etc ----------
  - id: f01
    topic: u5.piston
    difficulty: 1
    learn: "The piston moves up and down in the cylinder. It takes the gas force and passes it to the connecting rod."
    why: "It also seals the combustion chamber and carries heat away."
    q: "Main job of a piston?"
    a: "Transmit gas force to the connecting rod."
    simple: "The piston gets pushed and pushes the rod."
  - id: f02
    topic: u5.piston
    difficulty: 2
    learn: "Piston parts: crown (head), ring grooves and lands, skirt, and gudgeon pin bosses."
    why: "Each part has its own job: crown takes heat, skirt guides, bosses hold the pin."
    q: "The top surface of the piston is called?"
    a: "Crown (head)."
    simple: "Crown on top, skirt at the bottom."
  - id: f03
    topic: u5.piston
    difficulty: 2
    learn: "Pistons are usually made of aluminium alloy (light, good heat conduction). Heavy diesel engines may use cast iron or steel crowns."
    why: "Light pistons reduce inertia forces at high speed."
    q: "Most common piston material?"
    a: "Aluminium alloy."
    simple: "Pistons are mostly aluminium."
  - id: f04
    topic: u5.piston
    difficulty: 2
    learn: "Aluminium pistons expand more than cast iron cylinders, so they need more clearance or special designs."
    why: "Too little clearance makes the hot piston seize."
    q: "Why do aluminium pistons need special design?"
    a: "They expand more than the iron cylinder."
    simple: "Hot aluminium grows a lot."
  - id: f05
    topic: u5.piston
    difficulty: 2
    learn: "Split-skirt (slotted) piston: a slot in the skirt lets it expand without seizing."
    why: "The slot closes up as the piston heats."
    q: "Purpose of the slot in a split-skirt piston?"
    a: "Allow expansion without seizure."
    simple: "A gap that closes when hot."
  - id: f06
    topic: u5.piston
    difficulty: 2
    learn: "Cam-ground piston: oval when cold, becomes round when hot. The longer axis is at right angles to the gudgeon pin."
    why: "More metal near the pin bosses expands more."
    q: "Shape of a cam-ground piston when cold?"
    a: "Oval (elliptical)."
    simple: "Oval when cold, round when hot."
  - id: f07
    topic: u5.piston
    difficulty: 2
    learn: "Other piston types: solid skirt, slipper (part skirt cut away), autothermic/invar-strut (steel struts control expansion), tapered."
    why: "All control expansion and reduce weight or noise."
    q: "Piston with steel struts cast in to control expansion?"
    a: "Invar-strut (autothermic) piston."
    simple: "Steel strips stop the piston growing too much."
  - id: f08
    topic: u5.piston
    difficulty: 2
    learn: "Piston is tapered: smaller at the crown than the skirt."
    why: "The crown is hottest and expands most."
    q: "Is the crown or skirt of a piston larger when cold?"
    a: "Skirt."
    simple: "Hotter top is made smaller."
  - id: f09
    topic: u5.piston
    difficulty: 2
    learn: "Piston slap: knocking noise when a worn or loose piston rocks and hits the cylinder wall, mostly when cold."
    why: "Too much clearance lets the piston tilt."
    q: "Knock from excess piston clearance is called?"
    a: "Piston slap."
    simple: "Loose piston hits the wall."
  - id: f10
    topic: u5.piston
    difficulty: 2
    learn: "Gudgeon (wrist) pin connects the piston to the connecting rod small end."
    why: "It lets the rod swing while the piston moves straight."
    q: "Pin joining piston and connecting rod?"
    a: "Gudgeon pin (wrist pin)."
    simple: "The hinge pin of the piston."
  - id: f11
    topic: u5.piston
    difficulty: 2
    learn: "Gudgeon pin types: fully floating (free in piston and rod, held by circlips), semi-floating (fixed in rod or piston), fixed."
    why: "Fully floating spreads wear evenly."
    q: "What holds a fully floating gudgeon pin in place?"
    a: "Circlips."
    simple: "Free pin held by spring clips at the ends."
  - id: f12
    topic: u5.piston
    difficulty: 2
    learn: "Gudgeon pins are made of case-hardened steel and are often hollow."
    why: "Hard surface for wear; hollow for less weight."
    q: "Material of gudgeon pins?"
    a: "Case-hardened steel."
    simple: "Hard steel tube."
  - id: f13
    topic: u5.piston
    difficulty: 2
    learn: "Gudgeon pin is offset slightly towards the thrust side to reduce piston slap."
    why: "The piston changes sides more gently at TDC."
    q: "Why is the gudgeon pin offset?"
    a: "To reduce piston slap."
    simple: "Moving the pin a bit makes the piston quieter."
  - id: f14
    topic: u5.piston
    difficulty: 1
    learn: "Piston rings seal the gap between piston and cylinder, control oil, and carry heat from piston to cylinder wall."
    why: "A piston cannot fit tightly enough on its own."
    q: "Three functions of piston rings?"
    a: "Seal gas, control oil, transfer heat."
    simple: "Rings seal, scrape oil and cool."
  - id: f15
    topic: u5.piston
    difficulty: 2
    learn: "Two types of rings: compression rings (top) and oil control (scraper) rings (bottom)."
    why: "Compression rings stop gas leaking down; oil rings stop oil going up."
    q: "Which ring is at the bottom of the piston?"
    a: "Oil control (scraper) ring."
    simple: "Compression rings on top, oil ring below."
  - id: f16
    topic: u5.piston
    difficulty: 2
    learn: "Usual petrol engine: 2 compression rings + 1 oil ring. Diesel engines may have 3–4 compression rings."
    why: "Diesels have higher pressures to seal."
    q: "Typical ring set of a car petrol engine?"
    a: "2 compression + 1 oil ring."
    simple: "Two for gas, one for oil."
  - id: f17
    topic: u5.piston
    difficulty: 2
    learn: "Oil rings are slotted or have an expander so scraped oil drains back through holes in the piston."
    why: "This stops oil reaching the combustion chamber."
    q: "How does scraped oil return from an oil ring?"
    a: "Through slots in the ring and holes in the piston groove."
    simple: "Oil slips back through little holes."
  - id: f18
    topic: u5.piston
    difficulty: 2
    learn: "Piston rings are made of fine-grained alloy cast iron; the top ring is often chrome plated."
    why: "Cast iron is springy enough and wears well; chrome resists wear."
    q: "Usual material of piston rings?"
    a: "Alloy cast iron (top ring chrome plated)."
    simple: "Cast iron rings, chrome on top."
  - id: f19
    topic: u5.piston
    difficulty: 2
    learn: "Ring end gap allows for expansion. Ring gaps are staggered around the piston (not in line)."
    why: "In-line gaps would let gas blow straight past."
    q: "Why are ring gaps staggered?"
    a: "To reduce gas leakage (blow-by)."
    simple: "Spread the gaps so gas cannot slip through."
  - id: f20
    topic: u5.piston
    difficulty: 2
    learn: "Worn rings cause blow-by, low compression, high oil consumption and blue exhaust smoke."
    why: "Oil gets past into the chamber and burns."
    q: "Blue exhaust smoke often means?"
    a: "Oil burning (worn rings, valve guides)."
    simple: "Blue smoke = oil burning."
  - id: f21
    topic: u5.piston
    difficulty: 2
    learn: "Compression test with a compression gauge checks ring and valve sealing. A wet test (adding oil) separates ring problems from valve problems."
    why: "Oil seals rings briefly; if compression rises, rings are worn."
    q: "In a wet compression test, compression rises. What is worn?"
    a: "Piston rings."
    simple: "Oil helps worn rings, not bad valves."
  - id: f22
    topic: u5.piston
    difficulty: 1
    learn: "The connecting rod joins the piston to the crankshaft and turns up-down motion into rotation."
    why: "It works with the crank like a pedal and leg."
    q: "What converts reciprocating motion to rotary motion?"
    a: "Connecting rod and crankshaft."
    simple: "Rod + crank turn up-down into round."
  - id: f23
    topic: u5.piston
    difficulty: 2
    learn: "Connecting rod parts: small end (gudgeon pin end, with bronze bush), shank (I-section), big end (split, with shell bearings, cap and bolts)."
    why: "The big end is split so it can fit around the crankpin."
    q: "Which end of the connecting rod is split?"
    a: "Big end."
    simple: "Small end at the piston, big split end at the crank."
  - id: f24
    topic: u5.piston
    difficulty: 2
    learn: "Connecting rods are made of drop-forged medium carbon or alloy steel; racing engines use aluminium or titanium."
    why: "They need high strength with low weight."
    q: "How are connecting rods usually made?"
    a: "Drop-forged steel."
    simple: "Hammer-forged strong steel."
  - id: f25
    topic: u5.piston
    difficulty: 2
    learn: "Connecting rod shank has an I-section."
    why: "It gives maximum stiffness against buckling for least weight."
    q: "Cross-section of a connecting rod shank?"
    a: "I-section."
    simple: "I-shape is strong and light."
  - id: f26
    topic: u5.piston
    difficulty: 2
    learn: "Small end usually has a phosphor bronze bush. Big end uses split shell (thin-wall) bearings."
    why: "The small end only rocks; the big end rotates fully."
    q: "Bearing at the small end of a connecting rod?"
    a: "Bronze bush."
    simple: "Bush at small end, shells at big end."
  - id: f27
    topic: u5.piston
    difficulty: 2
    learn: "Some connecting rods have an oil hole (squirt hole) that sprays oil onto the cylinder wall or under the piston."
    why: "Extra cooling and lubrication."
    q: "Purpose of the squirt hole in a connecting rod?"
    a: "Spray oil onto cylinder wall or piston."
    simple: "A small jet of oil for the cylinder."
  - id: f28
    topic: u5.piston
    difficulty: 1
    learn: "Crankshaft turns the reciprocating motion of pistons into rotation and carries the flywheel."
    why: "It is the engine's output shaft."
    q: "Output shaft of an engine?"
    a: "Crankshaft."
    simple: "The main spinning shaft."
  - id: f29
    topic: u5.piston
    difficulty: 2
    learn: "Crankshaft parts: main journals, crankpins, webs (cheeks), counterweights, oil holes, front end (timing gear, pulley) and rear flange (flywheel)."
    why: "Main journals sit in main bearings; crankpins hold big ends."
    q: "Part of the crankshaft where the big end fits?"
    a: "Crankpin."
    simple: "Main journals on the centre line; crankpins offset."
  - id: f30
    topic: u5.piston
    difficulty: 2
    learn: "Counterweights on the crank webs balance the rotating weight of crankpins and connecting rods."
    why: "This reduces vibration and bearing load."
    q: "Why are counterweights used on a crankshaft?"
    a: "To balance the crankshaft and reduce vibration."
    simple: "Weights opposite the crankpins balance it."
  - id: f31
    topic: u5.piston
    difficulty: 2
    learn: "Crankshafts are made of drop-forged steel (carbon or alloy) or SG cast iron. Journals are hardened."
    why: "They face bending and twisting loads."
    q: "Two crankshaft materials?"
    a: "Forged steel and SG (nodular) cast iron."
    simple: "Forged steel or tough cast iron."
  - id: f32
    topic: u5.piston
    difficulty: 2
    learn: "Crankshaft shapes depend on cylinders: single-throw (1 cylinder), 180° two-throw, four-cylinder flat (throws at 180°), six-cylinder (throws at 120°)."
    why: "Throw angle spreads power strokes evenly: 720°/number of cylinders."
    q: "Crank throw spacing for a four-stroke six-cylinder engine?"
    a: "120°"
    simple: "720° ÷ cylinders = firing interval."
  - id: f33
    topic: u5.piston
    difficulty: 2
    learn: "Number of main bearings: a four-cylinder crankshaft usually has 3 or 5 main bearings."
    why: "More mains give a stiffer crank."
    q: "Common number of main bearings in a four-cylinder engine?"
    a: "5 (sometimes 3)."
    simple: "More bearings, less bending."
  - id: f34
    topic: u5.piston
    difficulty: 2
    learn: "Crankshaft end float is controlled by thrust washers or a flanged main bearing."
    why: "Clutch pressure pushes the crank lengthways."
    q: "What controls crankshaft end play?"
    a: "Thrust washers (or flanged thrust bearing)."
    simple: "Washers stop the crank sliding back and forth."
  - id: f35
    topic: u5.piston
    difficulty: 2
    learn: "Vibration damper (harmonic balancer) on the front of the crankshaft reduces torsional vibration."
    why: "Long crankshafts twist and untwist with each power stroke."
    q: "What reduces torsional vibration of the crankshaft?"
    a: "Vibration damper (harmonic balancer)."
    simple: "A rubber-mounted ring stops the crank twisting back and forth."
  - id: sum
    topic: u5.piston
    type: summary
    points:
      - "Piston: aluminium; split-skirt, cam-ground, invar-strut types."
      - "Rings: 2 compression + 1 oil; staggered gaps; cast iron."
      - "Gudgeon pin: fully floating with circlips; offset reduces slap."
      - "Con rod: I-section, forged steel; small end bush, big end shells."
      - "Crankshaft: journals, crankpins, counterweights; damper at front."

  # ---------- Valves ----------
  - id: f01
    topic: u5.valves
    difficulty: 1
    learn: "Valves open and close the inlet and exhaust ports at the right time."
    why: "They let fresh charge in and burnt gas out."
    q: "Job of engine valves?"
    a: "Control flow of charge in and exhaust out."
    simple: "Doors for gas."
  - id: f02
    topic: u5.valves
    difficulty: 2
    learn: "Types of valves: poppet (mushroom) valve, sleeve valve, rotary valve, reed valve. Poppet valves are used in almost all four-stroke engines."
    why: "Poppet valves seal well and are simple."
    q: "Most common type of engine valve?"
    a: "Poppet (mushroom) valve."
    simple: "A mushroom-shaped valve."
  - id: f03
    topic: u5.valves
    difficulty: 2
    learn: "Poppet valve parts: head, face (usually 45°, sometimes 30°), margin, stem, and grooves for the collets (keepers)."
    why: "The angled face seals against the seat."
    q: "Usual valve face angle?"
    a: "45° (sometimes 30°)."
    simple: "The valve's sloping face presses on the seat."
  - id: f04
    topic: u5.valves
    difficulty: 2
    learn: "Inlet valve head is larger than exhaust valve head."
    why: "Incoming charge has low pressure and needs a big opening; exhaust leaves under pressure."
    q: "Which valve is bigger: inlet or exhaust?"
    a: "Inlet valve."
    simple: "Bigger door for air coming in."
  - id: f05
    topic: u5.valves
    difficulty: 2
    learn: "Exhaust valve runs much hotter (up to about 700–800°C) than the inlet valve."
    why: "Hot gases flow over it; the inlet is cooled by fresh charge."
    q: "Which valve runs hotter?"
    a: "Exhaust valve."
    simple: "Exhaust valve faces hot gas."
  - id: f06
    topic: u5.valves
    difficulty: 2
    learn: "Sodium-cooled valve: hollow exhaust valve stem partly filled with sodium. The sodium melts and carries heat from head to stem."
    why: "Liquid sodium splashes up and down, moving heat to the cooler stem and guide."
    q: "Why is sodium filled in some exhaust valves?"
    a: "To carry heat away from the valve head (cooling)."
    simple: "Melted sodium moves heat away."
  - id: f07
    topic: u5.valves
    difficulty: 2
    learn: "Sodium melts at about 98°C, so it is liquid when the engine runs."
    why: "Liquid sodium carries heat well."
    q: "Melting point of sodium used in valves?"
    a: "About 98°C."
    simple: "Sodium is liquid in a running engine."
  - id: f08
    topic: u5.valves
    difficulty: 2
    learn: "Valve materials: inlet — chromium or nickel-chromium steel. Exhaust — silchrome or austenitic steel; faces often coated with stellite."
    why: "Exhaust valves need heat and corrosion resistance."
    q: "Hard alloy coated on exhaust valve faces?"
    a: "Stellite."
    simple: "Exhaust valves get a heat-proof face."
  - id: f09
    topic: u5.valves
    difficulty: 2
    learn: "Valve seat inserts of hard alloy are fitted in aluminium heads."
    why: "Aluminium is too soft to act as a seat."
    q: "Why are valve seat inserts used in aluminium heads?"
    a: "Aluminium is soft; inserts give a hard wearing seat."
    simple: "A hard ring for the valve to sit on."
  - id: f10
    topic: u5.valves
    difficulty: 2
    learn: "Valve guide holds the valve stem in line and carries heat from the stem."
    why: "It keeps the valve centred on its seat."
    q: "What keeps the valve stem aligned?"
    a: "Valve guide."
    simple: "A tube the valve slides in."
  - id: f11
    topic: u5.valves
    difficulty: 2
    learn: "Valve stem seals stop oil leaking down the guide into the cylinder."
    why: "Worn seals cause blue smoke on start-up."
    q: "Part that stops oil going down the valve guide?"
    a: "Valve stem seal."
    simple: "A rubber seal on the valve stem."
  - id: f12
    topic: u5.valves
    difficulty: 2
    learn: "Valve spring closes the valve and keeps it on the seat. It is held by a spring retainer and split collets (cotters)."
    why: "The cam only opens the valve; the spring closes it."
    q: "What closes the valve?"
    a: "Valve spring."
    simple: "The cam opens, the spring shuts."
  - id: f13
    topic: u5.valves
    difficulty: 2
    learn: "Valve float: at very high speed, the valve does not follow the cam and stays partly open."
    why: "The spring cannot close it fast enough."
    q: "Valve not following the cam at high rpm is called?"
    a: "Valve float."
    simple: "Valve bounces and stays open too long."
  - id: f14
    topic: u5.valves
    difficulty: 2
    learn: "Valve rotators turn the valve a little on each opening."
    why: "This spreads wear and stops carbon build-up on the seat."
    q: "Why are valve rotators used?"
    a: "Even wear and to prevent carbon deposits on seat."
    simple: "Turning the valve keeps its seat clean."
  - id: f15
    topic: u5.valves
    difficulty: 2
    learn: "Valve clearance (tappet clearance) is a small gap in the valve train when the valve is closed."
    why: "It allows for heat expansion so the valve closes fully when hot."
    q: "Why is tappet clearance provided?"
    a: "To allow for expansion so valves close fully."
    simple: "A small gap for growth when hot."
  - id: f16
    topic: u5.valves
    difficulty: 2
    learn: "Exhaust valve clearance is usually more than inlet valve clearance."
    why: "The exhaust valve gets hotter and expands more."
    q: "Which valve has more tappet clearance?"
    a: "Exhaust valve."
    simple: "Hotter valve gets a bigger gap."
  - id: f17
    topic: u5.valves
    difficulty: 2
    learn: "Too little clearance: valve stays open, burns, and compression is lost. Too much clearance: noisy tapping and less valve lift."
    why: "Clearance changes valve timing."
    q: "Effect of too little tappet clearance?"
    a: "Valve does not close fully → burnt valve, low compression."
    simple: "Too tight burns valves; too loose taps loudly."
  - id: f18
    topic: u5.valves
    difficulty: 2
    learn: "Hydraulic tappets (lifters) use oil pressure to keep zero clearance automatically."
    why: "No adjustment needed and quiet running."
    q: "Advantage of hydraulic tappets?"
    a: "Zero clearance automatically, quiet, no adjustment."
    simple: "Oil-filled lifters adjust themselves."
  - id: f19
    topic: u5.valves
    difficulty: 2
    learn: "Valve arrangements: L-head (side valve), I-head (overhead valve), F-head (one over, one side), T-head (inlet and exhaust on opposite sides)."
    why: "Older names still asked in exams."
    q: "Engine with both valves in the cylinder head is called?"
    a: "I-head (overhead valve)."
    simple: "Valve layout is named by letter shapes."
  - id: f20
    topic: u5.valves
    difficulty: 2
    learn: "Side camshaft (OHV push-rod) mechanism: camshaft in the block → tappet (follower) → push rod → rocker arm → valve."
    why: "The push rod carries motion up to the head."
    q: "Order of parts in a push-rod valve mechanism?"
    a: "Cam → tappet → push rod → rocker arm → valve."
    simple: "Cam pushes tappet, push rod, rocker, valve."
  - id: f21
    topic: u5.valves
    difficulty: 2
    learn: "Overhead camshaft (OHC): the camshaft is in the cylinder head and works the valves directly or through rockers/followers."
    why: "Fewer moving parts allows higher engine speeds."
    q: "Advantage of OHC over push-rod design?"
    a: "Fewer parts, less inertia, higher rpm."
    simple: "Cam on top = fewer parts, faster engine."
  - id: f22
    topic: u5.valves
    difficulty: 2
    learn: "SOHC: single overhead camshaft. DOHC: two overhead camshafts, one for inlet and one for exhaust valves."
    why: "DOHC allows 4 valves per cylinder and better breathing."
    q: "In DOHC, how many camshafts per cylinder bank?"
    a: "Two."
    simple: "Double OHC: one cam for inlet, one for exhaust."
  - id: f23
    topic: u5.valves
    difficulty: 2
    learn: "Multi-valve engines (3, 4 or 5 valves per cylinder) breathe better and allow a central spark plug."
    why: "More, smaller valves give more flow area."
    q: "Why use four valves per cylinder?"
    a: "Better breathing, more power, central plug."
    simple: "More doors, more air."
  - id: f24
    topic: u5.valves
    difficulty: 2
    learn: "Camshaft opens the valves at the right time. It has one cam (lobe) for each valve and runs at half crankshaft speed in four-stroke engines."
    why: "Each valve opens once per two crank turns."
    q: "Camshaft speed compared to crankshaft?"
    a: "Half."
    simple: "Cam turns once for every two crank turns."
  - id: f25
    topic: u5.valves
    difficulty: 2
    learn: "Cam terms: base circle, nose (tip), flank, lift, ramp."
    why: "The nose gives maximum valve opening."
    q: "Highest point of a cam is called?"
    a: "Nose."
    simple: "The nose pushes the valve fully open."
  - id: f26
    topic: u5.valves
    difficulty: 2
    learn: "Camshafts may also drive the distributor, oil pump and mechanical fuel pump (via an eccentric)."
    why: "Older engines used one shaft for many drives."
    q: "What on the camshaft drives a mechanical fuel pump?"
    a: "An eccentric."
    simple: "An off-centre lobe works the fuel pump."
  - id: f27
    topic: u5.valves
    difficulty: 2
    learn: "Camshaft drives: gear drive, chain drive (timing chain with tensioner), belt drive (toothed timing belt)."
    why: "They keep cam and crank in exact time."
    q: "Three types of camshaft drives?"
    a: "Gear, chain, toothed belt."
    simple: "Gears, chain or belt connect crank to cam."
  - id: f28
    topic: u5.valves
    difficulty: 2
    learn: "Timing belts are quiet and light but must be replaced at set intervals. Chains last longer but are noisier."
    why: "A broken belt can let pistons hit valves (interference engine)."
    q: "Disadvantage of a timing belt?"
    a: "Needs periodic replacement; failure can damage valves."
    simple: "Belt is quiet but must be changed on time."
  - id: f29
    topic: u5.valves
    difficulty: 2
    learn: "Timing marks on crank and cam sprockets must line up when fitting the chain or belt."
    why: "Wrong timing gives poor running or engine damage."
    q: "What must be lined up when fitting a timing belt?"
    a: "Timing marks on crank and cam sprockets."
    simple: "Match the marks before fitting."
  - id: f30
    topic: u5.valves
    difficulty: 2
    learn: "Camshafts are made of cast iron (chilled or hardenable) or forged steel; cam lobes are hardened."
    why: "Lobes face heavy sliding wear."
    q: "Material of camshafts?"
    a: "Chilled cast iron or forged steel (hardened lobes)."
    simple: "Hard-faced iron or steel."
  - id: f31
    topic: u5.valves
    difficulty: 2
    learn: "Cam followers: flat (mushroom), roller, knife-edge, spherical. Roller followers reduce friction."
    why: "Rolling contact wears less than sliding."
    q: "Which follower has least friction?"
    a: "Roller follower."
    simple: "A small wheel riding on the cam."
  - id: f32
    topic: u5.valves
    difficulty: 2
    learn: "Valve grinding (lapping) with grinding paste makes the valve face and seat seal perfectly."
    why: "Removes small pits and makes a gas-tight ring of contact."
    q: "Process of making valve and seat seal with paste?"
    a: "Valve lapping (grinding)."
    simple: "Rub valve and seat together with paste."
  - id: sum
    topic: u5.valves
    type: summary
    points:
      - "Poppet valves, 45° face; inlet bigger, exhaust hotter."
      - "Sodium-cooled exhaust valves; stellite faces; seat inserts."
      - "Tappet clearance: exhaust > inlet; hydraulic lifters = zero."
