      - "Air cleaners: paper, oil-wetted, oil bath."

  # ---------- Carburettor ----------
  - id: f01
    topic: u5.carb
    difficulty: 1
    learn: "A carburettor mixes petrol with air in the correct ratio and supplies it to the engine as a fine spray."
    why: "Petrol must be vapour mixed with air to burn well."
    q: "Function of a carburettor?"
    a: "Mix air and petrol in correct proportion."
    simple: "It makes the air–petrol mix."
  - id: f02
    topic: u5.carb
    difficulty: 2
    learn: "Carburettor works on the venturi (Bernoulli) principle: air speeds up in the narrow venturi, pressure drops, and petrol is sucked from the jet."
    why: "Fast air = low pressure."
    q: "Principle of the carburettor?"
    a: "Venturi (Bernoulli) principle."
    simple: "Fast air pulls petrol out."
  - id: f03
    topic: u5.carb
    difficulty: 2
    learn: "Simple carburettor parts: float chamber with float and needle valve, main jet, discharge nozzle, venturi, throttle valve, choke valve."
    why: "Each part controls fuel level, flow or air."
    q: "Part that keeps a constant fuel level in a carburettor?"
    a: "Float and needle valve."
    simple: "The float shuts fuel when the bowl is full."
  - id: f04
    topic: u5.carb
    difficulty: 2
    learn: "Throttle valve (butterfly) controls the amount of mixture entering the engine and so controls speed and power."
    why: "It is linked to the accelerator pedal."
    q: "Which valve is connected to the accelerator pedal?"
    a: "Throttle valve."
    simple: "Pedal opens the throttle."
  - id: f05
    topic: u5.carb
    difficulty: 2
    learn: "The fuel nozzle tip is slightly above the fuel level in the float chamber."
    why: "Prevents fuel dripping out when the engine is stopped."
    q: "Why is the nozzle tip above the float chamber level?"
    a: "To stop fuel overflowing when the engine is off."
    simple: "Keeps petrol from dripping out."
  - id: f06
    topic: u5.carb
    difficulty: 2
    learn: "A simple carburettor gives a richer mixture as speed rises."
    why: "Fuel flow increases faster than air flow through the venturi."
    q: "What happens to mixture in a simple carburettor at high speed?"
    a: "It becomes richer."
    simple: "Simple carb goes rich when fast."
  - id: f07
    topic: u5.carb
    difficulty: 2
    learn: "Compensation devices keep mixture correct at all speeds: air bleed jet, compensating jet, emulsion tube, auxiliary air valve, back suction control."
    why: "They correct the richening at high speed."
    q: "Name one compensating device in a carburettor."
    a: "Air bleed jet (or compensating jet, emulsion tube)."
    simple: "Extra air or fuel paths keep the mix right."
  - id: f08
    topic: u5.carb
    difficulty: 2
    learn: "Chemically correct air-fuel ratio: about 15:1. Rich mixture: less air (e.g. 12:1). Lean (weak) mixture: more air (e.g. 17:1)."
    why: "Engine needs different ratios for different conditions."
    q: "Is 12:1 a rich or lean mixture?"
    a: "Rich."
    simple: "Less air = rich. More air = lean."
  - id: f09
    topic: u5.carb
    difficulty: 2
    learn: "Mixture requirements: cold starting very rich (up to 5:1 or 9:1), idling rich (about 12:1), cruising lean (about 16–17:1), full power/acceleration rich (about 12–13:1)."
    why: "Each condition needs different fuel."
    q: "Which condition needs the leanest mixture?"
    a: "Cruising (part load)."
    simple: "Cruise lean, start and power rich."
  - id: f10
    topic: u5.carb
    difficulty: 2
    learn: "Best economy mixture is slightly lean (about 16:1). Best power mixture is slightly rich (about 12.5:1)."
    why: "Extra fuel ensures all oxygen is used for power."
    q: "Is best power mixture rich or lean?"
    a: "Slightly rich."
    simple: "Rich for power, lean for economy."
  - id: f11
    topic: u5.carb
    difficulty: 2
    learn: "Modern carburettor circuits: float system, starting (choke) system, idle and slow-speed system, main metering (high speed) system, acceleration pump system, power (economiser) system."
    why: "Each circuit handles a driving condition."
    q: "Name the circuits of a modern carburettor."
    a: "Float, choke, idle, main metering, accelerating pump, power."
    simple: "Six circuits for six jobs."
  - id: f12
    topic: u5.carb
    difficulty: 2
    learn: "Idle and slow-speed system supplies fuel through an idle port below the closed throttle, where vacuum is high."
    why: "At idle, venturi air is too slow to lift fuel from the main jet."
    q: "Where does fuel come from at idle?"
    a: "Idle port below the throttle valve."
    simple: "A small hole under the throttle feeds idle fuel."
  - id: f13
    topic: u5.carb
    difficulty: 2
    learn: "Idle mixture screw adjusts idle mixture; idle speed (throttle stop) screw adjusts idle rpm."
    why: "Both are set during tuning."
    q: "Which screw adjusts idle rpm?"
    a: "Throttle stop (idle speed) screw."
    simple: "One screw for mixture, one for speed."
  - id: f14
    topic: u5.carb
    difficulty: 2
    learn: "Transfer (progression) ports just above the closed throttle feed extra fuel as the throttle starts to open."
    why: "Prevents a flat spot between idle and main circuits."
    q: "Purpose of transfer ports?"
    a: "Smooth change from idle to main circuit."
    simple: "Fill the gap as the throttle starts opening."
  - id: f15
    topic: u5.carb
    difficulty: 2
    learn: "Main metering (high speed) system supplies fuel through the main jet and nozzle at cruising and higher speeds."
    why: "Venturi vacuum is strong enough at these speeds."
    q: "Which circuit supplies fuel at cruising speed?"
    a: "Main metering system."
    simple: "Main jet works at normal speeds."
  - id: f16
    topic: u5.carb
    difficulty: 2
    learn: "Acceleration pump squirts extra fuel when the throttle is opened suddenly."
    why: "Air speeds up faster than fuel; without it the engine hesitates (flat spot)."
    q: "Why is an accelerator pump needed?"
    a: "Prevent hesitation (lean mixture) on sudden throttle opening."
    simple: "An extra squirt when you press quickly."
  - id: f17
    topic: u5.carb
    difficulty: 2
    learn: "Power (economiser) system gives extra fuel at full throttle, opened by low vacuum or a mechanical link."
    why: "Full load needs a richer mixture."
    q: "Circuit that enriches mixture at full throttle?"
    a: "Power (economiser) system."
    simple: "More fuel at full power."
  - id: f18
    topic: u5.carb
    difficulty: 2
    learn: "Choke valve is a butterfly above the venturi. Closing it gives a very rich mixture for cold starting."
    why: "Cold petrol does not vaporise well, so more is needed."
    q: "Which valve gives a rich mixture for cold starting?"
    a: "Choke valve."
    simple: "Choke cuts air for a cold start."
  - id: f19
    topic: u5.carb
    difficulty: 2
    learn: "Automatic choke uses a bimetallic spring heated by the engine to open the choke as the engine warms."
    why: "Driver does not need to remember to push it in."
    q: "What operates an automatic choke?"
    a: "Bimetallic spring (thermostatic)."
    simple: "A heat-sensitive spring opens it by itself."
  - id: f20
    topic: u5.carb
    difficulty: 2
    learn: "Constant vacuum (CV) carburettor: venturi size changes with a piston/slide lifted by vacuum (SU, Stromberg)."
    why: "Air speed stays nearly constant, giving good mixture at all loads."
    q: "Name a constant vacuum (variable venturi) carburettor."
    a: "SU (or Stromberg CD)."
    simple: "The venturi grows as needed."
  - id: f21
    topic: u5.carb
