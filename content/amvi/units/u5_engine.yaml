    why: "Dust wears cylinders and rings fast."
    q: "Give two functions of an air cleaner."
    a: "Filter dust, reduce intake noise (and arrest backfire flame)."
    simple: "Cleans air and quiets the intake."
  - id: f12
    topic: u5.petrolfuel
    difficulty: 2
    learn: "Air cleaner types: dry (paper element), wet (oil-wetted mesh), oil bath. Paper dry type is most common in cars."
    why: "Paper elements are efficient and cheap to replace."
    q: "Air cleaner where air passes over oil in a bowl?"
    a: "Oil bath air cleaner."
    simple: "Paper, oily mesh, or oil bath."
  - id: f13
    topic: u5.petrolfuel
    difficulty: 2
    learn: "Centrifugal (cyclone) pre-cleaners are used on trucks and tractors in dusty conditions."
    why: "They spin out heavy dust before the main filter."
    q: "Pre-cleaner used in dusty conditions?"
    a: "Centrifugal (cyclone) pre-cleaner."
    simple: "Spins dust out first."
  - id: f14
    topic: u5.petrolfuel
    difficulty: 2
    learn: "A choked air filter makes the mixture rich, raises fuel consumption and causes black smoke."
    why: "Less air for the same fuel."
    q: "Effect of a choked air filter?"
