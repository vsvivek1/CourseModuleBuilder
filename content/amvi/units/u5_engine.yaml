    why: "The injection pump needs a steady, bubble-free supply."
    q: "Job of the fuel feed pump?"
    a: "Supply fuel from tank to injection pump at low pressure."
    simple: "It lifts diesel to the main pump."
  - id: f03
    topic: u5.dieselfuel
    difficulty: 2
    learn: "Hand priming pump on the feed pump is used to fill the system and bleed out air after filter change."
    why: "Air in diesel lines stops the engine."
    q: "Why is a hand primer used?"
    a: "To fill the fuel system and bleed air."
    simple: "Pump by hand to push air out."
  - id: f04
    topic: u5.dieselfuel
    difficulty: 2
    learn: "Air lock in diesel lines prevents injection; the system is bled at filter and pump bleed screws."
    why: "Air compresses, so pressure cannot build."
    q: "What must be done after running out of diesel?"
    a: "Bleed the fuel system to remove air."
    simple: "Push out the air bubbles."
  - id: f05
    topic: u5.dieselfuel
    difficulty: 2
    learn: "Diesel filters: primary (coarse, often with water separator) and secondary (fine, paper element)."
    why: "Injection parts have very fine clearances; dirt and water ruin them."
    q: "Why do diesel systems need fine filters?"
    a: "Injection pump and injectors have very fine clearances."
    simple: "Tiny parts need very clean fuel."
  - id: f06
    topic: u5.dieselfuel
    difficulty: 2
    learn: "Water separator (sedimenter) collects water at the bottom of the filter bowl; it must be drained regularly."
    why: "Water corrodes pump and injector parts."
    q: "Purpose of a water separator in diesel filter?"
    a: "Remove water from diesel."
    simple: "Catches water before it reaches the pump."
  - id: f07
    topic: u5.dieselfuel
    difficulty: 2
