    why: "Diesel must be sprayed finely into very hot compressed air."
    q: "Job of the fuel injection pump?"
    a: "Meter and pressurise fuel, deliver at right time."
    simple: "The heart of the diesel system."
  - id: f08
    topic: u5.dieselfuel
    difficulty: 2
