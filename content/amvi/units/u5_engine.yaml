    simple: "Solex/Zenith fixed; SU variable."
  - id: f22
    topic: u5.carb
    difficulty: 2
    learn: "Down-draught, up-draught and side-draught carburettors are named by air flow direction. Down-draught is common in cars."
    why: "Gravity helps the mixture flow down."
    q: "Most common carburettor type in cars (by air direction)?"
    a: "Down-draught."
    simple: "Air flows downward into the engine."
  - id: f23
    topic: u5.carb
    difficulty: 2
    learn: "Multi-barrel carburettors have two or four throats; the secondary barrels open only at high load."
    why: "Small primary for economy, big secondary for power."
    q: "When does the secondary barrel open?"
    a: "At high load / high speed."
    simple: "Extra barrels open for more power."
  - id: f24
    topic: u5.carb
    difficulty: 2
