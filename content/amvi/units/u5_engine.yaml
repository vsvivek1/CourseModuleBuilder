    learn: "Oil cooler: a small radiator for engine oil, cooled by air or coolant."
    why: "Hot oil thins and breaks down."
    q: "Why is an oil cooler used?"
    a: "Keep oil temperature in safe range."
    simple: "A mini radiator for oil."
  - id: f17
    topic: u5.lube
    difficulty: 2
    learn: "Oil seals (lip seals) stop oil leaking where shafts come out of the engine, e.g. front and rear crankshaft seals."
    why: "A spring-loaded rubber lip presses on the shaft."
    q: "Seal used where the crankshaft leaves the block?"
    a: "Lip type oil seal."
    simple: "A rubber lip hugs the shaft."
  - id: f18
    topic: u5.lube
    difficulty: 2
    learn: "Crankcase ventilation removes blow-by gases (unburnt fuel, water vapour, acids) from the crankcase."
    why: "These gases dilute oil and form sludge."
    q: "Why is crankcase ventilation needed?"
    a: "Remove blow-by gases that contaminate oil."
    simple: "Let leaked gases out of the oil area."
  - id: f19
    topic: u5.lube
    difficulty: 2
    learn: "Old open (road draught) ventilation vented gases to air. Modern PCV (positive crankcase ventilation) sends them into the intake to be burnt."
    why: "PCV cuts pollution."
    q: "Where does a PCV system send crankcase gases?"
    a: "Into the intake manifold to be burnt."
    simple: "Burn the leaked gases instead of releasing them."
  - id: f20
    topic: u5.lube
    difficulty: 2
    learn: "Oil level is checked with the dipstick, engine off and on level ground. Keep it between MIN and MAX marks."
    why: "Too low starves bearings; too high causes foaming."
    q: "How is engine oil level checked?"
    a: "With the dipstick, on level ground, engine off."
    simple: "Pull the stick, wipe, dip, read."
  - id: f21
    topic: u5.lube
    difficulty: 2
    learn: "Oil grades: SAE (viscosity, e.g. 15W-40), API service (S for petrol, C for diesel, e.g. API SN, CK-4)."
    why: "Use the grade the maker specifies."
    q: "In API classification, C stands for?"
    a: "Compression ignition (diesel) engines."
    simple: "S = spark (petrol), C = compression (diesel)."
  - id: f22
    topic: u5.lube
    difficulty: 2
    learn: "Oil additives: detergent-dispersants, anti-wear (ZDDP), anti-oxidants, viscosity index improvers, pour point depressants, anti-foam, corrosion inhibitors."
    why: "Base oil alone cannot do all jobs."
    q: "Additive that keeps dirt in suspension?"
    a: "Detergent-dispersant."
    simple: "Additives give oil extra powers."
  - id: f23
    topic: u5.lube
    difficulty: 2
    learn: "Low oil pressure causes: low oil level, worn bearings, worn pump, blocked strainer, thin oil, stuck relief valve."
    why: "Each lets pressure fall."
    q: "Name one cause of low oil pressure."
    a: "Low oil level, worn bearings or pump, thin oil."
    simple: "Too little oil or too much leak-away."
  - id: sum
    topic: u5.lube
    type: summary
    points:
      - "Splash (dippers), pressure feed (pump), combined."
      - "Wet sump (cars) vs dry sump (racing, 2 pumps)."
      - "Gear or rotor pump; relief valve limits pressure."
      - "Full-flow filter with bypass valve; oil cooler; lip seals."
      - "PCV burns blow-by gases; SAE and API grades."

  # ---------- Cooling ----------
  - id: f01
    topic: u5.cooling
    difficulty: 1
    learn: "The cooling system removes extra heat from the engine and keeps it at the best working temperature (about 80–95°C)."
    why: "Too hot: parts seize and oil fails. Too cold: poor efficiency and wear."
    q: "Why does an engine need a cooling system?"
    a: "Remove excess heat and keep correct temperature."
    simple: "Keep the engine not too hot, not too cold."
  - id: f02
    topic: u5.cooling
    difficulty: 2
    learn: "About 30% of fuel heat is removed by the cooling system."
    why: "Part of the heat balance."
    q: "Roughly what share of fuel heat goes to coolant?"
    a: "About 30%."
    simple: "About one-third goes to cooling."
  - id: f03
    topic: u5.cooling
    difficulty: 2
    learn: "Two types of cooling: air cooling and water (liquid) cooling."
    why: "Small engines use air; most cars use liquid."
    q: "Two types of engine cooling?"
    a: "Air cooling and water (liquid) cooling."
    simple: "Air or water."
  - id: f04
    topic: u5.cooling
    difficulty: 2
    learn: "Air cooling uses fins on the cylinder and head to give off heat to air. Fans and cowls (shrouds) help in scooters and some engines."
    why: "Fins increase area for heat loss."
    example: "Motorcycles, scooters, older autorickshaws."
    q: "What helps an air-cooled engine lose heat?"
    a: "Fins (and fan with cowling)."
    simple: "Fins let air carry heat away."
  - id: f05
    topic: u5.cooling
    difficulty: 2
    learn: "Air cooling: light, simple, no leaks or freezing; but noisy, uneven cooling and limited to small engines."
    why: "Air carries much less heat than water."
    q: "Give one disadvantage of air cooling."
    a: "Uneven cooling / noisy / only for small engines."
    simple: "Simple but weak for big engines."
  - id: f06
    topic: u5.cooling
    difficulty: 2
    learn: "Water cooling parts: water jackets, water pump, radiator, pressure cap, thermostat, fan, hoses, coolant reservoir."
    why: "Coolant carries heat from engine to radiator."
    q: "Name the main parts of a water cooling system."
    a: "Jackets, pump, radiator, cap, thermostat, fan, hoses."
    simple: "Pump moves water from engine to radiator and back."
  - id: f07
    topic: u5.cooling
    difficulty: 2
    learn: "Thermo-syphon cooling: water circulates by itself because hot water rises and cool water sinks. No pump is used."
    why: "Density difference drives the flow."
    q: "Cooling system that works without a water pump?"
    a: "Thermo-syphon system."
    simple: "Hot water rises, cold sinks, no pump."
  - id: f08
    topic: u5.cooling
    difficulty: 2
    learn: "Thermo-syphon is slow; the radiator must be above the engine and water level kept high. Used in old and small stationary engines."
    why: "Natural circulation is weak."
    q: "Main drawback of thermo-syphon cooling?"
    a: "Slow circulation; radiator must be high; level critical."
    simple: "Too slow for modern engines."
  - id: f09
    topic: u5.cooling
    difficulty: 2
    learn: "Pump circulation (forced) system: a centrifugal water pump driven by belt circulates coolant quickly."
    why: "Fast, steady flow for high-output engines."
    q: "Type of water pump used in cars?"
    a: "Centrifugal pump."
    simple: "A belt-driven spinning pump moves the water."
  - id: f10
    topic: u5.cooling
    difficulty: 2
    learn: "Water pump is driven by the fan belt or timing belt from the crankshaft. It has an impeller, seal and bearing."
    why: "Seal failure causes leaks from the weep hole."
    q: "What drives the water pump?"
    a: "Crankshaft through a belt."
    simple: "The engine turns the pump with a belt."
  - id: f11
    topic: u5.cooling
    difficulty: 2
    learn: "Thermostat is a valve between engine and radiator. It stays closed when cold and opens at about 80–90°C."
    why: "It helps the engine warm up quickly and keeps it at the right temperature."
    q: "Function of the thermostat?"
    a: "Quick warm-up and control engine temperature."
    simple: "Shut when cold, open when hot."
  - id: f12
    topic: u5.cooling
    difficulty: 2
    learn: "Thermostat types: wax pellet (most common), bellows (with volatile liquid like alcohol), bimetallic."
    why: "Wax expands when it melts and pushes the valve open."
    q: "Most common type of thermostat?"
    a: "Wax pellet type."
    simple: "Melting wax opens the valve."
  - id: f13
    topic: u5.cooling
    difficulty: 2
    learn: "Thermostat stuck closed → overheating. Stuck open → engine runs cold, heater weak, more fuel use."
    why: "Coolant cannot reach the radiator, or goes there too early."
    q: "Effect of a thermostat stuck closed?"
    a: "Engine overheats."
    simple: "Closed = too hot. Open = too cold."
  - id: f14
    topic: u5.cooling
    difficulty: 2
    learn: "Bypass passage lets coolant circulate within the engine while the thermostat is closed."
    why: "Prevents hot spots and pressure rise during warm-up."
    q: "Purpose of the bypass passage in cooling system?"
    a: "Circulate coolant in engine when thermostat is closed."
    simple: "A short path for water while warming up."
  - id: f15
    topic: u5.cooling
    difficulty: 1
    learn: "Radiator is a heat exchanger that cools hot coolant using air flowing through its core."
    why: "Thin tubes and fins give a large cooling area."
    q: "Main job of the radiator?"
    a: "Transfer heat from coolant to air."
    simple: "Radiator cools the water with air."
  - id: f16
    topic: u5.cooling
    difficulty: 2
    learn: "Radiator parts: upper tank (inlet), core, lower tank (outlet), filler neck with pressure cap, drain cock."
    why: "Hot water enters the top and cooled water leaves the bottom."
    q: "Where does hot coolant enter the radiator?"
    a: "Upper (inlet) tank."
    simple: "Hot in at top, cool out at bottom."
  - id: f17
    topic: u5.cooling
    difficulty: 2
    learn: "Radiator core types: tubular (fin and tube) and cellular (honeycomb). Flow types: down-flow and cross-flow."
    why: "Cross-flow radiators are lower and fit under sloping bonnets."
    q: "Radiator with coolant flowing sideways between side tanks?"
    a: "Cross-flow radiator."
    simple: "Down-flow top to bottom; cross-flow side to side."
  - id: f18
    topic: u5.cooling
    difficulty: 2
    learn: "Radiators are made of copper-brass (older) or aluminium core with plastic tanks (modern)."
    why: "Good heat conductors; aluminium is lighter."
    q: "Material of modern radiators?"
    a: "Aluminium core with plastic tanks."
    simple: "Light aluminium and plastic."
  - id: f19
    topic: u5.cooling
    difficulty: 2
    learn: "Pressure cap raises the system pressure (about 0.9–1.1 bar extra), which raises the boiling point of coolant to about 120°C."
    why: "Boiling point rises with pressure, like a pressure cooker."
    q: "Why is a pressure cap used on the radiator?"
    a: "Raise coolant boiling point."
    simple: "Pressure stops water boiling early."
  - id: f20
    topic: u5.cooling
    difficulty: 2
    learn: "Pressure cap has two valves: a pressure valve (opens to the overflow when pressure is high) and a vacuum valve (lets coolant back in when cooling down)."
    why: "Prevents bursting hoses and collapsing hoses."
    q: "Two valves in a radiator pressure cap?"
    a: "Pressure valve and vacuum valve."
    simple: "One lets out, one lets back in."
  - id: f21
    topic: u5.cooling
    difficulty: 2
    learn: "Never open a hot radiator cap."
    why: "Pressurised hot coolant can spray out and scald."
    q: "Is it safe to open a hot radiator cap?"
    a: "No — wait until it cools."
    simple: "Hot cap = danger of burns."
  - id: f22
    topic: u5.cooling
    difficulty: 2
    learn: "Coolant = water + antifreeze (ethylene glycol or propylene glycol) + corrosion inhibitors. Usually 50:50 mix."
    why: "Lowers freezing point, raises boiling point and stops corrosion."
    q: "Common antifreeze chemical?"
    a: "Ethylene glycol."
    simple: "Water plus glycol protects in heat and cold."
  - id: f23
    topic: u5.cooling
    difficulty: 2
    learn: "Antifreeze is used even in hot places like Kerala because it prevents rust and scale and raises boiling point."
    why: "Plain water corrodes metal and leaves deposits."
    q: "Why use coolant with antifreeze in hot climates?"
    a: "Corrosion protection and higher boiling point."
    simple: "Coolant protects metal, not just from cold."
  - id: f24
    topic: u5.cooling
    difficulty: 2
    learn: "Other antifreeze materials: methanol, ethanol (wood alcohol, alcohol), glycerine. Ethylene glycol is preferred."
    why: "Alcohols evaporate easily."
    q: "Why is alcohol less preferred as antifreeze?"
    a: "It evaporates easily (low boiling point)."
    simple: "Alcohol boils away."
  - id: f25
    topic: u5.cooling
    difficulty: 2
    learn: "Expansion (overflow) tank stores coolant pushed out when hot and returns it when cold."
    why: "Keeps the radiator always full."
    q: "Purpose of the coolant expansion tank?"
    a: "Store expanding coolant and return it when cool."
    simple: "A side bottle for extra coolant."
  - id: f26
    topic: u5.cooling
    difficulty: 2
    learn: "Cooling fan types: belt-driven fixed fan, viscous (fluid) coupling fan, thermostatically controlled electric fan."
    why: "Fan only needed at low speed or in traffic."
    q: "Fan type that switches on only when coolant is hot?"
    a: "Electric fan (thermostatically controlled)."
    simple: "Electric fan runs only when needed."
  - id: f27
    topic: u5.cooling
    difficulty: 2
    learn: "Viscous fan coupling uses silicone fluid; it slips when cool and locks up when the air behind the radiator is hot."
    why: "Saves power and reduces noise."
    q: "Fluid used in a viscous fan coupling?"
    a: "Silicone fluid."
    simple: "Thick fluid connects the fan only when hot."
  - id: f28
    topic: u5.cooling
    difficulty: 2
    learn: "Fan shroud directs air through the whole radiator core."
    why: "Without it, air leaks around the fan edges."
    q: "Purpose of a fan shroud?"
    a: "Direct air through the radiator core."
    simple: "A cover that guides air."
  - id: f29
    topic: u5.cooling
    difficulty: 2
    learn: "Overheating causes: low coolant, leaks, loose or broken fan belt, stuck thermostat, blocked radiator, faulty pump, fan failure, head gasket leak."
    why: "Any break in heat removal causes it."
    q: "Name two causes of engine overheating."
    a: "Low coolant, broken belt, stuck thermostat, blocked radiator, fan failure."
    simple: "Not enough water, flow or air."
  - id: f30
    topic: u5.cooling
    difficulty: 2
    learn: "Temperature gauge sender is a thermistor in the coolant passage; resistance falls as temperature rises."
    why: "The gauge reads the change in current."
    q: "Sensor used for coolant temperature gauge?"
    a: "Thermistor (NTC)."
    simple: "Its resistance changes with heat."
  - id: sum
    topic: u5.cooling
    type: summary
    points:
      - "Air cooling (fins) vs water cooling."
      - "Thermo-syphon (no pump) vs pump circulation."
      - "Thermostat (wax) opens ~85°C; bypass for warm-up."
      - "Pressure cap raises boiling point; pressure + vacuum valves."
      - "Coolant = water + ethylene glycol; electric/viscous fans."

