  # ---------- Petrol fuel feed ----------
  - id: f01
    topic: u5.petrolfuel
    difficulty: 1
    learn: "Petrol fuel system parts: tank, fuel lines, filter, fuel pump, carburettor or injectors."
    why: "Fuel must reach the engine clean and at the right pressure."
    q: "Name the parts of a petrol fuel system."
    a: "Tank, lines, filter, pump, carburettor/injector."
    simple: "Tank → pump → filter → engine."
  - id: f02
    topic: u5.petrolfuel
    difficulty: 2
    learn: "Fuel feed systems: gravity feed, pressure feed, vacuum feed, pump feed (mechanical or electrical)."
    why: "Small vehicles can use gravity; cars need a pump."
    q: "Simplest fuel feed system used in motorcycles?"
    a: "Gravity feed."
    simple: "Tank above the engine, fuel just flows down."
  - id: f03
    topic: u5.petrolfuel
    difficulty: 2
    learn: "AC mechanical fuel pump: a diaphragm pump worked by a rocker arm from an eccentric on the camshaft."
    why: "Engine rotation pumps the fuel."
    q: "What operates the AC mechanical fuel pump?"
    a: "Eccentric on the camshaft (via rocker arm)."
    simple: "Camshaft moves a lever that flexes a diaphragm."
  - id: f04
    topic: u5.petrolfuel
    difficulty: 2
    learn: "AC pump parts: diaphragm, rocker arm, return spring, inlet and outlet valves, filter screen, priming lever."
    why: "The diaphragm sucks and pushes fuel through one-way valves."
    q: "Main moving part that pumps fuel in an AC pump?"
    a: "Diaphragm."
    simple: "A flexible sheet sucks and pushes petrol."
  - id: f05
    topic: u5.petrolfuel
    difficulty: 2
    learn: "In the AC pump, the spring pushes fuel out. When the float bowl is full, the diaphragm stays down and the pump idles."
    why: "Delivery pressure is set by the spring, not the cam."
    q: "What decides the delivery pressure of an AC pump?"
    a: "The diaphragm spring."
    simple: "The spring pushes the fuel, so pressure stays safe."
  - id: f06
    topic: u5.petrolfuel
    difficulty: 2
    learn: "SU electrical fuel pump: a solenoid pulls a diaphragm; contact points switch it off and on."
    why: "Works as soon as the ignition is on, even before cranking."
    q: "What moves the diaphragm in an SU electric pump?"
    a: "An electromagnet (solenoid)."
    simple: "Electric magnet flexes the diaphragm."
  - id: f07
    topic: u5.petrolfuel
    difficulty: 2
    learn: "Electric pumps can be fitted near the tank, away from engine heat."
    why: "This reduces vapour lock."
    q: "Advantage of an electric fuel pump?"
    a: "Fitted away from heat; fuel at once on switch-on; less vapour lock."
    simple: "Cool location, instant fuel."
  - id: f08
    topic: u5.petrolfuel
    difficulty: 2
    learn: "Modern fuel-injected cars use an electric in-tank (submerged) roller-cell or turbine pump."
    why: "Fuel cools the pump and prevents vapour."
    q: "Where is the fuel pump fitted in modern MPFI cars?"
    a: "Inside the fuel tank."
    simple: "Pump sits in the tank."
  - id: f09
    topic: u5.petrolfuel
    difficulty: 2
    learn: "Vapour lock: petrol boils in hot fuel lines and vapour blocks fuel flow."
    why: "Pumps cannot push vapour well."
    q: "Fuel line blocked by petrol vapour is called?"
    a: "Vapour lock."
    simple: "Bubbles block the fuel."
  - id: f10
    topic: u5.petrolfuel
    difficulty: 2
    learn: "Petrol filters remove dirt and water. Types: in-line paper filter, sediment bowl, gauze strainer in tank and pump."
    why: "Dirt blocks carburettor jets and injectors."
    q: "Why are fuel filters used?"
    a: "To remove dirt and water from fuel."
    simple: "Clean fuel, clear jets."
  - id: f11
    topic: u5.petrolfuel
