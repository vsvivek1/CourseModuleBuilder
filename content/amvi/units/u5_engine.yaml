    why: "Fuel must be very clean and at very high pressure."
    q: "Order of parts in a diesel fuel system?"
    a: "Tank, feed pump, filters, injection pump, injectors."
    simple: "Tank → lift pump → filter → injection pump → injector."
  - id: f02
    topic: u5.dieselfuel
    difficulty: 2
