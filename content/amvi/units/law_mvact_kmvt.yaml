  # ---------- Kerala MV Taxation Act ----------
  - id: f01
    topic: law.kmvt
    difficulty: 1
    learn: "The Kerala Motor Vehicles Taxation Act, 1976 (KMVT Act) lets the State collect tax on motor vehicles used or kept for use in Kerala."
    why: "Vehicle tax is a State subject."
    q: "Which Act governs vehicle tax in Kerala?"
    a: "Kerala Motor Vehicles Taxation Act, 1976."
    simple: "KMVT Act 1976 = Kerala vehicle tax."
  - id: f02
    topic: law.kmvt
    difficulty: 2
    learn: "Section 2(e) of the KMVT Act defines purchase value: the value of the vehicle shown in the purchase invoice, including taxes, which is used to work out one-time tax."
    why: "One-time tax is a percentage of purchase value."
    q: "Which clause defines purchase value?"
    a: "Section 2(e)."
    simple: "Invoice price = purchase value."
  - id: f03
    topic: law.kmvt
    difficulty: 1
    learn: "Section 3: levy of tax. Tax is charged on every motor vehicle used or kept for use in Kerala, at rates fixed by the Government within the limits in the Schedule."
    why: "Main charging section."
    q: "Which KMVT section levies tax?"
    a: "Section 3."
    simple: "Sec 3: tax is charged."
  - id: f04
    topic: law.kmvt
    difficulty: 2
    learn: "Private (non-transport) vehicles like motorcycles and cars pay a one-time tax for 15 years, worked out as a percentage of purchase value in slabs."
    why: "One payment instead of yearly tax."
    q: "For how many years is one-time tax paid for a private car?"
    a: "15 years."
    simple: "Pay once for 15 years."
  - id: f05
    topic: law.kmvt
    difficulty: 2
    learn: "Transport vehicles usually pay tax quarterly (every three months) in advance. Rates depend on seats for passenger vehicles and on weight for goods vehicles."
    why: "Commercial vehicles pay regularly as they earn."
    q: "How often do stage carriages pay tax in Kerala?"
    a: "Quarterly, in advance."
    simple: "Buses pay every quarter."
  - id: f06
    topic: law.kmvt
    difficulty: 1
    learn: "Section 3A: levy of green tax on older vehicles, to discourage polluting vehicles. The money is used for environment-related measures."
    why: "Old vehicles pollute more."
    q: "Which KMVT section levies green tax?"
    a: "Section 3A."
    simple: "Sec 3A: green tax on old vehicles."
  - id: f07
    topic: law.kmvt
    difficulty: 1
    learn: "Section 4: tax must be paid in advance by the registered owner or person in possession, and a licence (tax token or receipt) is issued."
    why: "Proof that tax was paid."
    q: "Who must pay vehicle tax under Section 4?"
    a: "Registered owner or person in possession or control."
    simple: "Owner pays in advance, gets receipt."
  - id: f08
    topic: law.kmvt
    difficulty: 2
    learn: "PSC trap: KMVT Section 4 is 'Payment of tax and issue of licence'. The 'licence' here is the tax licence, not a driving licence."
    why: "Options may confuse the two."
    q: "What 'licence' is issued under KMVT Section 4?"
    a: "Tax licence (proof of tax payment)."
    simple: "Tax licence, not driving licence."
  - id: f09
    topic: law.kmvt
    difficulty: 1
    learn: "Section 5: exemption from tax. The Government can exempt any class of vehicles, fully or partly, by notification."
    why: "E.g. vehicles for disabled persons or special purposes."
    q: "Which KMVT section allows exemption from tax?"
    a: "Section 5."
    simple: "Sec 5: Government can exempt."
  - id: f10
    topic: law.kmvt
    difficulty: 2
    learn: "A vehicle not used for a period can avoid tax if the owner gives advance non-use intimation and follows the rules (such as surrendering documents)."
    why: "No use, no tax."
    q: "How can an owner avoid tax for a period of non-use?"
    a: "Give advance intimation of non-use as per rules."
    simple: "Tell in advance you won't use it."
  - id: f11
    topic: law.kmvt
    difficulty: 1
    learn: "Section 6: refund of tax. Tax paid can be refunded for periods the vehicle was not used, subject to conditions in the Act and rules."
    why: "Fairness when tax was paid but vehicle not used."
    q: "Which KMVT section deals with refund of tax?"
    a: "Section 6."
    simple: "Sec 6: refund."
  - id: f12
    topic: law.kmvt
    difficulty: 2
    learn: "Refund of one-time tax is also possible, in proportion, when a Kerala vehicle is moved and registered in another State, or is destroyed."
    why: "Owner pays tax again in the new State."
    q: "Give one case for refund of one-time tax."
    a: "Vehicle moved to another State, or destroyed."
    simple: "Moved out → part refund."
  - id: f13
    topic: law.kmvt
    difficulty: 1
    learn: "Section 7: additional tax. If a vehicle is altered or used in a way that needs a higher tax, the owner must pay the extra (difference) tax before using it so."
    why: "Example: private car turned into a taxi, or more seats added."
    q: "Which KMVT section deals with payment of additional tax?"
    a: "Section 7."
    simple: "Sec 7: pay the extra."
  - id: f14
    topic: law.kmvt
    difficulty: 1
    learn: "Section 10: officers of Police or MVD (of prescribed rank, in uniform) can stop a motor vehicle and keep it stationary to check tax payment and documents."
    why: "To enforce tax collection."
    q: "Which KMVT section empowers officers to stop vehicles?"
    a: "Section 10."
    simple: "Sec 10: stop to check tax."
  - id: f15
    topic: law.kmvt
    difficulty: 1
    learn: "Section 11: if tax is not paid, the authorised officer can seize and detain the vehicle until the tax is paid. If still unpaid, the vehicle can be sold to recover the dues."
    why: "Strong tool against tax evaders."
    q: "Which KMVT section allows seizure and sale of vehicles?"
    a: "Section 11."
    simple: "Sec 11: seize, detain, sell."
  - id: f16
    topic: law.kmvt
    difficulty: 2
    learn: "When seizing under Section 11, the officer must arrange for the safety of passengers and goods in the vehicle."
    why: "Passengers should not be stranded."
    q: "What must an officer arrange when seizing a bus for tax?"
    a: "Safety of passengers and goods."
    simple: "Look after passengers."
  - id: f17
    topic: law.kmvt
    difficulty: 1
    learn: "Section 12: additional tax payable when tax is not paid in time. A penalty amount is added to the unpaid tax."
    why: "Late payment costs more."
    q: "Which KMVT section adds extra tax for non-payment?"
    a: "Section 12."
    simple: "Sec 12: late tax costs more."
  - id: f18
    topic: law.kmvt
    difficulty: 1
    learn: "Section 13: unpaid tax and additional tax can be recovered as arrears of land revenue (under the Kerala Revenue Recovery Act)."
    why: "Revenue recovery can attach property."
    q: "How are unpaid vehicle taxes recovered under Section 13?"
    a: "As arrears of land revenue."
    simple: "Sec 13: recover like land tax."
  - id: f19
    topic: law.kmvt
    difficulty: 1
    learn: "Section 26: escaped assessment. If tax was not assessed or was assessed too low, the taxation officer can assess and demand it later, after notice."
    why: "Missed tax is still due."
    q: "Which KMVT section deals with escaped assessment?"
    a: "Section 26."
    simple: "Sec 26: catch missed tax."
  - id: f20
    topic: law.kmvt
    difficulty: 2
    learn: "Before demanding escaped tax under Section 26, the owner must be given notice and a chance to be heard."
    why: "Natural justice."
    q: "Is notice needed before demanding escaped tax?"
    a: "Yes."
    simple: "Notice first, then demand."
  - id: f21
    topic: law.kmvt
    difficulty: 2
    learn: "The taxation officer under the KMVT Act is usually the RTO or Joint RTO (Sub RTO)."
    why: "AMVIs assist in tax enforcement."
    q: "Who is the taxation officer in Kerala?"
    a: "RTO or Joint RTO."
    simple: "RTO collects tax."
  - id: f22
    topic: law.kmvt
    difficulty: 3
    learn: "PSC trap: KMVT 2(e) purchase value, 3 levy, 3A green tax, 4 payment, 5 exemption, 6 refund, 7 additional tax, 10 stop, 11 seize, 12 late tax, 13 recovery, 26 escaped assessment."
    why: "Matching questions use these."
    q: "KMVT Section 13 deals with?"
    a: "Recovery as arrears of land revenue."
    simple: "3 levy, 3A green, 6 refund, 11 seize, 13 recover, 26 escaped."
  - id: f23
    topic: law.kmvt
    difficulty: 3
    learn: "PSC trap: Section 7 'additional tax' is for changed use or alteration; Section 12 'additional tax' is a penalty for not paying tax in time."
    why: "Same words, different meaning."
    q: "Additional tax for late payment is under Section 7 or 12?"
    a: "Section 12."
    simple: "7 = changed use; 12 = late."
  - id: sum
    topic: law.kmvt
    type: summary
    points:
      - "KMVT Act 1976; 2(e) purchase value; Sec 3 levy; 3A green tax."
      - "Sec 4 pay in advance, tax licence; Sec 5 exemption; Sec 6 refund."
      - "Sec 7 extra tax for changed use; Sec 12 extra for late payment."
      - "Sec 10 stop; Sec 11 seize and sell; Sec 13 land revenue arrears."
      - "Sec 26 escaped assessment after notice."

