cards:
  # ---------- Definitions ----------
  - id: f01
    topic: law.defs
    difficulty: 1
    learn: "Section 2 of the MV Act gives the definitions. Exam questions often ask the clause number or the key limit in a definition."
    why: "Every other section depends on these meanings."
    q: "Which section of the MV Act contains definitions?"
    a: "Section 2."
    simple: "Sec 2 = meanings of words."
  - id: f02
    topic: law.defs
    difficulty: 2
    learn: "Adapted vehicle, Section 2(1): a vehicle specially designed, or altered under Section 52, for the sole use of a person with a physical defect or disability."
    why: "It allows disabled people to drive safely."
    q: "Define adapted vehicle."
    a: "Vehicle built or altered for the sole use of a person with disability (Sec 2(1))."
    simple: "Vehicle made for a disabled person."
  - id: f03
    topic: law.defs
    difficulty: 2
    learn: "Adapted vehicle can be made by alteration under Section 52, and it must be used only by or for that disabled person."
    why: "PSC links 2(1) to Section 52."
    q: "Alteration for an adapted vehicle is allowed under which section?"
    a: "Section 52."
    simple: "2(1) with 52."
  - id: f04
    topic: law.defs
    difficulty: 2
    learn: "Aggregator, Section 2(1A): a digital intermediary or marketplace that connects a passenger with a driver for transport, like Uber or Ola. Added in 2019."
    why: "App taxis needed legal control."
    q: "Which clause defines aggregator?"
    a: "Section 2(1A)."
    simple: "Aggregator = taxi app."
  - id: f05
    topic: law.defs
    difficulty: 2
    learn: "Aggregators need a licence under Section 93 and must follow the guidelines issued by the Central Government."
    why: "To protect passengers and drivers."
    q: "Aggregator licence is issued under which section?"
    a: "Section 93."
    simple: "App taxi needs Sec 93 licence."
  - id: f06
    topic: law.defs
    difficulty: 1
    learn: "Articulated vehicle, Section 2(2): a motor vehicle to which a semi-trailer is attached."
    why: "Tractor-trailer trucks are articulated vehicles."
    q: "Define articulated vehicle."
    a: "Motor vehicle with a semi-trailer attached (Sec 2(2))."
    simple: "Truck head + semi-trailer."
  - id: f07
    topic: law.defs
    difficulty: 2
    learn: "Gross vehicle weight (GVW), Section 2(15): the total weight of the vehicle and load certified and registered by the registering authority as permissible for that vehicle."
    why: "GVW decides class, tax and overloading."
    q: "Define gross vehicle weight."
    a: "Total permissible weight of vehicle + load, certified and registered."
    simple: "Max allowed weight with load."
  - id: f08
    topic: law.defs
    difficulty: 2
    learn: "Unladen weight, Section 2(48): weight of the vehicle with all equipment ordinarily used, but without the driver or attendant."
    why: "PSC trap: driver's weight is excluded."
    q: "Is the driver's weight included in unladen weight?"
    a: "No."
    simple: "Empty vehicle weight, no driver."
  - id: f09
    topic: law.defs
    difficulty: 3
    learn: "If alternative bodies or parts are used, unladen weight is taken with the heaviest such body or part."
    why: "The safe, higher value is used."
    q: "Unladen weight with alternative bodies is taken with?"
    a: "The heaviest alternative body or part."
    simple: "Use the heaviest body."
  - id: f10
    topic: law.defs
    difficulty: 2
    learn: "Light motor vehicle, Section 2(21): transport vehicle or omnibus with GVW, or motor car, tractor or road roller with unladen weight, not exceeding 7,500 kg."
    why: "Limit for LMV licence."
    q: "Weight limit for a light motor vehicle?"
    a: "Not exceeding 7,500 kg."
    simple: "LMV ≤ 7,500 kg."
  - id: f11
    topic: law.defs
    difficulty: 2
    learn: "Heavy goods vehicle, Section 2(16): a goods carriage with GVW, or a tractor or road roller with unladen weight, exceeding 12,000 kg."
    why: "Above 12 tonnes is heavy."
    q: "Heavy goods vehicle GVW exceeds?"
    a: "12,000 kg."
    simple: "HGV > 12,000 kg."
  - id: f12
    topic: law.defs
    difficulty: 2
    learn: "Heavy passenger motor vehicle, Section 2(17): public or private service vehicle, educational institution bus or omnibus with GVW, or a motor car with unladen weight, exceeding 12,000 kg."
    why: "Big buses are HPMV."
    q: "HPMV limit?"
    a: "GVW (or motor car unladen weight) above 12,000 kg."
    simple: "HPMV > 12,000 kg."
  - id: f13
    topic: law.defs
    difficulty: 2
    learn: "Medium goods vehicle, Section 2(23): any goods carriage that is neither a light motor vehicle nor a heavy goods vehicle."
    why: "So its GVW is above 7,500 kg up to 12,000 kg."
    q: "GVW range of a medium goods vehicle?"
    a: "Above 7,500 kg up to 12,000 kg."
    simple: "Between light and heavy."
  - id: f14
    topic: law.defs
    difficulty: 2
    learn: "Medium passenger motor vehicle, Section 2(24): a public or private service vehicle or educational institution bus other than a motorcycle, invalid carriage, LMV or HPMV."
    why: "Defined by what it is not."
    q: "Which clause defines medium passenger motor vehicle?"
    a: "Section 2(24)."
    simple: "Middle-size bus."
  - id: s01
    topic: law.defs
    type: steps
    difficulty: 2
    title: "Classify a goods vehicle by GVW"
    steps:
      - text: "Question: A goods carriage has GVW 9,000 kg. Which class?"
      - text: "LMV is up to 7,500 kg. 9,000 is more, so not LMV."
      - text: "HGV is above 12,000 kg. 9,000 is less, so not HGV."
      - text: "So it is a medium goods vehicle, Section 2(23)."
    summary:
      - "≤7,500 LMV; 7,500–12,000 medium; >12,000 heavy."
      - "Goods and passenger classes use GVW."
    q: "Goods carriage of GVW 9,000 kg is?"
    a: "Medium goods vehicle."
  - id: f15
    topic: law.defs
    difficulty: 1
    learn: "Motor cab, Section 2(25): a vehicle made or adapted to carry not more than 6 passengers, excluding the driver, for hire or reward."
    why: "Taxi cars are motor cabs."
    q: "Maximum passengers in a motor cab?"
    a: "6 (excluding driver)."
    simple: "Taxi: up to 6 passengers."
  - id: f16
    topic: law.defs
    difficulty: 1
    learn: "Maxi cab, Section 2(22): a vehicle made or adapted to carry more than 6 but not more than 12 passengers, excluding the driver, for hire or reward."
    why: "Tempo travellers and vans for hire."
    q: "Passenger range of a maxi cab?"
    a: "More than 6, up to 12 (excluding driver)."
    simple: "Maxi cab: 7 to 12."
  - id: f17
    topic: law.defs
    difficulty: 2
    learn: "Motor car, Section 2(26): any motor vehicle other than a transport vehicle, omnibus, road roller, tractor, motorcycle or invalid carriage."
    why: "It is a private car, defined by exclusion."
    q: "Is a taxi a 'motor car' under Section 2(26)?"
    a: "No; it is a transport vehicle."
    simple: "Motor car = private car."
  - id: f18
    topic: law.defs
    difficulty: 1
    learn: "Omnibus, Section 2(29): any motor vehicle made or adapted to carry more than 6 persons, excluding the driver."
    why: "PSC trap: omnibus counts persons, not hire."
    q: "Define omnibus."
    a: "Vehicle to carry more than 6 persons, excluding driver (Sec 2(29))."
    simple: "More than 6 people = omnibus."
  - id: f19
    topic: law.defs
    difficulty: 2
    learn: "Private service vehicle, Section 2(33): carries more than 6 persons, excluding driver, used by the owner for their trade or business, not for hire or reward."
    why: "Example: a company bus for its staff."
    q: "A company's own staff bus is which vehicle?"
    a: "Private service vehicle (Sec 2(33))."
    simple: "Company bus = private service vehicle."
  - id: f20
    topic: law.defs
    difficulty: 2
    learn: "A private service vehicle does not include a motor vehicle used for public purposes."
    why: "Government vehicles are excluded."
    q: "Does a vehicle used for public purposes count as a private service vehicle?"
    a: "No."
    simple: "Public purpose vehicle is excluded."
  - id: f21
    topic: law.defs
    difficulty: 1
    learn: "Public service vehicle, Section 2(35): any motor vehicle used for carrying passengers for hire or reward. It includes maxi cab, motor cab, contract carriage and stage carriage."
    why: "Buses and taxis for hire."
    q: "Name four vehicles included in public service vehicle."
    a: "Maxi cab, motor cab, contract carriage, stage carriage."
    simple: "Any vehicle carrying people for money."
  - id: f22
    topic: law.defs
    difficulty: 2
    learn: "Stage carriage, Section 2(40): carries more than 6 passengers for hire, charging separate fares per passenger for the whole or stages of a journey."
    why: "Ordinary route buses."
    q: "A route bus collecting fares by stages is a?"
    a: "Stage carriage."
    simple: "Route bus = stage carriage."
  - id: f23
    topic: law.defs
    difficulty: 2
    learn: "Contract carriage, Section 2(7): carries passengers for hire under a contract for the whole vehicle, for a fixed or agreed rate, without stopping to pick up others."
    why: "Tourist buses and hired vehicles."
    q: "A tourist bus hired for a trip is a?"
    a: "Contract carriage."
    simple: "Whole vehicle hired = contract carriage."
  - id: f24
    topic: law.defs
    difficulty: 1
    learn: "Transport vehicle, Section 2(47): a public service vehicle, a goods carriage, an educational institution bus or a private service vehicle."
    why: "These need permits and fitness."
    q: "Four kinds of transport vehicle?"
    a: "Public service vehicle, goods carriage, educational institution bus, private service vehicle."
    simple: "Public, goods, school bus, private service."
  - id: f25
    topic: law.defs
    difficulty: 2
    learn: "PSC trap: an educational institution bus and a private service vehicle are transport vehicles even though they are not for hire."
    why: "Options often miss these two."
    q: "Is a school-owned bus a transport vehicle?"
    a: "Yes."
    simple: "School bus = transport vehicle."
  - id: f26
    topic: law.defs
    difficulty: 2
    learn: "Goods carriage, Section 2(14): a motor vehicle made or adapted only for carrying goods, or any vehicle used for carrying goods."
    why: "Lorries, pickups, tankers."
    q: "Which clause defines goods carriage?"
    a: "Section 2(14)."
    simple: "Vehicle for goods."
  - id: f27
    topic: law.defs
    difficulty: 3
    learn: "PSC trap with numbers: 2(15) GVW, 2(16) heavy goods, 2(17) heavy passenger, 2(21) LMV, 2(22) maxi cab, 2(25) motor cab, 2(26) motor car, 2(29) omnibus."
    why: "Clause numbers are asked directly."
    q: "Clause 2(22) defines?"
    a: "Maxi cab."
    simple: "15 GVW, 21 LMV, 22 maxi, 25 cab, 29 omnibus."
  - id: f28
    topic: law.defs
    difficulty: 3
    learn: "More clause numbers: 2(1) adapted vehicle, 2(1A) aggregator, 2(2) articulated vehicle, 2(33) private service vehicle, 2(35) public service vehicle, 2(47) transport vehicle, 2(48) unladen weight."
    why: "Matching questions use these."
    q: "Clause 2(47) defines?"
    a: "Transport vehicle."
    simple: "33 private service, 35 public service, 47 transport, 48 unladen."
  - id: f29
    topic: law.defs
    difficulty: 2
    learn: "Motor vehicle, Section 2(28): any mechanically propelled vehicle adapted for use on roads. It excludes vehicles on fixed rails and special factory vehicles, and vehicles with engine up to 25 cc."
    why: "Basic test for whether the Act applies."
    q: "Engine capacity below which a vehicle is not a 'motor vehicle'?"
    a: "25 cc or less."
    simple: "Up to 25 cc: not a motor vehicle."
  - id: f30
    topic: law.defs
    difficulty: 2
    learn: "Good Samaritan, Section 2(12A): a person who, in good faith and without expecting reward, gives emergency help at an accident or takes the victim to hospital."
    why: "Linked with protection in Section 134A."
    q: "Which clause defines Good Samaritan?"
    a: "Section 2(12A)."
    simple: "Helper without reward."
  - id: sum
    topic: law.defs
    type: summary
    points:
      - "LMV ≤ 7,500 kg; medium up to 12,000 kg; heavy above 12,000 kg."
      - "Motor cab ≤ 6; maxi cab 7–12; omnibus > 6 persons."
      - "Transport = public service, goods, school bus, private service."
      - "Unladen weight excludes driver; heaviest alternative body."
      - "2(1) adapted, 2(1A) aggregator, 2(2) articulated."

  # ---------- Registration ----------
  - id: f01
    topic: law.registration
    difficulty: 1
    learn: "Section 39: no person shall drive, and no owner shall allow, a motor vehicle in a public place unless it is registered and shows its registration mark."
    why: "Every vehicle on the road must be traceable to an owner."
    q: "Which section makes registration necessary?"
    a: "Section 39."
    simple: "Sec 39: register before road use."
  - id: f02
    topic: law.registration
    difficulty: 2
    learn: "Section 39 also needs the RC to be valid: not suspended or cancelled."
    why: "A suspended RC means the vehicle is not validly registered."
    q: "Can a vehicle with a suspended RC be driven?"
    a: "No."
    simple: "Suspended RC = not registered."
  - id: f03
    topic: law.registration
    difficulty: 2
    learn: "Exception to Section 39: a vehicle in the possession of a dealer, used under a trade certificate."
    why: "Dealers move unregistered new vehicles."
    q: "Under what certificate can a dealer move an unregistered vehicle?"
    a: "Trade certificate."
    simple: "Dealer uses trade certificate."
  - id: f04
    topic: law.registration
    difficulty: 2
    learn: "Using a vehicle without registration is punished under Section 192: first offence ₹2,000 to ₹5,000; later offences up to 1 year jail or ₹5,000 to ₹10,000 fine, or both."
    why: "2019 amounts."
    q: "Penalty section for using an unregistered vehicle?"
    a: "Section 192."
    simple: "No registration → Sec 192."
  - id: f05
    topic: law.registration
    difficulty: 2
    learn: "Temporary registration (Section 43) is valid for one month. It lets a new vehicle be driven until permanent registration."
    why: "Not in the syllabus list, but often asked with Section 39."
    q: "Validity of temporary registration?"
    a: "One month (Section 43)."
    simple: "Temporary RC = 1 month."
  - id: f06
    topic: law.registration
    difficulty: 1
    learn: "Section 44: the registering authority may ask the owner to produce the vehicle at the time of registration to check its details."
    why: "To match chassis number, engine number and body."
    q: "Which section deals with production of vehicle at registration?"
    a: "Section 44."
    simple: "Sec 44: show the vehicle."
  - id: f07
    topic: law.registration
    difficulty: 2
    learn: "After the 2019 amendment, a new non-transport vehicle sold by an authorised dealer can be registered at the dealer's place without producing it before the authority."
    why: "Dealer-point registration saves time."
    q: "Must a new private car be produced at the RTO for registration?"
    a: "No, dealer-point registration is allowed (2019)."
    simple: "New private car registered at dealer."
  - id: f08
    topic: law.registration
    difficulty: 1
    learn: "Section 46: a vehicle registered in any State does not need to be registered again in another State. Registration is valid throughout India."
    why: "Free movement across States."
    q: "Is a Kerala-registered car's registration valid in Karnataka?"
    a: "Yes (Section 46)."
    simple: "One registration, all India."
  - id: f09
    topic: law.registration
    difficulty: 2
    learn: "But under Section 47, if the vehicle is kept in another State for more than 12 months, the owner must apply for a new registration mark there."
    why: "PSC trap: Section 46 valid everywhere; Section 47 the 12-month rule."
    q: "After how long in another State must a new registration mark be taken?"
    a: "More than 12 months (Section 47)."
    simple: "Over 12 months in new State → new number."
  - id: f10
    topic: law.registration
    difficulty: 1
    learn: "Section 52: no owner shall alter a vehicle so that its details in the RC differ from those originally given by the manufacturer."
    why: "Unsafe changes put people at risk."
    q: "Which section prohibits alteration in a motor vehicle?"
    a: "Section 52."
    simple: "Sec 52: no illegal alteration."
  - id: f11
    topic: law.registration
    difficulty: 2
    learn: "Allowed alterations under Section 52: change of fuel (like CNG, LPG or electric kits) using approved kits, retro-fitment for adapted vehicles, and others notified by the Central Government."
    why: "Useful changes are allowed with approval."
    q: "Is CNG conversion allowed under Section 52?"
    a: "Yes, with an approved kit and RC endorsement."
    simple: "Approved kit changes are OK."
  - id: f12
    topic: law.registration
    difficulty: 2
    learn: "Replacing the engine with one of the same type is allowed, but the owner must inform the registering authority."
    why: "The RC must show the correct engine number."
    q: "Must the RTO be told about an engine replacement?"
    a: "Yes."
    simple: "New engine → tell RTO."
  - id: f13
    topic: law.registration
    difficulty: 2
    learn: "When an approved alteration is made, the owner must inform the registering authority within 14 days so the RC can be endorsed."
    why: "Records must match the vehicle."
    q: "Time limit to inform the RTO of an approved alteration?"
    a: "14 days."
    simple: "Report alteration in 14 days."
  - id: f14
    topic: law.registration
    difficulty: 2
    learn: "Illegal alteration is punished under Section 182A(4) with ₹5,000 for each alteration."
    why: "Each illegal change is a separate fine."
    q: "Fine for each illegal alteration?"
    a: "₹5,000 per alteration (Section 182A(4))."
    simple: "₹5,000 per change."
  - id: f15
    topic: law.registration
    difficulty: 1
    learn: "Section 53: the registering authority can suspend the registration if the vehicle is unsafe to use or does not meet Chapter VII standards."
    why: "Dangerous vehicles must be kept off the road."
    q: "Which section allows suspension of registration?"
    a: "Section 53."
    simple: "Sec 53: suspend RC."
  - id: f16
    topic: law.registration
    difficulty: 2
    learn: "Registration can also be suspended under Section 53 if a vehicle is used for hire or reward without a valid permit."
    why: "Illegal taxi services are stopped this way."
    q: "Give two grounds for suspension of RC."
    a: "Unsafe condition; used for hire without permit."
    simple: "Unsafe or illegal hire → suspend."
  - id: f17
    topic: law.registration
    difficulty: 2
    learn: "The owner must be given a chance to be heard before suspension, and must surrender the RC when suspended."
    why: "Natural justice and enforcement."
    q: "What must the owner surrender when RC is suspended?"
    a: "The registration certificate."
    simple: "Suspended → hand over RC."
  - id: f18
    topic: law.registration
    difficulty: 1
    learn: "Section 55: cancellation of registration. If a vehicle is destroyed or permanently unusable, the owner must report within 14 days and send the RC to the registering authority."
    why: "Stops misuse of the papers of a scrapped vehicle."
    q: "Time limit to report a destroyed vehicle for cancellation?"
    a: "14 days (Section 55)."
    simple: "Vehicle destroyed → report in 14 days."
  - id: f19
    topic: law.registration
    difficulty: 2
    learn: "Other grounds for cancellation under Section 55: vehicle permanently taken out of India, registration got by fraud, or chassis or engine details do not match records."
    why: "False or useless registrations must end."
    q: "Give one ground for cancellation of registration other than destruction."
    a: "Permanently removed from India, fraud, mismatched chassis."
    simple: "Fraud or gone → cancel."
  - id: f20
    topic: law.registration
    difficulty: 1
    learn: "Section 56: a transport vehicle is not validly registered unless it carries a certificate of fitness."
    why: "Commercial vehicles must be checked regularly for safety."
    q: "Which section requires a fitness certificate?"
    a: "Section 56."
    simple: "Sec 56: transport vehicle needs fitness."
  - id: f21
    topic: law.registration
    difficulty: 2
    learn: "Fitness certificates are issued by the prescribed authority (MVI) or by an authorised or automated testing station."
    why: "2019 brought automated testing stations."
    q: "Who issues fitness certificates?"
    a: "Prescribed authority or authorised (automated) testing station."
    simple: "Inspector or test centre issues fitness."
  - id: f22
    topic: law.registration
    difficulty: 2
    learn: "The authority can cancel a fitness certificate if the vehicle no longer meets the rules. The Central Government can extend fitness checks to other classes of vehicles."
    why: "Fitness must stay true all the time."
    q: "Can a fitness certificate be cancelled before expiry?"
    a: "Yes, if the vehicle becomes unfit."
    simple: "Unfit vehicle loses fitness."
  - id: f23
    topic: law.registration
    difficulty: 2
    learn: "Non-transport vehicle RC is valid for 15 years from issue, then renewable for 5 years at a time (Section 41)."
    why: "Old vehicles get checked again."
    q: "RC renewal period after 15 years?"
    a: "5 years."
    simple: "15 years, then 5-year renewals."
  - id: f24
    topic: law.registration
    difficulty: 3
    learn: "PSC trap: Section 39 necessity, 44 production, 46 valid all India, 52 alteration, 53 suspension, 55 cancellation, 56 fitness."
    why: "Matching questions use these numbers."
    q: "Section 55 deals with?"
    a: "Cancellation of registration."
    simple: "39 need, 44 show, 46 India, 52 alter, 53 suspend, 55 cancel, 56 fitness."
  - id: sum
    topic: law.registration
    type: summary
    points:
      - "Sec 39 registration needed; penalty Sec 192."
      - "Sec 44 produce vehicle; dealer-point registration for new private vehicles."
      - "Sec 46 valid in India; Sec 47 new mark after 12 months."
      - "Sec 52 no alteration; ₹5,000 per alteration."
      - "Sec 53 suspend; Sec 55 cancel (14 days); Sec 56 fitness."

  # ---------- Permits and STU ----------
  - id: f01
    topic: law.permits
    difficulty: 1
    learn: "Section 66: no owner shall use a transport vehicle in a public place except under the conditions of a permit granted or countersigned by an RTA, STA or prescribed authority."
    why: "Permits control routes, number and type of commercial vehicles."
    q: "Which section makes permits necessary?"
    a: "Section 66."
    simple: "Sec 66: transport vehicle needs permit."
  - id: f02
    topic: law.permits
    difficulty: 2
    learn: "Permit exemptions under Section 66(3) include government vehicles not used commercially, police, ambulances, fire services and funeral vehicles."
    why: "These serve the public, not for profit."
    q: "Does an ambulance need a permit?"
    a: "No (Section 66(3) exemption)."
    simple: "Ambulance, police, fire: no permit."
  - id: f03
    topic: law.permits
    difficulty: 2
    learn: "Another Section 66(3) exemption: goods vehicles with GVW not exceeding 3,000 kg."
    why: "Small goods vehicles are freed from permit rules."
    q: "Goods vehicles up to what GVW are exempt from permit?"
    a: "3,000 kg."
    simple: "Small goods vehicle ≤ 3,000 kg: no permit."
  - id: f04
    topic: law.permits
    difficulty: 2
    learn: "Battery-operated transport vehicles (and those running on ethanol or methanol) are exempted from permit requirement by central notification."
    why: "To promote clean vehicles."
    q: "Do battery-operated transport vehicles need a permit?"
    a: "No, they are exempted."
    simple: "Electric commercial vehicle: no permit."
  - id: f05
    topic: law.permits
    difficulty: 2
    learn: "Using a vehicle without a permit is punished under Section 192A: up to ₹10,000 fine and up to 6 months' imprisonment for the first offence."
    why: "2019 amounts."
    q: "Penalty section for using a vehicle without a permit?"
    a: "Section 192A."
    simple: "No permit → Sec 192A."
  - id: f06
    topic: law.permits
    difficulty: 2
    learn: "Types of permits: stage carriage, contract carriage, private service vehicle, goods carriage, temporary, national, tourist and special permits."
    why: "Each type allows a different kind of use."
    q: "Name four types of permit."
    a: "Stage carriage, contract carriage, goods carriage, tourist."
    simple: "Different jobs, different permits."
  - id: f07
    topic: law.permits
    difficulty: 2
    learn: "A temporary permit (Section 87) is for a short need, like a festival or season. It is valid for up to 4 months."
    why: "Not in the list but asked with Section 66."
    q: "Maximum validity of a temporary permit?"
    a: "4 months."
    simple: "Temporary permit ≤ 4 months."
  - id: f08
    topic: law.permits
    difficulty: 2
    learn: "Regular permits are generally valid for 5 years (Section 81)."
    why: "Long-term permits give stability to operators."
    q: "Normal validity of a stage carriage permit?"
    a: "5 years."
    simple: "Permit lasts 5 years."
  - id: f09
    topic: law.permits
    difficulty: 1
    learn: "A State Transport Undertaking (STU) is a government-run transport service. KSRTC is Kerala's STU."
    why: "Chapter VI gives STUs special powers."
    q: "Name Kerala's State Transport Undertaking."
    a: "KSRTC."
    simple: "KSRTC = Kerala's STU."
  - id: f10
    topic: law.permits
    difficulty: 1
    learn: "Chapter VI of the MV Act has special provisions for State Transport Undertakings."
    why: "Section 99 is in this chapter."
    q: "Which chapter deals with State Transport Undertakings?"
    a: "Chapter VI."
    simple: "Chapter VI = STU."
  - id: f11
    topic: law.permits
    difficulty: 2
