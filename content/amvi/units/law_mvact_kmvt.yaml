    learn: "Fines matched to sections: 194A ₹200 per passenger; 177 ₹500; 194B, 194C, 194D ₹1,000; 179 ₹2,000; 180, 181 ₹5,000; 182, 185, 194E ₹10,000; 194 ₹20,000; 199A ₹25,000."
    why: "Quick revision table."
    q: "Which section has a ₹25,000 fine?"
    a: "Section 199A (juvenile)."
    simple: "200, 500, 1000, 2000, 5000, 10000, 20000, 25000."
  - id: f57
    topic: law.offences
    difficulty: 3
    learn: "Offences with 3-month DL disqualification: 190(2) pollution, 194C pillion rules, 194D helmet."
    why: "Common PSC question."
    q: "Name a 2019 offence that carries 3 months DL disqualification."
    a: "No helmet (194D), triple riding (194C) or pollution (190(2))."
    simple: "Helmet, pillion, pollution: 3 months."
  - id: s01
    topic: law.offences
    type: steps
    difficulty: 2
    title: "Worked example: overloading fine"
    steps:
      - text: "Question: A lorry with GVW 16 tonnes is found carrying 19 tonnes. Find the fine under Section 194."
      - text: "Excess = 19 − 16 = 3 tonnes."
      - text: "Fine = ₹20,000 + (3 × ₹2,000) = ₹20,000 + ₹6,000."
      - text: "Total fine = ₹26,000, plus the excess load is off-loaded at the owner's cost."
    summary:
      - "Fine = 20,000 + 2,000 × extra tonnes."
      - "Excess load is off-loaded too."
    q: "3 tonnes overload. Fine?"
    a: "₹26,000."
