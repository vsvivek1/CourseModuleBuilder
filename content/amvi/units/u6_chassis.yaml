cards:
  # ---------- Frame ----------
  - id: f01
    topic: u6.frame
    difficulty: 1
    learn: "Chassis means the whole vehicle without the body: frame, engine, transmission, suspension, steering, brakes and wheels."
    why: "It is everything needed to make the vehicle move."
    q: "What is a chassis?"
    a: "The vehicle without its body (frame + running gear)."
    simple: "The running vehicle without the body shell."
  - id: f02
    topic: u6.frame
    difficulty: 1
    learn: "The frame is the backbone of the chassis. It supports the body, engine and all other units."
    why: "It must carry loads and resist bending and twisting."
    q: "Main job of the frame?"
    a: "Support all parts and carry loads."
    simple: "The skeleton of the vehicle."
  - id: f03
    topic: u6.frame
    difficulty: 2
    learn: "Loads on a frame: weight of vehicle and passengers (bending), road twisting (torsion), braking and acceleration (longitudinal), cornering (side), and impacts."
    why: "The frame must handle all of these together."
    q: "Name two loads acting on a vehicle frame."
    a: "Bending, torsion, braking, side and impact loads."
    simple: "Weight, twist, push, pull and knocks."
  - id: f04
    topic: u6.frame
    difficulty: 2
    learn: "Conventional (ladder) frame: two long side members joined by cross members, like a ladder. Used in trucks, buses and SUVs."
    why: "Strong, simple and easy to repair."
    q: "Frame used in trucks and buses?"
    a: "Ladder (conventional) frame."
    simple: "Two long rails with cross bars, like a ladder."
  - id: f05
    topic: u6.frame
    difficulty: 2
    learn: "Frameless (integral / unitary / monocoque) construction: body and frame are one welded shell. Used in most cars."
    why: "Lighter and stiffer, with lower floor."
    q: "Construction where body and frame are a single unit?"
    a: "Integral (monocoque / unitary) construction."
    simple: "The body itself is the frame."
  - id: f06
    topic: u6.frame
    difficulty: 2
    learn: "Semi-integral frame: a light frame is joined to the body through rubber mounts, sharing some loads."
    why: "Combines parts of both designs."
    q: "Frame between conventional and integral types?"
    a: "Semi-integral frame."
    simple: "Half frame, half body."
  - id: f07
    topic: u6.frame
    difficulty: 2
    learn: "Other frame types: backbone (central tube), X-frame, perimeter frame, space frame (tube cage, racing cars)."
    why: "Each balances stiffness and weight."
    q: "Frame made of many small tubes forming a cage?"
    a: "Space frame (tubular frame)."
    simple: "A cage of tubes."
  - id: f08
    topic: u6.frame
    difficulty: 2
    learn: "Frame sections used for side members: channel (C) section (most common), box section, tubular section, I-section."
    why: "Channel is easy to make and good in bending; box resists twisting."
    q: "Most common section for frame side members?"
    a: "Channel (C) section."
    simple: "C-shaped steel rails."
  - id: f09
    topic: u6.frame
    difficulty: 2
    learn: "Box section is best against torsion (twisting). Channel section is best in bending for its weight."
    why: "A closed section resists twist much better."
    q: "Which section best resists twisting?"
    a: "Box section."
    simple: "Closed box = hard to twist."
  - id: f10
    topic: u6.frame
    difficulty: 2
    learn: "Frame side members are deeper in the middle (between axles) where bending moment is greatest."
    why: "More depth gives more strength where needed."
    q: "Why is a frame deeper at the centre?"
    a: "Bending moment is maximum there."
    simple: "Make it strongest where it bends most."
  - id: f11
    topic: u6.frame
    difficulty: 2
    learn: "Frame is narrow at the front (kick-up / narrowed) to allow wheels to turn for steering, and upswept at the rear over the axle."
    why: "Front wheels need room to turn; rear axle needs room to move."
    q: "Why is the frame upswept at the rear?"
    a: "To give room for rear axle movement."
    simple: "Bent up over the axle for clearance."
  - id: f12
    topic: u6.frame
    difficulty: 2
    learn: "Frame material: mild steel or low-alloy steel sheet, pressed and riveted or welded. Some cars use aluminium."
    why: "Steel is strong, cheap and repairable."
    q: "Common material for vehicle frames?"
    a: "Mild steel / low-alloy steel."
    simple: "Pressed steel."
  - id: f13
    topic: u6.frame
    difficulty: 2
    learn: "Sub-frame: a smaller separate frame carrying the engine, suspension or axle, bolted to the main body through rubber mounts."
    why: "It isolates vibration and makes assembly easier."
    q: "What is a sub-frame?"
    a: "A small frame carrying engine/suspension, mounted to the body."
    simple: "A mini frame for the engine or suspension."
  - id: f14
    topic: u6.frame
    difficulty: 2
    learn: "Bumpers absorb small impacts and protect the body. Modern bumpers are plastic covers over energy-absorbing foam and a steel or aluminium beam."
    why: "They soak up low-speed crash energy."
    q: "Function of a bumper?"
    a: "Absorb impact and protect body/occupants."
    simple: "A cushion at the front and back."
  - id: f15
    topic: u6.frame
    difficulty: 2
    learn: "Fitting bull bars (crash guards) on cars is banned in India."
    why: "They make crashes worse for pedestrians and stop airbag sensors working properly."
    q: "Are bull bars allowed on cars in India?"
    a: "No (illegal alteration)."
    simple: "Metal guards on cars are not allowed."
  - id: f16
    topic: u6.frame
    difficulty: 2
    learn: "Crumple zones: front and rear parts of the body designed to crush in a crash, absorbing energy. The passenger cell stays rigid."
    why: "Slower deceleration means less injury."
    q: "Purpose of crumple zones?"
    a: "Absorb crash energy so the cabin stays safe."
    simple: "The ends crush so people do not."
  - id: f17
    topic: u6.frame
    difficulty: 2
    learn: "Frame defects: cracks, bending, sagging, twisting and loose rivets. Alignment is checked with diagonal measurements."
    why: "Equal diagonals show the frame is square."
    q: "How is frame alignment checked simply?"
    a: "Diagonal measurements (should be equal)."
    simple: "Cross measurements must match."
  - id: f18
    topic: u6.frame
    difficulty: 2
    learn: "Chassis layouts: front engine rear drive, front engine front drive, rear engine rear drive, mid engine, four-wheel drive."
    why: "Layout affects space, traction and handling."
    q: "Most common layout in Indian small cars?"
    a: "Front engine, front-wheel drive."
    simple: "Engine and drive both at the front."
  - id: sum
    topic: u6.frame
    type: summary
    points:
      - "Chassis = vehicle without body; frame = backbone."
      - "Ladder frame (trucks) vs integral/monocoque (cars), semi-integral."
      - "Channel section common; box best for torsion."
      - "Narrowed front, upswept rear, deeper middle."
      - "Sub-frames, bumpers, crumple zones."

  # ---------- Axle ----------
  - id: f01
    topic: u6.axle
    difficulty: 1
    learn: "Dead axle carries only weight; it does not drive the wheels. Live axle carries weight and also drives the wheels."
    why: "Live axles have shafts inside to transmit power."
    q: "An axle that carries load but does not transmit power is?"
    a: "Dead axle."
    simple: "Dead = just holds. Live = holds and drives."
  - id: f02
    topic: u6.axle
    difficulty: 2
    learn: "Front axle of a rear-wheel-drive vehicle is a dead axle. Front axle of a front-wheel-drive vehicle is a live axle."
    why: "It depends on which wheels are driven."
    q: "Front axle of a rear-wheel-drive truck is dead or live?"
    a: "Dead."
    simple: "Truck front axle just steers and carries."
  - id: f03
    topic: u6.axle
    difficulty: 2
    learn: "Front axle beam has an I-section in the middle and round or elliptical section near the ends."
    why: "I-section resists bending; round ends resist twisting from braking."
    q: "Cross section of a front axle beam in the middle?"
    a: "I-section."
    simple: "I-shape for strength in the middle."
  - id: f04
    topic: u6.axle
    difficulty: 2
    learn: "Front axle beam is dropped (bent down) in the middle."
    why: "This lowers the chassis and engine for stability."
    q: "Why is the front axle beam dropped at the centre?"
    a: "To lower the chassis height."
    simple: "Bent down to sit the vehicle lower."
  - id: f05
    topic: u6.axle
    difficulty: 2
    learn: "Front axle is made of drop-forged medium carbon steel or nickel steel."
    why: "It needs high strength and toughness."
    q: "Front axle material?"
    a: "Drop-forged medium carbon or alloy steel."
    simple: "Forged strong steel."
  - id: f06
    topic: u6.axle
    difficulty: 2
    learn: "Stub axle carries the front wheel and turns on a kingpin for steering."
    why: "It lets the wheel steer while the axle beam stays still."
    q: "The short axle on which the front wheel turns for steering?"
    a: "Stub axle."
    simple: "The small axle that pivots to steer."
  - id: f07
    topic: u6.axle
    difficulty: 2
    learn: "Stub axle types: Elliott, reversed Elliott, Lemoine, reversed Lemoine."
    why: "They differ in how the stub axle and beam end fit together."
    q: "Name the four types of stub axle."
    a: "Elliott, reversed Elliott, Lemoine, reversed Lemoine."
    simple: "Four ways to join stub axle and beam."
  - id: f08
    topic: u6.axle
    difficulty: 2
    learn: "Elliott type: the axle beam end fits between the forked (yoke) stub axle. Reversed Elliott: the beam end is forked and the stub axle fits inside."
    why: "Reversed Elliott is the most common."
    q: "Most common stub axle arrangement?"
    a: "Reversed Elliott."
    simple: "In reversed Elliott, the beam has the fork."
  - id: f09
    topic: u6.axle
    difficulty: 2
    learn: "Lemoine type: an L-shaped stub axle fits under the beam end (no fork). Reversed Lemoine fits above."
    why: "Used where height is limited."
    q: "Stub axle with L-shaped spindle and no fork?"
    a: "Lemoine type."
    simple: "Lemoine = L-shape, no yoke."
  - id: f10
    topic: u6.axle
    difficulty: 2
    learn: "Kingpin (swivel pin) joins the stub axle to the axle beam and lets it swing for steering."
    why: "It is the steering pivot."
    q: "Pin on which the stub axle swivels?"
    a: "Kingpin."
    simple: "The hinge pin for steering."
  - id: f11
    topic: u6.axle
    difficulty: 2
    learn: "Modern cars with independent suspension use ball joints instead of kingpins."
    why: "Ball joints allow both steering and suspension movement."
    q: "What replaces kingpins in independent front suspension?"
    a: "Ball joints."
    simple: "Ball joints swivel in all directions."
  - id: f12
    topic: u6.axle
    difficulty: 2
    learn: "Thrust bearing between the stub axle and the beam carries the vehicle weight while letting the stub axle turn."
    why: "Makes steering light."
    q: "Bearing that takes vehicle weight at the kingpin?"
    a: "Thrust bearing."
    simple: "A bearing under the pivot for easy steering."
  - id: f13
    topic: u6.axle
    difficulty: 2
    learn: "Steering knuckle is the part carrying the stub axle, steering arm and brake parts."
    why: "It joins steering, suspension and wheel."
    q: "Part that carries the stub axle and steering arm?"
    a: "Steering knuckle."
    simple: "The joint that holds the wheel and turns."
  - id: sum
    topic: u6.axle
    type: summary
    points:
      - "Dead axle carries load; live axle also drives."
      - "Front beam: I-section middle, dropped centre, forged steel."
      - "Stub axle types: Elliott, reversed Elliott (common), Lemoine, reversed Lemoine."
      - "Kingpin pivot; ball joints in independent suspension."
      - "Thrust bearing carries weight at kingpin."

  # ---------- Suspension ----------
  - id: f01
    topic: u6.suspension
    difficulty: 1
    learn: "Suspension connects wheels to the frame and absorbs road shocks."
    why: "It gives comfort, keeps tyres on the road and protects the vehicle."
    q: "Main job of suspension?"
    a: "Absorb road shocks and keep wheels on road."
    simple: "It makes the ride smooth and safe."
  - id: f02
    topic: u6.suspension
    difficulty: 2
    learn: "Functions of suspension: comfort, road holding, stability on turns and braking, protect load and parts, carry weight."
    why: "Each is needed for safe driving."
    q: "Name two functions of suspension."
    a: "Comfort, road holding, stability, carry load."
    simple: "Comfort and grip."
  - id: f03
    topic: u6.suspension
    difficulty: 2
    learn: "Sprung weight: parts supported by springs (body, frame, engine). Unsprung weight: parts not supported by springs (wheels, tyres, axles, brakes)."
    why: "Low unsprung weight gives better ride and grip."
    q: "Is the wheel sprung or unsprung weight?"
    a: "Unsprung."
    simple: "Above springs = sprung. Below = unsprung."
  - id: f04
    topic: u6.suspension
    difficulty: 2
    learn: "Rigid axle (dependent) suspension: both wheels are on one axle, so a bump on one wheel affects the other."
    why: "The axle is a single beam."
    q: "Suspension where a bump on one wheel affects the other?"
    a: "Rigid axle (dependent) suspension."
    simple: "Both wheels joined by one bar."
  - id: f05
    topic: u6.suspension
    difficulty: 2
    learn: "Independent suspension: each wheel moves up and down separately."
    why: "Better comfort and road grip."
    q: "Main advantage of independent suspension?"
    a: "One wheel's bump does not affect the other; better ride."
    simple: "Each wheel moves on its own."
  - id: f06
    topic: u6.suspension
    difficulty: 2
    learn: "Independent front suspension types: MacPherson strut, double wishbone, trailing link, swinging axle."
    why: "MacPherson is the most common in cars."
    q: "Most common front suspension in cars?"
    a: "MacPherson strut."
    simple: "MacPherson strut for most cars."
  - id: f07
    topic: u6.suspension
    difficulty: 2
    learn: "MacPherson strut: a shock absorber and coil spring in one unit, which also acts as the steering pivot, with one lower arm."
    why: "Simple, compact and leaves room for engine."
    q: "In a MacPherson strut, what acts as the steering pivot?"
    a: "The strut itself (top mount and lower ball joint)."
    simple: "Spring + shock in one tube that also steers."
  - id: f08
    topic: u6.suspension
    difficulty: 2
    learn: "Double wishbone: upper and lower A-shaped arms hold the wheel. Gives good control of camber."
    why: "Used in SUVs, sports cars and premium cars."
    q: "Suspension with upper and lower A-arms?"
    a: "Double wishbone."
    simple: "Two triangle arms, one above, one below."
  - id: f09
    topic: u6.suspension
    difficulty: 2
    learn: "Two-wheeler front suspension: telescopic fork (most common), leading link, trailing link. Rear: swing arm with twin shocks or mono-shock."
    why: "Telescopic forks are simple and strong."
    q: "Most common motorcycle front suspension?"
    a: "Telescopic fork."
    simple: "Two sliding tubes with springs inside."
  - id: f10
    topic: u6.suspension
    difficulty: 2
    learn: "Three-wheeler (autorickshaw) front: single trailing/leading link with coil spring or torsion bar and shock absorber. Rear: swing arms with coil springs."
    why: "One front wheel needs a single-arm design."
    q: "Front suspension of an autorickshaw is usually?"
    a: "Single link (trailing/leading) with spring and shock absorber."
    simple: "One arm for the single front wheel."
  - id: f11
    topic: u6.suspension
    difficulty: 2
    learn: "Rear suspension types: rigid axle with leaf springs (trucks, buses), rigid axle with coil springs and links, twist beam (small FWD cars), independent multi-link."
    why: "Load capacity and cost decide the choice."
    q: "Rear suspension in most small front-wheel-drive cars?"
    a: "Twist (torsion) beam."
    simple: "A bendy beam linking the rear wheels."
  - id: f12
    topic: u6.suspension
    difficulty: 2
    learn: "Spring types used: leaf (laminated), coil, torsion bar, rubber, air (pneumatic), hydro-pneumatic."
    why: "Each stores energy in a different way."
    q: "Spring that twists to give springing action?"
    a: "Torsion bar."
    simple: "Leaf, coil, twist bar, rubber, air."
  - id: f13
    topic: u6.suspension
    difficulty: 2
    learn: "Leaf spring types: semi-elliptic (most common), quarter-elliptic, three-quarter elliptic, full elliptic, transverse."
    why: "Semi-elliptic suits trucks and buses."
    q: "Most common leaf spring type?"
    a: "Semi-elliptic."
    simple: "A curved stack of steel strips."
  - id: f14
    topic: u6.suspension
    difficulty: 2
    learn: "Leaf spring parts: master leaf with eyes, other leaves, centre bolt, rebound clips, U-bolts, spring seat, shackle."
    why: "Rebound clips keep leaves together on rebound."
    q: "What holds leaves together and stops them spreading on rebound?"
    a: "Rebound clips."
    simple: "Clips hold the stack together."
  - id: f15
    topic: u6.suspension
    difficulty: 2
    learn: "Leaves are of graded length so the spring has nearly uniform strength along its length."
    why: "Bending moment is highest at the centre."
    q: "Why do leaves have different lengths?"
    a: "To give uniform strength (more leaves at centre)."
    simple: "Thickest where bending is most."
  - id: f16
    topic: u6.suspension
    difficulty: 2
    learn: "Leaf springs also locate the axle and transmit driving and braking forces (Hotchkiss drive)."
    why: "No extra links needed."
    q: "Besides springing, what else do leaf springs do?"
    a: "Locate the axle and carry drive/brake forces."
    simple: "They spring and hold the axle in place."
  - id: f17
    topic: u6.suspension
    difficulty: 2
    learn: "Interleaf friction in a leaf spring damps vibration, but makes the ride harsher. Leaves are greased or have plastic inserts."
    why: "Too much friction stiffens the spring."
    q: "Why are leaf springs lubricated?"
    a: "To reduce interleaf friction and noise."
    simple: "Grease stops the leaves squeaking and sticking."
  - id: f18
    topic: u6.suspension
    difficulty: 2
    learn: "Spring shackle: a swinging link at one end of the leaf spring that allows the spring length to change as it flexes."
    why: "A bent spring gets longer when it straightens."
    q: "Why is a shackle fitted at one end of a leaf spring?"
    a: "To allow change in spring length during flexing."
    simple: "A swinging link lets the spring stretch."
  - id: f19
    topic: u6.suspension
    difficulty: 2
    learn: "Shackle pin connects the shackle to the spring eye and frame. Eyes have bushes (bronze or rubber)."
    why: "Pins and bushes wear and need greasing."
    q: "Pin joining the shackle and spring eye?"
    a: "Shackle pin."
    simple: "The pin through the spring eye."
  - id: f20
    topic: u6.suspension
    difficulty: 2
    learn: "Front end of a leaf spring is usually fixed to the frame by a bracket; the rear end has the shackle."
    why: "Fixed front end keeps the axle located during braking."
    q: "Which end of a leaf spring usually has the shackle?"
    a: "Rear end."
    simple: "Front fixed, rear swinging."
  - id: f21
    topic: u6.suspension
    difficulty: 2
    learn: "Helper spring: an extra small leaf spring above the main spring that works only under heavy load."
    why: "Soft ride when empty, strong support when loaded."
    example: "Pick-up trucks and lorries."
    q: "What is a helper spring?"
    a: "An extra spring that acts only under heavy load."
    simple: "A backup spring for heavy loads."
  - id: f22
    topic: u6.suspension
    difficulty: 2
    learn: "Coil springs: light, compact, need no lubrication, but cannot locate the axle, so links or arms are needed."
    why: "They only take vertical load."
    q: "Drawback of coil springs compared to leaf springs?"
    a: "Cannot locate axle/carry side or drive forces; need links."
    simple: "Coils only push up; arms are needed to hold the axle."
  - id: f23
    topic: u6.suspension
    difficulty: 2
    learn: "Coil spring arrangements: around the shock absorber (coil-over), between lower arm and body, on rigid axle with links (four-link, Panhard rod)."
    why: "Layout depends on suspension design."
    q: "A rod that stops sideways movement of a rigid axle?"
    a: "Panhard rod."
    simple: "A side rod to keep the axle centred."
  - id: f24
    topic: u6.suspension
    difficulty: 2
    learn: "Air suspension uses rubber air bags (bellows) with compressed air. A levelling valve keeps ride height constant with load."
    why: "Same ride height empty or full."
    example: "Volvo and Scania buses in KSRTC use air suspension."
    q: "Advantage of air suspension in buses?"
    a: "Constant height and soft ride at any load."
    simple: "Air bags adjust to the load."
  - id: f25
    topic: u6.suspension
    difficulty: 2
    learn: "Anti-roll bar (stabiliser bar) links left and right suspension to reduce body roll on turns."
    why: "It twists when one side moves more than the other."
    q: "Purpose of an anti-roll bar?"
    a: "Reduce body roll on turns."
    simple: "Stops the car leaning too much."
  - id: f26
    topic: u6.suspension
    difficulty: 1
    learn: "A shock absorber (damper) controls spring oscillations. It turns movement energy into heat in oil."
    why: "Without it, the car would keep bouncing after a bump."
    q: "Main function of a shock absorber?"
    a: "Damp spring oscillations."
    simple: "It stops the bouncing."
  - id: f27
    topic: u6.suspension
    difficulty: 2
    learn: "Springs absorb shocks; shock absorbers do not absorb shocks — they damp (calm) the spring movement."
    why: "Common PSC trap."
    q: "Do shock absorbers absorb road shocks?"
    a: "No — springs absorb, dampers control the bounce."
    simple: "Spring takes the hit; damper stops the bounce."
  - id: f28
    topic: u6.suspension
    difficulty: 2
    learn: "Telescopic shock absorber: piston with small valves moves in an oil-filled cylinder. Oil forced through valves resists motion."
    why: "Small holes slow the oil flow."
    q: "Most common type of shock absorber?"
    a: "Telescopic (hydraulic) type."
    simple: "A piston pushing oil through tiny holes."
  - id: f29
    topic: u6.suspension
    difficulty: 2
    learn: "Telescopic damper parts: inner pressure tube, outer reservoir tube, piston with valves, piston rod, foot (base) valve, seal and dust cover."
    why: "Twin-tube design keeps extra oil in the reservoir."
    q: "Tube that stores reserve oil in a twin-tube damper?"
    a: "Outer (reservoir) tube."
    simple: "Inner tube works, outer tube stores oil."
  - id: f30
    topic: u6.suspension
    difficulty: 2
    learn: "Shock absorbers usually resist more on rebound (extension) than on bump (compression)."
    why: "Soft bump for comfort, firm rebound to control bounce."
    q: "Is damping usually stronger on bump or rebound?"
    a: "Rebound."
    simple: "Easy going down, slow coming up."
  - id: f31
    topic: u6.suspension
    difficulty: 2
    learn: "Single-acting damper works only on rebound. Double-acting works on both bump and rebound. Most are double-acting."
    why: "Control in both directions is better."
    q: "Damper that works in both directions is called?"
    a: "Double-acting."
    simple: "Double-acting controls up and down."
  - id: f32
    topic: u6.suspension
    difficulty: 2
    learn: "Gas-charged (monotube) shock absorbers have nitrogen gas under pressure to stop oil foaming (aeration)."
    why: "Foamed oil gives weak damping."
    q: "Why is nitrogen filled in gas shock absorbers?"
    a: "Prevent oil foaming/aeration."
    simple: "Gas keeps the oil from bubbling."
  - id: f33
    topic: u6.suspension
    difficulty: 2
    learn: "Other damper types: lever arm (older), friction (old), adjustable and electronically controlled (adaptive) dampers."
    why: "Adaptive dampers change stiffness as needed."
    q: "Old type of damper using rubbing plates?"
    a: "Friction damper."
    simple: "Old dampers rubbed; new ones use oil."
  - id: f34
    topic: u6.suspension
    difficulty: 2
    learn: "Worn shock absorbers: car keeps bouncing, nose dives on braking, poor grip, uneven (cupped) tyre wear, oil leaks."
    why: "Damping is lost."
    q: "How can you check a shock absorber quickly?"
    a: "Bounce test: push down and see if it bounces more than once or twice."
    simple: "Push the car; it should settle quickly."
  - id: f35
    topic: u6.suspension
    difficulty: 2
    learn: "Rubber bump stops (bumpers) prevent metal-to-metal contact at full suspension travel."
    why: "They cushion the last bit of movement."
    q: "Purpose of bump stops?"
    a: "Prevent metal contact at full compression."
    simple: "Rubber blocks at the end of travel."
  - id: sum
    topic: u6.suspension
    type: summary
    points:
      - "Sprung vs unsprung weight; rigid vs independent."
      - "Front: MacPherson, double wishbone; bikes: telescopic fork."
      - "Leaf spring: master leaf, rebound clips, U-bolts, shackle at rear."
      - "Helper spring for heavy loads; anti-roll bar cuts roll."
      - "Springs absorb; telescopic dampers damp, stronger on rebound."

  # ---------- Steering ----------
  - id: f01
    topic: u6.steering
    difficulty: 1
    learn: "Steering system lets the driver turn the front wheels to change direction."
    why: "It must be light, precise and safe."
    q: "Main function of steering system?"
