    options: ["Motor cycle with gear", "Adapted vehicle", "Transport vehicle", "Medium goods vehicle"]
    key: D
    learn: "Section 10(2) DL classes: motor cycle without/with gear, LMV, transport vehicle, road roller, adapted vehicle, other notified classes. 'Medium goods vehicle' is not a class now."
    why: "The 1994 amendment merged medium and heavy classes into 'transport vehicle'."
  - n: 91
