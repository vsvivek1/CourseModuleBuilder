    options: ["Public service vehicle", "Private service vehicle", "Educational institution bus", "None of the above"]
    key: D
    a: "None — all three are transport vehicles."
    learn: "Section 2(47): transport vehicle = public service vehicle, goods carriage, educational institution bus or private service vehicle."
    why: "All vehicles used for carrying people or goods commercially or in bulk are transport vehicles."
  - n: 92
